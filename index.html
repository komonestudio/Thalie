  "requiredDocs": ["chaque pièce à fournir, avec le format et le nombre demandés (ex : Portfolio, 10 images maximum)"],
  "keyDates": [{"label": "ex : Annonce des résultats", "date": "AAAA-MM-JJ ou texte"}],
  "warnings": ["points d’attention : conditions piégeuses, exclusivité, droits, engagements, ambiguïtés du texte"],
  "contact": "adresse e-mail ou personne à contacter",
  "link": "lien officiel de l’appel ou de la plateforme de dépôt"
}`;

const parseCallReply = (reply) => {
  const o = parseLoose(reply, '{', '}');
  const str = (v) => (v === null || v === undefined ? '' : String(v).trim());
  const list = (v) => (Array.isArray(v) ? v.map(x => str(x)).filter(Boolean) : []);
  return {
    title: str(o.title),
    deadline: isIsoDate(o.deadline) ? str(o.deadline) : '',
    info: {
      organizer: str(o.organizer), link: str(o.link), summary: str(o.summary), eligibility: str(o.eligibility),
      fees: str(o.fees), themes: str(o.themes), contact: str(o.contact),
      warnings: list(o.warnings),
      keyDates: (Array.isArray(o.keyDates) ? o.keyDates : []).map(d => ({ label: str(d && d.label), date: str(d && d.date) })).filter(d => d.label),
      requiredDocs: list(o.requiredDocs).map(label => ({ label, done: false }))
    }
  };
};

const buildDossierText = (o, mediaList, documents) => {
  const docs = (o.docIds || []).map(id => documents.find(d => d.id === id)).filter(Boolean);
  const items = (o.mediaIds || []).map(id => mediaList.find(m => m.id === id)).filter(Boolean);
  const i = o.info || EMPTY_INFO;
  const section = (titre, contenu) => (contenu ? ['', titre, contenu] : []);
  return [
    'DOSSIER DE CANDIDATURE',
    o.title,
    '',
    `Date limite : ${o.deadline ? frDate(o.deadline) : 'non précisée'}`,
    i.organizer ? `Organisateur : ${i.organizer}` : null,
    o.match ? `Série / projet présenté : ${o.match}` : null,
    ...section('RÉSUMÉ DE L’APPEL', i.summary),
    ...section('ÉLIGIBILITÉ', i.eligibility),
    ...section('FRAIS / DOTATION', i.fees),
    ...section('THÈME / CONTRAINTES', i.themes),
    ...(i.keyDates && i.keyDates.length ? ['', 'DATES CLÉS', ...i.keyDates.map(d => `- ${d.label}${d.date ? ' : ' + dateText(d.date) : ''}`)] : []),
    ...(i.warnings && i.warnings.length ? ['', 'POINTS D’ATTENTION', ...i.warnings.map(w => `- ${w}`)] : []),
    ...(i.requiredDocs && i.requiredDocs.length ? ['', 'PIÈCES DEMANDÉES', ...i.requiredDocs.map(d => `- [${d.done ? 'x' : ' '}] ${d.label}`)] : []),
    ...section('CONTACT', i.contact),
    ...section('LIEN', i.link),
    '',
    'STATEMENT',
    o.statement || '(à écrire)',
    '',
    'DOCUMENTS À JOINDRE',
    ...(docs.length ? docs.map(d => `- ${d.kind} : ${d.title} (${d.name})`) : ['(aucun document joint)']),
    '',
    'PIÈCES DE L’ATELIER',
    ...(items.length
      ? items.map(m => `- [${TYPE_LABELS[m.type] || 'Photo'}] ${m.title}${(m.tags || []).length ? ' · ' + m.tags.join(', ') : ''}${m.notes ? ' · ' + m.notes : ''}`)
      : ['(aucune pièce choisie)'])
  ].filter(l => l !== null).join('\n');
};

function OpenCallsView({ onWin = () => {}, openCallsList, setOpenCallsList, mediaList = [], documents = [], setDocuments, notify }) {
  const [editId, setEditId] = useState(null);
  const [draft, setDraft] = useState(null);
  const [confirmId, setConfirmId] = useState(null);
  const [confirmDocId, setConfirmDocId] = useState(null);
  const [bridgeId, setBridgeId] = useState(null);
  const [docKind, setDocKind] = useState('Portfolio');
  const [docTitle, setDocTitle] = useState('');
  const [docFileKey, setDocFileKey] = useState(0);
  const [draftFileKey, setDraftFileKey] = useState(0);
  const [callFileKey, setCallFileKey] = useState(0);
  const [formKind, setFormKind] = useState('CV');
  const [formBridge, setFormBridge] = useState(false);
  const [detailsOpen, setDetailsOpen] = useState(false);
  const [section, setSection] = useState('calls');
  const [viewId, setViewId] = useState(null);
  const [pickerId, setPickerId] = useState(null);
  const [attachDocId, setAttachDocId] = useState(null);

  const candidateDocs = documents;
  const [callFilter, setCallFilter] = useState('all');
  const matchFilter = (o) => callFilter === 'all' || (callFilter === 'open' ? isCallOpen(o) : callStatus(o) === callFilter);
  const filteredCalls = sortCalls(openCallsList).filter(matchFilter);
  const callsUsing = (d) => openCallsList.filter(o => (o.docIds || []).includes(d.id));
  const isInCall = (o, d) => (o.docIds || []).includes(d.id);
  const toggleDocInCall = (o, d) => {
    setOpenCallsList(list => list.map(x => {
      if (x.id !== o.id) return x;
      const ids = x.docIds || [];
      return { ...x, docIds: ids.includes(d.id) ? ids.filter(i => i !== d.id) : [...ids, d.id] };
    }));
  };

  // Le PDF d'un appel appartient à l'appel : il n'est jamais rangé dans « Mes documents ».
  const isCommitted = (fileId) => openCallsList.some(o => o.callPdf && o.callPdf.fileId === fileId);
  const dropIfUncommitted = (pdf) => {
    if (pdf && !isCommitted(pdf.fileId)) deleteFile(pdf.fileId).catch(() => {});
  };
  const uploadCallPdf = async (f) => {
    if (!(f.type === 'application/pdf' || /\.pdf$/i.test(f.name))) {
      notify('Choisis un fichier PDF.');
      return null;
    }
    const id = 'f_' + Date.now();
    try {
      await saveFile(id, f);
    } catch (e) {
      notify(`Le navigateur n’a pas pu garder « ${f.name} ».`);
      return null;
    }
    notify('PDF de l’appel ajouté Il est gardé dans ce navigateur.');
    return { fileId: id, title: f.name.replace(/\.pdf$/i, ''), name: f.name, size: f.size, addedAt: toIso(new Date()) };
  };

  const addDocuments = async (files, kind, title) => {
    const pdfs = files.filter(f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name));
    if (pdfs.length === 0) {
      notify('Choisis un fichier PDF.');
      return [];
    }
    if (pdfs.length < files.length) notify('Seuls les PDF sont acceptés : les autres fichiers ont été ignorés.');
    const created = [];
    for (let i = 0; i < pdfs.length; i++) {
      const f = pdfs[i];
      const id = 'd_' + Date.now() + '_' + i;
      try {
        await saveFile(id, f);
      } catch (e) {
        notify(`Le navigateur n’a pas pu garder « ${f.name} ».`);
        continue;
      }
      created.push({
        id,
        fileId: id,
        kind,
        title: pdfs.length === 1 && title.trim() ? title.trim() : f.name.replace(/\.pdf$/i, ''),
        name: f.name,
        size: f.size,
        addedAt: toIso(new Date())
      });
    }
    if (created.length > 0) {
      setDocuments(list => [...created, ...list]);
      notify(created.length > 1 ? `${created.length} documents ajoutés` : 'Document ajouté Il est gardé dans ce navigateur.');
    }
    return created;
  };

  const removeDocument = (d) => {
    deleteFile(d.fileId).catch(() => {});
    setDocuments(list => list.filter(x => x.id !== d.id));
    setOpenCallsList(list => list.map(o => ({ ...o, docIds: (o.docIds || []).filter(id => id !== d.id) })));
    setDraft(dr => (dr ? { ...dr, docIds: dr.docIds.filter(id => id !== d.id) } : dr));
    setConfirmDocId(null);
    notify('Document supprimé.');
  };

  const startNew = () => {
    setViewId(null);
    setEditId('new');
    setDraft(draftFromCall({}));
    setConfirmId(null);
    setBridgeId(null);
    setFormBridge(false);
    setDetailsOpen(false);
  };
  const startEdit = (o) => {
    setEditId(o.id);
    setDraft(draftFromCall(o));
    setConfirmId(null);
    setBridgeId(null);
    setFormBridge(false);
    setDetailsOpen(false);
  };
  const toggleIn = (key, id) => setDraft(d => ({ ...d, [key]: d[key].includes(id) ? d[key].filter(x => x !== id) : [...d[key], id] }));
  const setField = (key) => (e) => setDraft(d => ({ ...d, [key]: e.target.value }));

  const saveCall = (e) => {
    e.preventDefault();
    if (!draft.title.trim()) {
      notify('Donne un titre à cet appel.');
      return;
    }
    const prevCall = editId === 'new' ? null : openCallsList.find(o => o.id === editId);
    if (prevCall && prevCall.callPdf && (!draft.callPdf || draft.callPdf.fileId !== prevCall.callPdf.fileId)) {
      deleteFile(prevCall.callPdf.fileId).catch(() => {});
    }
    if (editId === 'new') {
      setOpenCallsList(list => [{ id: 'o_' + Date.now(), ...callFromDraft(draft, []) }, ...list]);
    } else {
      setOpenCallsList(list => list.map(o => (o.id === editId ? { ...o, ...callFromDraft(draft, (o.info || EMPTY_INFO).requiredDocs) } : o)));
    }
    setEditId(null);
    setDraft(null);
    setFormBridge(false);
    notify('Appel enregistré');
  };

  const removeCall = (o) => {
    if (o.callPdf) deleteFile(o.callPdf.fileId).catch(() => {});
    setOpenCallsList(list => list.filter(x => x.id !== o.id));
    setConfirmId(null);
    setViewId(null);
    notify('Appel supprimé.');
  };

  const toggleRequired = (o, index) => {
    setOpenCallsList(list => list.map(x => (x.id === o.id
      ? { ...x, info: { ...x.info, requiredDocs: x.info.requiredDocs.map((d, j) => (j === index ? { ...d, done: !d.done } : d)) } }
      : x)));
  };

  const runStep = (o, id) => {
    if (id === 'read') { if (o.callPdf) setBridgeId(o.id); else startEdit(o); }
    else if (id === 'pieces' || id === 'statement') startEdit(o);
    else if (id === 'docs') setPickerId(o.id);
    else if (id === 'send') setCallStatus(o, 'Envoyée');
  };

  const setCallStatus = (o, status) => {
    setOpenCallsList(list => list.map(x => (x.id === o.id ? { ...x, status } : x)));
    if (status === 'Envoyée') { notify('Candidature envoyée, bravo'); onWin(); }
    else if (status === 'Acceptée') notify('Candidature acceptée, félicitations');
  };

  const applyCallReply = (o, reply) => {
    const r = parseCallReply(reply);
    if (!hasInfo(r)) throw new Error('réponse vide');
    const prev = (o.info && o.info.requiredDocs) || [];
    const info = { ...r.info, requiredDocs: r.info.requiredDocs.map(d => ({ ...d, done: !!prev.find(p => p.label === d.label && p.done) })) };
    const conflict = r.deadline && o.deadline && r.deadline !== o.deadline;
    setOpenCallsList(list => list.map(x => (x.id === o.id ? { ...x, title: x.title || r.title, deadline: x.deadline || r.deadline, info } : x)));
    setBridgeId(null);
    notify(conflict
      ? `Fiche remplie Attention : le PDF indique une date limite au ${frDate(r.deadline)}, ta fiche dit le ${frDate(o.deadline)}. Vérifie laquelle est la bonne.`
      : 'Fiche remplie par Thalie Relis-la avant de t’en servir.');
  };

  // Thalie lit l'appel depuis le formulaire : la réponse remplit les champs, rien n'est enregistré avant « Enregistrer ».
  const applyToDraft = (reply) => {
    const r = parseCallReply(reply);
    if (!hasInfo(r)) throw new Error('réponse vide');
    const conflict = r.deadline && draft.deadline && r.deadline !== draft.deadline;
    const deadlineBefore = draft.deadline;
    setDraft(d => ({
      ...d,
      title: d.title || r.title,
      deadline: d.deadline || r.deadline,
      organizer: r.info.organizer, link: r.info.link, summary: r.info.summary, eligibility: r.info.eligibility,
      fees: r.info.fees, themes: r.info.themes, contact: r.info.contact,
      warningsText: r.info.warnings.join('\n'),
      datesText: datesToText(r.info.keyDates),
      docsText: r.info.requiredDocs.map(x => x.label).join('\n')
    }));
    setDetailsOpen(true);
    setFormBridge(false);
    notify(conflict
      ? `Champs remplis Attention : le PDF indique une date limite au ${frDate(r.deadline)}, ta fiche dit le ${frDate(deadlineBefore)}. Vérifie, puis clique sur Enregistrer.`
      : 'Champs remplis par Thalie Relis-les, puis clique sur Enregistrer.');
  };

  const copyDossier = async (o) => {
    const ok = await copyText(buildDossierText(o, mediaList, documents));
    notify(ok ? 'Dossier copié' : 'Copie impossible : télécharge-le à la place.');
  };
  const downloadDossier = (o) => {
    saveBlobAs(new Blob([buildDossierText(o, mediaList, documents)], { type: 'text/plain;charset=utf-8' }), `dossier-${slugify(o.title) || 'candidature'}.txt`);
    notify('Dossier téléchargé Pense à joindre aussi tes PDF et tes visuels.');
  };

  const renderForm = () => (
    <div className="space-y-3">
      {formBridge && (
        <ThalieBridge
          title="Thalie lit l’appel à projets"
          prompt={buildCallPrompt({ title: draft.title, deadline: draft.deadline })}
          hint="Joins le PDF de l’appel à ta conversation avec Claude, puis colle le prompt : il lira le document pour remplir ces champs."
          attachment={draft.callPdf ? { label: 'Télécharger le PDF de l’appel', onClick: () => downloadDocument(draft.callPdf, notify) } : null}
          onApply={applyToDraft}
          onClose={() => setFormBridge(false)}
          notify={notify}
        />
      )}
    <form onSubmit={saveCall} className="fm-form">
      <h3 className="wd-h2 fm-title">{editId === 'new' ? 'Nouvel appel' : 'Modifier cet appel'}</h3>
      <div className="fm-grid">
      <div className="wd-card">
      <h4 className="wd-h">L’essentiel</h4>
      <input type="text" value={draft.title} onChange={setField('title')} placeholder="Intitulé de l’appel (ex : Résidence de création 2027)" aria-label="Intitulé" required className={FIELD_CLS} />
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <label className="flex items-center gap-2 text-xs font-bold text-stone-700">
          Date limite :
          <input type="date" value={draft.deadline} onChange={setField('deadline')} className="flex-1 p-2 bg-[#FAF7F2] border border-[#EBE5DA] rounded-xl text-xs text-stone-800" />
        </label>
        <input type="text" value={draft.match} onChange={setField('match')} placeholder="Série ou projet présenté" aria-label="Série ou projet présenté" className={FIELD_CLS} />
      </div>

      </div>

      <div className="wd-card">
        <h4 className="wd-h">PDF de l’appel à projets<InfoTip text="Le texte officiel de l’appel reste dans cet appel : il n’apparaît pas dans « Mes documents »." /></h4>
        {draft.callPdf && (
          <div className="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs bg-[#FAF7F2] border border-[#EBE5DA] rounded-xl px-3 py-2">
            <span className="flex-1 min-w-0 truncate">{draft.callPdf.title}{draft.callPdf.size ? ` · ${fmtSize(draft.callPdf.size)}` : ''}</span>
            <button type="button" onClick={() => { dropIfUncommitted(draft.callPdf); setDraft(d => ({ ...d, callPdf: null })); }} className="text-stone-400 hover:text-stone-700">Retirer</button>
          </div>
        )}
        <div className="flex flex-wrap items-center gap-2">
          <FileIn
            key={callFileKey}
            type="file"
            accept="application/pdf,.pdf"
            aria-label={draft.callPdf ? 'Remplacer le PDF de l’appel' : 'Ajouter le PDF de l’appel'}
            onChange={async (e) => {
              const f = (e.target.files || [])[0];
              if (!f) return;
              const pdf = await uploadCallPdf(f);
              if (pdf) {
                dropIfUncommitted(draft.callPdf);
                setDraft(d => ({ ...d, callPdf: pdf }));
              }
              setCallFileKey(k => k + 1);
            }}
            className="p-2 bg-white border border-[#EBE5DA] rounded-xl text-xs text-stone-700"
          />
          <button
            type="button"
            onClick={() => setFormBridge(v => !v)}
            className="bg-gradient-to-r from-[#2C2927] to-[#4A443F] text-white text-xs px-4 py-2 rounded-2xl font-semibold flex items-center gap-2"
          >
            <Sparkles className="w-4 h-4 text-amber-300" /> Demander à Thalie de lire l’appel
          </button>
        </div>
      </div>

      <details open={editId !== 'new' || detailsOpen} className="wd-card fm-wide">
        <summary className="wd-h" style={{ cursor: 'pointer' }}>Infos de l’appel (remplies par Thalie, modifiables)</summary>
        <div className="space-y-2 pt-2">
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <input type="text" value={draft.organizer} onChange={setField('organizer')} placeholder="Organisateur" aria-label="Organisateur" className={FIELD_CLS} />
            <input type="text" value={draft.contact} onChange={setField('contact')} placeholder="Contact" aria-label="Contact" className={FIELD_CLS} />
            <input type="url" value={draft.link} onChange={setField('link')} placeholder="Lien de l’appel ou du dépôt" aria-label="Lien" className={FIELD_CLS} />
            <input type="text" value={draft.themes} onChange={setField('themes')} placeholder="Thème / contraintes" aria-label="Thème" className={FIELD_CLS} />
          </div>
          <textarea value={draft.summary} onChange={setField('summary')} placeholder="Résumé de l’appel" aria-label="Résumé" className={FIELD_CLS + ' h-24'} />
          <textarea value={draft.eligibility} onChange={setField('eligibility')} placeholder="Qui peut candidater" aria-label="Éligibilité" className={FIELD_CLS + ' h-16'} />
          <textarea value={draft.fees} onChange={setField('fees')} placeholder="Frais, dotation, prise en charge" aria-label="Frais et dotation" className={FIELD_CLS + ' h-16'} />
          <textarea value={draft.docsText} onChange={setField('docsText')} placeholder={'Pièces demandées (une par ligne)\nex : CV, 2 pages maximum'} aria-label="Pièces demandées" className={FIELD_CLS + ' h-20'} />
          <textarea value={draft.datesText} onChange={setField('datesText')} placeholder={'Dates clés (une par ligne)\nex : Résultats : 2027-02-01'} aria-label="Dates clés" className={FIELD_CLS + ' h-16'} />
          <textarea value={draft.warningsText} onChange={setField('warningsText')} placeholder={'Points d’attention (un par ligne)'} aria-label="Points d’attention" className={FIELD_CLS + ' h-16'} />
        </div>
      </details>

      <div className="wd-card">
        <h4 className="wd-h">Ton statement</h4>
        <textarea value={draft.statement} onChange={setField('statement')} placeholder="Ton statement (ta démarche, en quelques lignes)…" aria-label="Statement" className={FIELD_CLS + ' h-28'} />
      </div>

      <div className="wd-card">
        <h4 className="wd-h">Documents à joindre</h4>
        {documents.length === 0 && <p className="text-xs text-stone-500">Aucun document pour l’instant : ajoute un PDF ci-dessous.</p>}
        {documents.map(d => (
          <label key={d.id} className="flex items-center gap-2 text-xs text-stone-700 bg-[#FAF7F2] border border-[#EBE5DA] rounded-xl px-3 py-2 cursor-pointer">
            <input type="checkbox" checked={draft.docIds.includes(d.id)} onChange={() => toggleIn('docIds', d.id)} className="w-4 h-4 rounded border-stone-300 text-amber-800" />
            <span>{DOC_ICONS[d.kind] || '📎'} <strong>{d.kind}</strong> · {d.title}</span>
          </label>
        ))}
        <div className="flex flex-wrap items-center gap-2">
          <select value={formKind} onChange={(e) => setFormKind(e.target.value)} aria-label="Type du PDF à ajouter" className="p-2 bg-white border border-[#EBE5DA] rounded-xl text-xs text-stone-800">
            {CANDIDATE_KINDS.map(k => <option key={k} value={k}>{k}</option>)}
          </select>
          <FileIn
            key={draftFileKey}
            type="file"
            accept="application/pdf,.pdf"
            multiple
            aria-label="Ajouter un PDF à ce dossier"
            onChange={async (e) => {
              const files = Array.from(e.target.files || []);
              if (files.length === 0) return;
              const created = await addDocuments(files, formKind, '');
              setDraft(d => ({ ...d, docIds: [...d.docIds, ...created.map(c => c.id)] }));
              setDraftFileKey(k => k + 1);
            }}
            className="p-2 bg-white border border-[#EBE5DA] rounded-xl text-xs text-stone-700"
          />
        </div>
      </div>

      <div className="wd-card fm-wide">
        <h4 className="wd-h">Pièces de l’atelier à présenter ({draft.mediaIds.length})</h4>
        {mediaList.length === 0 ? (
          <p className="text-xs text-stone-500">Ton atelier est vide : ajoute des photos, vidéos ou textes dans le Studio.</p>
        ) : (
          <div className="grid grid-cols-3 sm:grid-cols-4 gap-2 overflow-y-auto" style={{ maxHeight: '15rem' }}>
            {mediaList.map(m => {
              const on = draft.mediaIds.includes(m.id);
              return (
                <button type="button" key={m.id} onClick={() => toggleIn('mediaIds', m.id)} aria-pressed={on} className={`text-left p-1 rounded-xl border bg-white ${on ? 'border-[#2C2927] ring-2 ring-stone-900/10' : 'border-[#EFECE6]'}`}>
                  <MediaThumb key={m.url} m={m} />
                  <p className="text-xs text-stone-800 truncate mt-1 px-0.5">{on && <span className="text-emerald-700">✓ </span>}{m.title}</p>
                </button>
              );
            })}
          </div>
        )}
      </div>

      </div>
      <div className="fm-actions">
        <button type="submit" className="wd-btn wd-dark"><Check className="w-4 h-4" />Enregistrer</button>
        <button type="button" onClick={() => { dropIfUncommitted(draft && draft.callPdf); setEditId(null); setDraft(null); setFormBridge(false); }} className="wd-btn">Annuler</button>
      </div>
    </form>
    </div>
  );

  return (
    <div className="space-y-4">
      <div className="tl-ph flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div className="tl-titlerow">
          <h2 className="font-serif font-bold text-lg text-stone-900">Open calls & dossiers</h2>
          <InfoTip text="Ajoute le PDF d’un appel, demande à Thalie de le résumer, puis prépare ton dossier étape par étape. Un appel est l’annonce ; ta candidature est ton dossier." />
        </div>
        {section === 'calls' && (
          <button onClick={startNew} className="wd-btn wd-coralbtn self-start">
            <Plus className="w-4 h-4" /> Nouvel appel
          </button>
        )}
      </div>

      <div className="oc-bar">
        <div className="oc-seg">
          {[['calls', `Open calls (${openCallsList.length})`], ['docs', `Mes documents (${documents.length})`]].map(([k, label]) => (
            <button key={k} onClick={() => setSection(k)} aria-pressed={section === k} className={section === k ? 'on' : ''}>{label}</button>
          ))}
        </div>

// --- SAUVEGARDE COMPLÈTE (.zip) & RESTAURATION ---
// Le .zip contient « donnees.json » (textes, listes, réglages) et le dossier « fichiers/ »
// (photos, vidéos, PDF, images de profil) gardés dans le navigateur. Format ZIP « stocké » : lisible partout.
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
const crc32 = (bytes) => { let c = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };

async function buildZip(entries, onProgress) {
  const enc = new TextEncoder();
  const d = new Date();
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const parts = [];
  const central = [];
  let offset = 0;
  for (let i = 0; i < entries.length; i++) {
    const e = entries[i];
    const name = enc.encode(e.name);
    const size = e.blob.size;
    const crc = crc32(new Uint8Array(await e.blob.arrayBuffer()));
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, size, true); lh.setUint32(22, size, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(lh.buffer, name, e.blob);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, size, true); ch.setUint32(24, size, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(ch.buffer, name);
    offset += 30 + name.length + size;
    if (offset > 0xFFFFFFF0) throw new Error('trop volumineux');
    if (onProgress) onProgress(i + 1, entries.length);
  }
  const cdSize = central.reduce((s, p) => s + p.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
}

async function readZip(file) {
  const tail = new Uint8Array(await file.slice(Math.max(0, file.size - 66000)).arrayBuffer());
  let i = tail.length - 22;
  for (; i >= 0; i--) if (tail[i] === 0x50 && tail[i + 1] === 0x4b && tail[i + 2] === 5 && tail[i + 3] === 6) break;
  if (i < 0) throw new Error('zip');
  const end = new DataView(tail.buffer, tail.byteOffset + i);
  const count = end.getUint16(10, true), cdSize = end.getUint32(12, true), cdOff = end.getUint32(16, true);
  const cd = new DataView(await file.slice(cdOff, cdOff + cdSize).arrayBuffer());
  const dec = new TextDecoder();
  const map = {};
  let p = 0;
  for (let n = 0; n < count; n++) {
    if (cd.getUint32(p, true) !== 0x02014b50) throw new Error('zip');
    const nl = cd.getUint16(p + 28, true), el = cd.getUint16(p + 30, true), cl = cd.getUint16(p + 32, true);
    map[dec.decode(new Uint8Array(cd.buffer, p + 46, nl))] = { method: cd.getUint16(p + 10, true), crc: cd.getUint32(p + 16, true), csize: cd.getUint32(p + 20, true), off: cd.getUint32(p + 42, true) };
    p += 46 + nl + el + cl;
  }
  const get = async (name) => {
    const e = map[name];
    if (!e) return null;
    const lh = new DataView(await file.slice(e.off, e.off + 30).arrayBuffer());
    const start = e.off + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
    const raw = file.slice(start, start + e.csize);
    if (e.method === 0) return raw;
    if (e.method === 8 && typeof DecompressionStream !== 'undefined') return new Response(raw.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob();
    throw new Error('compression');
  };
  return { get, meta: (name) => map[name] };
}

const BACKUP_KEYS = ['media', 'posts', 'contacts', 'history', 'templates', 'opencalls', 'documents', 'profile', 'settings', 'wins'];

const listFiles = async () => {
  const db = await openFilesDb();
  return new Promise((resolve, reject) => {
    const out = [];
    const tx = db.transaction(FILES_STORE, 'readonly');
    const req = tx.objectStore(FILES_STORE).openCursor();
    req.onsuccess = () => { const c = req.result; if (c) { out.push({ key: c.key, value: c.value }); c.continue(); } };
    tx.oncomplete = () => { db.close(); resolve(out); };
    tx.onerror = tx.onabort = () => { db.close(); reject(tx.error); };
  });
};
const clearFiles = () => runFilesTx('readwrite', (store) => store.clear());
const sizeOfValue = (v) => (typeof v === 'string' ? v.length : (v && v.size) || 0);

const buildReadme = (manifest, fileCount) => {
  const n = (k) => (Array.isArray(manifest.data[k]) ? manifest.data[k].length : 0);
  return [
    'THALIE STUDIO · SAUVEGARDE COMPLÈTE',
    `Faite le ${frDate(manifest.exportedAt.slice(0, 10))}`,
    '',
    'CONTENU DE CETTE SAUVEGARDE',
    `- ${n('media')} média(s), ${n('posts')} post(s), ${n('contacts')} contact(s), ${n('opencalls')} appel(s), ${n('documents')} document(s), ${n('templates')} modèle(s)`,
    `- ${fileCount} fichier(s) : photos, vidéos, PDF et images de profil`,
    '',
    'DANS CE .ZIP',
    '- donnees.json : tes textes, listes et réglages.',
    '- fichiers/ : tes photos, vidéos, PDF et images, tels qu’ils étaient gardés dans le navigateur. Leur nom contient l’identifiant de la fiche à laquelle ils appartiennent (par exemple m_… pour un média, d_… pour un document) : ils servent à la restauration, pas à la lecture.',
    '',
    'POUR RESTAURER',
    '1. Ouvre THALIE Studio dans ton navigateur.',
    '2. Va dans « Sauvegarde », puis « Restaurer une sauvegarde ».',
    '3. Choisis ce fichier .zip, sans le décompresser.',
    '4. Clique sur « Sauvegarder l’état actuel, puis restaurer ».',
    '',
    'À SAVOIR',
    '- Ne modifie pas le contenu du .zip à la main : la restauration pourrait échouer.',
    '- Garde au moins une copie ailleurs que sur cet ordinateur (clé USB, disque externe, e-mail).',
    '- Pour récupérer un fichier seul, décompresse le .zip et ouvre le dossier fichiers/.'
  ].join('\n');
};

async function createFullBackup(onProgress) {
  const data = {};
  BACKUP_KEYS.forEach(k => {
    try { const raw = localStorage.getItem('thalie.' + k); if (raw !== null) data[k] = JSON.parse(raw); } catch (e) { /* clé illisible : ignorée */ }
  });
  if (Array.isArray(data.media)) data.media = dropBlobUrls(data.media);
  const files = await listFiles();
  const entries = [];
  const listed = files.map((f, i) => {
    const isText = typeof f.value === 'string';
    const path = `fichiers/${String(i + 1).padStart(4, '0')}_${String(f.key).replace(/[^a-zA-Z0-9._-]/g, '_')}`;
    entries.push({ name: path, blob: isText ? new Blob([f.value], { type: 'text/plain' }) : f.value });
    return { key: f.key, path, kind: isText ? 'string' : 'blob', type: isText ? '' : (f.value.type || '') };
  });
  const manifest = { kind: 'thalie-sauvegarde', version: 2, exportedAt: new Date().toISOString(), data, files: listed };
  entries.unshift({ name: 'donnees.json', blob: new Blob([JSON.stringify(manifest, null, 2)], { type: 'application/json' }) });
  entries.splice(1, 0, { name: 'LISEZ-MOI.txt', blob: new Blob([buildReadme(manifest, files.length)], { type: 'text/plain;charset=utf-8' }) });
  return { blob: await buildZip(entries, onProgress), count: files.length };
}

async function parseBackupFile(file) {
  if (/\.zip$/i.test(file.name) || /zip/.test(file.type)) {
    const zip = await readZip(file);
    const mf = await zip.get('donnees.json');
    if (!mf) throw new Error('format');
    const manifest = JSON.parse(await mf.text());
    if (manifest.kind !== 'thalie-sauvegarde' || !manifest.data) throw new Error('format');
    return { manifest, zip, legacy: false };
  }
  const o = JSON.parse(await file.text());
  const data = {};
  BACKUP_KEYS.forEach(k => { if (o && o[k] !== undefined) data[k] = o[k]; });
  if (!o || o.kind === 'thalie-reglages' || Object.keys(data).length === 0) throw new Error('format');
  return { manifest: { kind: 'thalie-sauvegarde', version: 1, exportedAt: o.exportedAt || '', data, files: [] }, zip: null, legacy: true };
}

async function applyBackup(parsed, onProgress) {
  const { manifest, zip, legacy } = parsed;
  const n = zip ? manifest.files.length : 0;
  let stage = 'read';
  try {
    // 1. Tout lire et vérifier avant de toucher à quoi que ce soit.
    const items = [];
    for (let i = 0; i < n; i++) {
      const f = manifest.files[i];
      const b = await zip.get(f.path);
      if (!b) throw new Error('fichier manquant : ' + f.key);
      items.push({ key: f.key, value: f.kind === 'string' ? await b.text() : new Blob([b], { type: f.type || '' }) });
      if (onProgress) onProgress(i + 1, 2 * n);
    }
    // 2. Écrire les fichiers de la sauvegarde, sans rien effacer d'abord.
    stage = 'files';
    for (let i = 0; i < items.length; i++) {
      await saveFile(items[i].key, items[i].value);
      if (onProgress) onProgress(n + i + 1, 2 * n);
    }
    // 3. Une fois tout écrit, retirer les fichiers qui ne font pas partie de la sauvegarde.
    if (zip) {
      const keep = new Set(items.map(it => it.key));
      const existing = await runFilesTx('readonly', (store) => store.getAllKeys());
      for (const k of existing) if (!keep.has(k)) await deleteFile(k);
    }
    // 4. Mettre à jour les listes en dernier, avec retour en arrière possible.
    stage = 'lists';
    const before = {};
    BACKUP_KEYS.forEach(k => { before[k] = localStorage.getItem('thalie.' + k); });
    try {
      BACKUP_KEYS.forEach(k => {
        if (manifest.data[k] !== undefined) localStorage.setItem('thalie.' + k, JSON.stringify(manifest.data[k]));
        else if (!legacy) localStorage.removeItem('thalie.' + k);
      });
    } catch (e) {
      BACKUP_KEYS.forEach(k => {
        try { if (before[k] === null) localStorage.removeItem('thalie.' + k); else localStorage.setItem('thalie.' + k, before[k]); } catch (e2) { /* rien de plus à faire */ }
      });
      throw e;
    }
    Object.keys(localStorage).filter(k => k.startsWith('thalie.draft.')).forEach(k => localStorage.removeItem(k));
    try { sessionStorage.setItem('thalie.restored', '1'); } catch (e) { /* facultatif */ }
  } catch (e) {
    e.stage = stage;
    throw e;
  }
}

async function verifyBackup(parsed, onProgress) {
  const { manifest, zip } = parsed;
  const problems = [];
  const notes = [];
  if (!zip) return { ok: true, checked: 0, bytes: 0, problems, notes };
  const files = manifest.files;
  let bytes = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    try {
      const b = await zip.get(f.path);
      if (!b) {
        problems.push(`Fichier absent du .zip : ${f.path}`);
      } else {
        const meta = zip.meta(f.path);
        const crc = crc32(new Uint8Array(await b.arrayBuffer()));
        bytes += b.size;
        if (meta && meta.crc !== undefined && crc !== meta.crc) problems.push(`Fichier abîmé : ${f.path}`);
      }
    } catch (e) {
      problems.push(`Fichier illisible : ${f.path}`);
    }
    if (onProgress) onProgress(i + 1, files.length);
  }
  const keys = new Set(files.map(f => f.key));
  const lost = (manifest.data.media || []).filter(m => m.fileId && !keys.has(m.fileId)).length
    + (manifest.data.documents || []).filter(d => d.fileId && !keys.has(d.fileId)).length
    + (manifest.data.opencalls || []).filter(o => o.callPdf && !keys.has(o.callPdf.fileId)).length;
  if (lost > 0) notes.push(`${lost} photo(s), vidéo(s) ou PDF sont listés mais sans fichier (déjà absents du navigateur d’origine) : ils s’afficheront avec une icône.`);
  return { ok: problems.length === 0, checked: files.length, bytes, problems, notes };
}

function CloudView({ notify, onBackupJson, onBackedUp, lastBackup, lastJson, backup }) {
  const [busy, setBusy] = useState('');
  const [prog, setProg] = useState(null);
  const [pending, setPending] = useState(null);
  const [stored, setStored] = useState(null);
  const [kinds, setKinds] = useState({ img: 0, vid: 0, pdf: 0, other: 0 });
  const restoreRef = React.useRef(null);
  const [storage, setStorage] = useState(null);
  const [check, setCheck] = useState(null);

  const readStorage = async () => {
    try {
      const st = navigator.storage;
      const persisted = st && st.persisted ? await st.persisted() : null;
      const est = st && st.estimate ? await st.estimate() : null;
      setStorage({ persisted, usage: est ? est.usage : 0, quota: est ? est.quota : 0 });
    } catch (e) {
      setStorage(null);
    }
  };
  useEffect(() => { readStorage(); }, [busy]);

  const protect = async () => {
    try {
      const ok = navigator.storage && navigator.storage.persist ? await navigator.storage.persist() : false;
      notify(ok
        ? 'Stockage protégé Le navigateur ne devrait plus effacer tes données automatiquement.'
        : 'Le navigateur n’a pas accordé la protection (cela dépend du navigateur et de la fréquence d’utilisation). Garde des sauvegardes complètes régulières.');
    } catch (e) {
      notify('Ce navigateur ne permet pas de protéger le stockage. Garde des sauvegardes complètes régulières.');
    }
    readStorage();
  };

  useEffect(() => {
    listFiles().then(fs => { setStored({ count: fs.length, bytes: fs.reduce((s, f) => s + sizeOfValue(f.value), 0) }); const k = { img: 0, vid: 0, pdf: 0, other: 0 }; fs.forEach(f => { const t = (f.value && f.value.type) || ''; const n = sizeOfValue(f.value); if (t.startsWith('image/') || typeof f.value === 'string') k.img += n; else if (t.startsWith('video/')) k.vid += n; else if (t === 'application/pdf') k.pdf += n; else k.other += n; }); setKinds(k); }).catch(() => setStored(null));
  }, [busy]);

  const downloadZip = async () => {
    setBusy('save');
    setProg({ i: 0, n: 1 });
    try {
      const { blob, count } = await createFullBackup((i, n) => setProg({ i, n }));
      saveBlobAs(blob, `thalie-sauvegarde-complete-${toIso(new Date())}.zip`);
      onBackedUp();
      notify(`Sauvegarde complète téléchargée (${count} fichier${count > 1 ? 's' : ''} inclus). Garde-la ailleurs aussi.`);
    } catch (e) {
      notify(String(e.message || '').includes('volumineux')
        ? 'La sauvegarde dépasse 4 Go : télécharge d’abord les données seules (.json) et copie tes vidéos à la main.'
        : 'La sauvegarde a échoué. Réessaie, ou télécharge les données seules (.json).');
    }
    setBusy('');
    setProg(null);
  };

  const pickRestore = async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    setBusy('read');
    try {
      const parsed = await parseBackupFile(f);
      setPending({ ...parsed, name: f.name });
      setCheck(null);
    } catch (err) {
      notify('Ce fichier n’est pas une sauvegarde Thalie (.zip complet ou .json de données).');
    }
    setBusy('');
  };

  const doRestore = async () => {
    setBusy('restore');
    setProg({ i: 0, n: 1 });
    try {
      await applyBackup(pending, (i, n) => setProg({ i, n }));
      window.location.reload();
    } catch (err) {
      const after = err.stage === 'read'
        ? 'Rien n’a été modifié.'
        : err.stage === 'files'
          ? 'Tes listes (posts, contacts, appels…) n’ont pas été modifiées, mais certains fichiers ont pu être remplacés par ceux de la sauvegarde.'
          : 'Tes listes ont été remises dans leur état d’avant, mais les fichiers ont déjà été remplacés par ceux de la sauvegarde.';
      notify('La restauration a échoué : ' + (err.message || 'fichier illisible') + '. ' + after);
      setBusy('');
      setProg(null);
    }
  };

  // Télécharge d'abord une sauvegarde complète de l'état actuel, puis restaure.
  const doSafeRestore = async () => {
    setBusy('save');
    setProg({ i: 0, n: 1 });
    try {
      const { blob } = await createFullBackup((i, n) => setProg({ i, n }));
      saveBlobAs(blob, `thalie-avant-restauration-${toIso(new Date())}.zip`);
      onBackedUp();
      notify('État actuel sauvegardé Restauration en cours…');
      await new Promise(r => setTimeout(r, 1200));
    } catch (e) {
      notify('Impossible de sauvegarder l’état actuel : la restauration n’a pas été lancée.');
      setBusy('');
      setProg(null);
      return;
    }
    setBusy('');
    await doRestore();
  };

  const runCheck = async () => {
    setBusy('check');
    setProg({ i: 0, n: 1 });
    setCheck(null);
    try {
      setCheck(await verifyBackup(pending, (i, n) => setProg({ i, n })));
    } catch (e) {
      setCheck({ ok: false, checked: 0, bytes: 0, problems: ['Impossible de lire cette sauvegarde.'], notes: [] });
    }
    setBusy('');
    setProg(null);
  };

  const sBytes = stored ? stored.bytes : 0;
  const tooBig = sBytes > 4e9;
  const heavy = sBytes > 1.5 * 1024 * 1024 * 1024 && !tooBig;

  const m = pending && pending.manifest;
  const count = (k) => (m && Array.isArray(m.data[k]) ? m.data[k].length : 0);

  const lastLabel = lastBackup ? `${frDate(lastBackup)} · il y a ${backup ? backup.n : 0} ${backup && backup.n > 1 ? 'jours' : 'jour'}` : 'Aucune sauvegarde complète pour l’instant';
  return (
    <div className="space-y-4">
      <div className="tl-ph">
        <div className="tl-titlerow">
          <h2 className="font-serif font-bold text-lg text-stone-900">Sauvegarde de mon studio</h2>
          <InfoTip text="Tout est gardé dans ce navigateur : si tu vides les données du site ou changes d’ordinateur, tu perds tout. Télécharge régulièrement la sauvegarde complète et garde-la ailleurs (clé USB, e-mail, disque externe)." />
        </div>
      </div>

      <div className="sv-split">
        <div className="sv-col">
          <div className="sv-coral">
            <div className="flex items-center gap-3">
              <span className="sv-ic"><ShieldCheck className="w-5 h-5" /></span>
              <div><b className="sv-t">Dernière sauvegarde complète</b><span className="sv-s">{lastLabel}{backup && backup.due ? ' · à refaire' : ''}</span></div>
            </div>
            <button onClick={downloadZip} disabled={!!busy || tooBig} className="sv-big"><Download className="w-4 h-4" /> Télécharger la sauvegarde complète (.zip)</button>
            <button onClick={onBackupJson} disabled={!!busy} className="sv-ghost">Données seules (.json)</button>
            <p className="sv-note">Le .zip contient tes textes, posts, contacts, appels, réglages <strong>et</strong> tes photos, vidéos, PDF et images de profil. Le .json ne contient que les textes et les listes.</p>
            {busy === 'save' && prog && (
              <div className="space-y-1" role="status">
                <p className="sv-note">Préparation de la sauvegarde… {prog.i}/{prog.n}</p>
                <div className="tl-prog"><div style={{ width: `${(prog.i / prog.n) * 100}%` }} /></div>
              </div>
            )}
          </div>

          <div className="wd-card">
            <h3 className="wd-h">Ce qui est gardé ici</h3>
            <div className="sv-meter" aria-hidden="true">
              {(() => { const t = Math.max(1, kinds.img + kinds.vid + kinds.pdf + kinds.other); return [[kinds.img, 'var(--accent)'], [kinds.vid, 'var(--p-lav)'], [kinds.pdf, 'var(--p-butter)'], [kinds.other, 'var(--p-mint)']].map(([n, col], i) => <i key={i} style={{ width: `${(n / t) * 100}%`, background: col }} />); })()}
            </div>
            <div className="sv-leg">
              <span><i style={{ background: 'var(--accent)' }} />Photos {fmtSize(kinds.img) || '0 Ko'}</span>
              <span><i style={{ background: 'var(--p-lav)' }} />Vidéos {fmtSize(kinds.vid) || '0 Ko'}</span>
              <span><i style={{ background: 'var(--p-butter)' }} />PDF {fmtSize(kinds.pdf) || '0 Ko'}</span>
            </div>
            <div className="sv-stat"><b>Fichiers dans ce navigateur</b><span>{stored ? `${stored.count} · ${fmtSize(stored.bytes) || '0 Ko'}` : '…'}</span></div>
            <div className="sv-stat"><b>Cloud (Firebase)</b><span>Bientôt</span></div>
            <details className="sv-more">
              <summary>Plus de détails</summary>
<div className="space-y-2">
          <div className="sv-stat">
            <b>Enregistrement dans ce navigateur</b>
            <span className="text-emerald-700 font-bold">● Actif</span>
          </div>
          <div className="sv-stat">
            <b>Photos, vidéos, PDF et images gardés ici</b>
            <span className="">{stored ? `${stored.count} fichier${stored.count > 1 ? 's' : ''}${stored.bytes ? ' · ' + fmtSize(stored.bytes) : ''}` : '…'}</span>
          </div>
          <div className="sv-stat">
            <b>Dernière sauvegarde complète (.zip)</b>
            <span className={`font-bold ${backup && backup.due ? 'text-rose-700' : 'text-emerald-700'}`}>
              {lastBackup ? `${frDate(lastBackup)} (il y a ${backup ? backup.n : 0} j)` : 'Aucune pour l’instant'}
            </span>
          </div>
          <div className="sv-stat">
            <b>Dernières données seules (.json)</b>
            <span className="">{lastJson ? frDate(lastJson) : 'Jamais'}</span>
          </div>
          <div className="sv-stat">
            <b>Protection du stockage</b>
            <span className={`font-bold ${storage && storage.persisted ? 'text-emerald-700' : storage && storage.persisted === false ? 'text-rose-700' : 'text-stone-500'}`}>
              {storage ? (storage.persisted ? '● Protégé' : storage.persisted === false ? '○ Non protégé' : 'Inconnu') : '…'}
            </span>
          </div>
          {storage && storage.quota > 0 && (
            <div className="sv-stat">
              <b>Espace utilisé par le site</b>
              <span className="">{fmtSize(storage.usage) || '0 Ko'} sur {fmtSize(storage.quota)}</span>
            </div>
          )}
          <div className="sv-stat">
            <b>Cloud (Firebase)</b>
            <span className="">○ Non connecté (étape 2)</span>
          </div>
        </div>

            </details>
        {storage && storage.persisted === false && (
          <div className="sv-warn space-y-2">
            <p>Selon ton navigateur, ces données peuvent être effacées automatiquement s’il manque de place, ou si tu n’ouvres pas le site pendant un certain temps (c’est notamment le cas de Safari après environ une semaine sans visite). La protection n’est jamais garantie : la sauvegarde complète reste ta vraie sécurité.</p>
            <button onClick={protect} className="font-bold underline">Protéger mes données</button>
          </div>
        )}

        {stored && stored.count > 0 && (
          <p className="text-xs text-stone-500">Taille estimée de la sauvegarde complète : environ {fmtSize(stored.bytes + 50 * 1024)} ({stored.count} fichier{stored.count > 1 ? 's' : ''} et tes données).</p>
        )}
        {tooBig && (
          <div className="sv-bad">
            ⛔ Tes fichiers dépassent 4 Go : le format .zip ne peut pas les contenir. Télécharge les données seules (.json) et garde les originaux de tes photos et vidéos sur ton ordinateur ou un disque externe.
          </div>
        )}
        {heavy && (
          <div className="sv-warn">
            Sauvegarde volumineuse : la préparation peut être longue et saturer la mémoire du navigateur. Ferme tes autres onglets avant de la lancer, et garde aussi les originaux de tes vidéos à part.
          </div>
        )}
        {false && (
          <div className="space-y-1" role="status">
            <p className="text-xs text-stone-600">Préparation de la sauvegarde… {prog.i}/{prog.n}</p>
            <div className="tl-prog"><div style={{ width: `${(prog.i / prog.n) * 100}%` }} /></div>
          </div>
        )}
          </div>
        </div>

        <div className="sv-col">
      <div className="wd-card">
        <h3 className="wd-h">Restaurer une sauvegarde<InfoTip text="Choisis un fichier .zip (sauvegarde complète) ou .json (données seules). Rien n’est modifié avant ta confirmation." /></h3>
        <input ref={restoreRef} type="file" accept=".zip,.json,application/zip,application/json" onChange={pickRestore} className="hidden" aria-label="Choisir une sauvegarde à restaurer" />
        {!pending && (
          <button onClick={() => restoreRef.current && restoreRef.current.click()} disabled={!!busy} className="sv-drop disabled:opacity-60">
            <Upload className="w-6 h-6" />Choisis ta sauvegarde<small>fichier .zip ou .json</small>
          </button>
        )}
        {pending && (
          <div className="tl-restore" role="alertdialog" aria-label="Confirmer la restauration">
            <p><strong>{pending.name}</strong>{m.exportedAt ? ` · faite le ${frDate(m.exportedAt.slice(0, 10))}` : ''}</p>
            <p>
              {count('media')} média{count('media') > 1 ? 's' : ''} · {count('posts')} post{count('posts') > 1 ? 's' : ''} · {count('contacts')} contact{count('contacts') > 1 ? 's' : ''} · {count('opencalls')} appel{count('opencalls') > 1 ? 's' : ''} · {count('documents')} document{count('documents') > 1 ? 's' : ''} · {count('templates')} modèle{count('templates') > 1 ? 's' : ''}
              {pending.legacy ? '' : ` · ${m.files.length} fichier${m.files.length > 1 ? 's' : ''}`}
            </p>
            {pending.legacy && <p>Ce .json ne contient pas les photos, vidéos ni PDF : ceux déjà présents dans ce navigateur sont conservés, les autres devront être ré-importés.</p>}
            <p><strong>Tes données actuelles seront remplacées</strong> par celles de cette sauvegarde. Le plus prudent : « Sauvegarder l’état actuel, puis restaurer ».</p>
            <div className="flex flex-wrap items-center gap-2">
              <button onClick={doSafeRestore} disabled={!!busy} className="bg-[#2C2927] hover:bg-black disabled:opacity-60 text-white text-xs px-4 py-2 rounded-xl font-bold">Sauvegarder l’état actuel, puis restaurer</button>
              <button onClick={doRestore} disabled={!!busy} className="bg-amber-800 hover:bg-amber-900 disabled:opacity-60 text-white text-xs px-4 py-2 rounded-xl font-bold">Remplacer directement</button>
              <button onClick={() => { setPending(null); setCheck(null); }} disabled={!!busy} className="bg-[#F4F0EA] text-stone-800 text-xs px-4 py-2 rounded-xl font-semibold">Annuler</button>
            </div>
            <div className="flex flex-wrap items-center gap-2">
              <button onClick={runCheck} disabled={!!busy} className="bg-white border border-[#EBE5DA] disabled:opacity-60 text-stone-800 text-xs px-4 py-2 rounded-xl font-semibold">Vérifier sans restaurer</button>
            </div>
            {busy === 'check' && prog && (
              <div className="space-y-1" role="status">
                <p>Vérification… {prog.i}/{prog.n}</p>
                <div className="tl-prog"><div style={{ width: `${(prog.i / prog.n) * 100}%` }} /></div>
              </div>
            )}
            {check && (
              <div role="status" className="space-y-1">
                {check.ok ? (
                  <p><strong>Sauvegarde en bon état</strong>{check.checked > 0 ? ` : ${check.checked} fichier${check.checked > 1 ? 's' : ''} vérifié${check.checked > 1 ? 's' : ''}${check.bytes ? ' (' + fmtSize(check.bytes) + ')' : ''}.` : ' : les données sont lisibles (ce .json ne contient pas de fichiers).'}</p>
                ) : (
                  <div>
                    <p><strong>Problèmes détectés</strong></p>
                    <ul className="list-disc pl-5">{check.problems.slice(0, 6).map((p, i) => <li key={i}>{p}</li>)}</ul>
                    {check.problems.length > 6 && <p>… et {check.problems.length - 6} autre{check.problems.length - 6 > 1 ? 's' : ''}.</p>}
                  </div>
                )}
                {check.notes.map((n, i) => <p key={i}>ℹ️ {n}</p>)}
              </div>
            )}
            {busy === 'restore' && prog && (
              <div className="space-y-1" role="status">
                <p>Restauration… {prog.i}/{prog.n}</p>
                <div className="tl-prog"><div style={{ width: `${(prog.i / prog.n) * 100}%` }} /></div>
              </div>
            )}
          </div>
        )}
      </div>
        </div>
      </div>
    </div>
  );
}

const toIso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

});
const copyText = async (text) => {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e2) {
      return false;
    }
  }
};
const parseLoose = (txt, open, close) => {
  const t = txt.replace(/```json|```/g, '');
  return JSON.parse(t.slice(t.indexOf(open), t.lastIndexOf(close) + 1));
};
const mediaLine = (m, max) =>

Éléments du post (photos, vidéos, textes) :
${items.map(m => mediaLine(m, 1500)).join('\n')}

Si des images sont jointes à cette conversation, appuie-toi sur ce que tu y vois réellement (couleurs, matière, gestes), sans rien inventer.

Écris trois versions : instagram (légende chaleureuse, 3 à 5 hashtags à la fin), linkedin (sobre et professionnel), newsletter (court paragraphe d’introduction pour les abonnés).
Règles : français irréprochable (orthographe, grammaire, ponctuation), aucune formule toute faite du type « Plongez dans le monde de… » ou « En tant qu’artiste… », aucune dimension, aucun prix ni aucune technique que l’artiste n’a pas donnés.
Réponds uniquement par un objet JSON valide avec exactement les clés "instagram", "linkedin", "newsletter", sans aucun texte autour.`;

function buildCombosPrompt(mediaList) {

Propose 3 à 5 combinaisons de 1 à 4 éléments qui feraient un bon post. Appuie-toi sur les mots-clés communs, les dates d’ajout proches (une série, un moment d’atelier) et le lien entre les textes et les visuels. Un élément peut apparaître dans plusieurs combinaisons. N’utilise que les identifiants fournis. N’écris pas le post lui-même.
Réponds uniquement par un tableau JSON, sans texte autour : [{"title":"titre court du post","ids":["id1","id2"],"reason":"une phrase qui explique le lien"}]`;

// --- FICHIERS GARDÉS DANS LE NAVIGATEUR (IndexedDB) ---
const FILES_DB = 'thalie-files';
const FILES_STORE = 'files';
const openFilesDb = () => new Promise((resolve, reject) => {
  const req = indexedDB.open(FILES_DB, 1);
  req.onupgradeneeded = () => req.result.createObjectStore(FILES_STORE);
  req.onsuccess = () => resolve(req.result);
  req.onerror = () => reject(req.error);
});
const runFilesTx = async (mode, action) => {
  const db = await openFilesDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(FILES_STORE, mode);
    const req = action(tx.objectStore(FILES_STORE));
    tx.oncomplete = () => { db.close(); resolve(req.result); };
    tx.onerror = tx.onabort = () => { db.close(); reject(tx.error); };
  });
};
const saveFile = (id, file) => {
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  return runFilesTx('readwrite', (store) => store.put(file, id));
};
const loadFile = (id) => runFilesTx('readonly', (store) => store.get(id));
const deleteFile = (id) => runFilesTx('readwrite', (store) => store.delete(id));

const VIDEO_EXT_RE = /\.(mp4|webm|mov|m4v|ogv)(\?|#|$)/i;
const isVideoSource = (m) =>
  m.type === 'video' && !!m.url && ((m.mime || '').startsWith('video/') || VIDEO_EXT_RE.test(m.url));

function MediaThumb({ m }) {
  const [failed, setFailed] = useState(false);
  if (m.type === 'text') {
    return <div className="h-24 p-2 bg-[#FAF7F2] rounded-xl text-xs text-stone-600 overflow-hidden">{(m.notes || '').slice(0, 110)}</div>;

  if (!m.url || failed) {
    return <div className="h-24 bg-[#FAF7F2] rounded-xl flex items-center justify-center text-2xl">{TYPE_ICONS[m.type]}</div>;
  }
  if (isVideoSource(m)) {
    return (
      <div className="relative">
        <video
          src={m.url.includes('#') ? m.url : m.url + '#t=0.1'}
          muted
          playsInline
          preload="metadata"
          onError={() => setFailed(true)}
          className="w-full h-24 object-cover rounded-xl bg-[#F4F0EA] pointer-events-none"
        />
        <span className="absolute bottom-1.5 right-1.5 bg-[#2C2927] rounded-full p-1">
          <Play className="w-3 h-3 text-white" />
        </span>

  return <img src={m.url} alt={m.title} onError={() => setFailed(true)} className="w-full h-24 object-cover rounded-xl" />;
}

function BigPreview({ m }) {
  const [failed, setFailed] = useState(false);
  if (m.type === 'text') return null;
  if (!m.url || failed) {
    return <div className="h-40 bg-[#FAF7F2] rounded-xl flex items-center justify-center text-4xl">{TYPE_ICONS[m.type]}</div>;
  }
  if (isVideoSource(m)) {
    return <video src={m.url} controls playsInline onError={() => setFailed(true)} className="w-full rounded-xl bg-[#F4F0EA]" style={{ maxHeight: '55vh' }} />;
  }
  return <img src={m.url} alt={m.title} onError={() => setFailed(true)} className="w-full rounded-xl bg-[#F4F0EA] object-contain" style={{ maxHeight: '55vh' }} />;
}

// --- STUDIO : atelier multi-médias + composition d'un post ---
function StudioView({ mediaList, setMediaList, postsList, setPostsList, templates = [], notify, onRitualDone, intent, onIntentDone, openDeposit }) {
  const mobile = useMedia('(max-width: 820px)');
  const [openPlat, setOpenPlat] = useState({});
  const [showAdd, setShowAdd] = useState(false);
  const [addType, setAddType] = useState('image');
  const [form, setForm] = useState({ title: '', tags: '', notes: '', url: '' });
  const [files, setFiles] = useState([]);
  const [typeFilter, setTypeFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [selectedIds, setSelectedIds] = usePersistentState('thalie.draft.selection', []);
  const [postTitle, setPostTitle] = usePersistentState('thalie.draft.title', '');
  const [texts, setTexts] = usePersistentState('thalie.draft.texts', { instagram: '', linkedin: '', gmail: '' });
  const [bridge, setBridge] = useState(null);
  const [proposals, setProposals] = useState([]);
  const [stash, setStash] = usePersistentState('thalie.draft.stash', null);
  const [openId, setOpenId] = useState(null);
  const [edit, setEdit] = useState({ title: '', notes: '', tags: '' });
  const [confirmId, setConfirmId] = useState(null);
  const [planDate, setPlanDate] = useState(toIso(new Date()));
  const [planTime, setPlanTime] = useState('18:00');

  useEffect(() => {
    if (!openId) return;
    const onKey = (e) => { if (e.key === 'Escape') setOpenId(null); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [openId]);

  const selected = selectedIds.map(id => mediaList.find(m => m.id === id)).filter(Boolean);
  const parseTags = (t) => t.split(',').map(x => x.trim().replace(/^#/, '')).filter(Boolean);
  // Demande venue de la pastille ou du widget Thalie.
  useEffect(() => {
    if (!intent) return;
    if (intent === 'combos') {
      if (mediaList.length < 2) notify('Ajoute au moins deux contenus à l’atelier.'); else setBridge('combos');
    } else if (intent === 'write') {
      if (selected.length === 0) notify('Sélectionne d’abord un ou plusieurs éléments, puis demande à Thalie.'); else setBridge('write');
    }
    if (onIntentDone) onIntentDone();
  }, [intent]);

  const handleAdd = (e) => {
    e.preventDefault();
    const base = {
      notes: form.notes.trim(),
      tags: parseTags(form.tags),
      date: 'À l’instant',
      addedAt: toIso(new Date()),
      status: 'draft',
      manualPosts: { instagram: '', linkedin: '', gmail: '' }
    };
    let items = [];
    if (addType === 'text') {
      if (!form.notes.trim()) { notify('Écris ton texte avant de l’ajouter.'); return; }
      items = [{ ...base, id: 'm_' + Date.now(), type: 'text', url: '', title: form.title.trim() || form.notes.trim().slice(0, 40) }];
    } else if (files.length > 0) {
      items = files.map((f, i) => {
        const id = 'm_' + Date.now() + '_' + i;
        return {
          ...base,
          id,
          fileId: id,
          mime: f.type,
          type: addType,
          url: URL.createObjectURL(f),
          title: files.length === 1 && form.title.trim() ? form.title.trim() : f.name.replace(/\.[^.]+$/, '')
        };
      });
    } else if (form.url.trim()) {
      items = [{ ...base, id: 'm_' + Date.now(), type: addType, url: form.url.trim(), title: form.title.trim() || 'Sans titre' }];
    } else {
      notify('Choisis un fichier ou colle un lien.');
      return;
    }
    setMediaList([...items, ...mediaList]);
    setForm({ title: '', tags: '', notes: '', url: '' });
    const sent = files;
    setFiles([]);
    if (sent.length === 0) {
      notify('Ajouté à l’atelier');
      return;
    }
    Promise.all(items.map((it, i) => saveFile(it.fileId, sent[i])))
      .then(() => notify('Ajouté à l’atelier Tes fichiers sont gardés dans ce navigateur.'))
      .catch(() => notify('Ajouté, mais le navigateur n’a pas pu garder les fichiers : ils ne resteront que pour cette session.'));
  };

  const BLANK_TEXTS = { instagram: '', linkedin: '', gmail: '' };
  const sameTexts = (a, b) => Object.keys(BLANK_TEXTS).every(k => ((a || {})[k] || '') === ((b || {})[k] || ''));

  // Change la sélection et recharge les textes qui lui appartiennent.
  // Des textes non enregistrés ne sont jamais perdus : ils sont mis de côté.
  const changeSelection = (next, title = '') => {
    const saved = next.length === 1 ? (mediaList.find(x => x.id === next[0]) || {}).manualPosts : null;
    const target = { ...BLANK_TEXTS, ...(saved || {}) };
    if (!sameTexts(texts, target)) {
      const baseline = selected.length === 1 ? selected[0].manualPosts : BLANK_TEXTS;
      const hasUnsaved = Object.values(texts).some(t => t.trim()) && !sameTexts(texts, baseline);
      if (hasUnsaved) setStash(texts);
    }
    setSelectedIds(next);
    setPostTitle(title);
    setTexts(target);
  };

  const toggleSelect = (id) =>
    changeSelection(selectedIds.includes(id) ? selectedIds.filter(x => x !== id) : [...selectedIds, id]);

  const restoreStash = () => {
    setTexts(stash);
    setStash(null);
  };

  const updateTags = (id, value) => setMediaList(mediaList.map(m => m.id === id ? { ...m, tags: parseTags(value) } : m));
  const removeItem = (id) => {
    const gone = mediaList.find(m => m.id === id);
    if (gone && gone.fileId) deleteFile(gone.fileId).catch(() => {});
    if (gone && gone.url && gone.url.startsWith('blob:')) URL.revokeObjectURL(gone.url);
    setMediaList(mediaList.filter(m => m.id !== id));
    if (selectedIds.includes(id)) changeSelection(selectedIds.filter(x => x !== id));
  };

  const openItem = mediaList.find(m => m.id === openId);
  const openCard = (m) => {
    setOpenId(m.id);
    setEdit({ title: m.title, notes: m.notes || '', tags: (m.tags || []).join(', ') });
  };
  const saveCard = () => {
    const notes = edit.notes.trim();
    setMediaList(mediaList.map(m => m.id === openId
      ? { ...m, title: edit.title.trim() || (m.type === 'text' ? notes.slice(0, 40) : m.title), notes, tags: parseTags(edit.tags) }
      : m));
    setOpenId(null);
    notify('Fiche enregistrée');
  };

  const filtered = mediaList.filter(m => {
    const okType = typeFilter === 'all' || m.type === typeFilter;
    const q = search.trim().toLowerCase();
    const okSearch = !q || `${m.title} ${(m.tags || []).join(' ')} ${m.notes || ''}`.toLowerCase().includes(q);
    return okType && okSearch;
  });

  const openWrite = () => {
    if (selected.length === 0) { notify('Sélectionne d’abord un ou plusieurs éléments.'); return; }
    setBridge('write');
  };

  const applyWrite = (reply) => {
    const o = parseLoose(reply, '{', '}');
    setTexts({ instagram: String(o.instagram || ''), linkedin: String(o.linkedin || ''), gmail: String(o.newsletter || o.gmail || '') });
    setBridge(null);
    notify('Textes de Thalie importés : relis-les et ajuste-les');
  };

  const applyCombos = (reply) => {
    const arr = parseLoose(reply, '[', ']');
    const valid = (Array.isArray(arr) ? arr : [])
      .map(p => ({
        title: String(p.title || 'Idée de post'),
        reason: String(p.reason || ''),
        ids: (Array.isArray(p.ids) ? p.ids : []).filter(id => mediaList.some(m => m.id === id)).slice(0, 4)
      }))
      .filter(p => p.ids.length > 0)
      .slice(0, 5);
    setProposals(valid);
    setBridge(null);
    notify(valid.length ? 'Propositions importées' : 'Aucune association trouvée : ajoute des mots-clés ou des notes.');
  };

  const pickProposal = (p) => changeSelection(p.ids, p.title);

  const saveToItem = () => {
    if (selected.length !== 1) return;
    setMediaList(mediaList.map(m => m.id === selected[0].id ? { ...m, manualPosts: { ...texts }, status: 'ready' } : m));
    notify('Textes enregistrés sur cet élément ✅');
  };

  const insertTemplate = (platform, title) => {
    const tpl = templates.find(t => (t.id || t.title) === title);
    if (!tpl) return;
    setTexts({ ...texts, [platform]: (texts[platform] ? texts[platform] + '\n\n' : '') + tpl.content });
  };

  const toAgenda = (platform) => {
    if (!texts[platform].trim()) { notify('Écris d’abord le texte pour ce réseau.'); return; }
    const first = selected[0];
    const day = planDate || toIso(new Date());
    const at = planTime || '18:00';
    const newPost = {
      id: 'p_' + Date.now(),
      title: `${postTitle || (first ? first.title : 'Post')} · ${PLATFORMS[platform]}`,
      platform,
      content: texts[platform],
      date: day,
      time: at,
      dayIndex: (new Date(day + 'T12:00:00').getDay() + 6) % 7,
      status: 'draft',

            {m.type === 'text'

            <button className="at-mmore" onClick={(e) => { e.stopPropagation(); openCard(m); }} aria-label={`Voir / modifier ${m.title}`}><MoreIcon className="w-4 h-4" /></button>
          </div>
        );
      })}
