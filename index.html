`,LDH_PAGES=[{id:"0",short:"Ma transition",title:"Je passe de la micro-entreprise à artiste-auteur",kw:["micro-entreprise","Guichet unique","changement d’activité","transition","radiation"],md:"**Réponse courte :** tes ventes d'œuvres ne se facturent plus en micro-entreprise ; elles relèvent du régime des artistes-auteurs, géré par l'Urssaf Limousin. Tu attends l'attestation d'affiliation et le code d'activation de ton espace en ligne.\n\n**Pour qui ?** Une artiste qui vendait ses œuvres en micro-entreprise (ex. auto-entrepreneur) et change de statut.\n\n**Ce qu'il faut savoir**\n\n- Une activité créative relève obligatoirement du régime de protection sociale des artistes-auteurs ; on ne peut pas facturer ses œuvres via une micro-entreprise.\n- Une micro-entreprise peut être gardée en parallèle pour une activité complémentaire (par exemple des ateliers) ; on garde le même SIREN, avec des cotisations dues pour chaque activité. Selon la Maison des Artistes (octobre 2026), l'ajout d'activité peut donner un autre SIRET ou seulement un code APE supplémentaire, et un seul établissement est principal. Attention à l'ordre : le Guichet unique ne permet pas d'ajouter une micro-entreprise à une activité d'artiste-auteur déjà déclarée. Il faut alors déclarer la fin de l'activité d'artiste-auteur, créer la micro-entreprise, puis rajouter l'activité d'artiste-auteur. Si le lien avec l'Urssaf artistes-auteurs n'est pas actif 4 semaines après validation, contacter l'Urssaf.\n- Depuis le 1er avril 2026, l'Urssaf est compétente pour prononcer l'affiliation ; l'attestation d'affiliation arrive dans la Messagerie de l'espace en ligne ; déclaration des revenus et cotisations auprès de l'Urssaf Limousin.\n- Si tu gardes ta micro-entreprise, attention aux doubles cotisations : sur la 2042 C PRO, une case permet de signaler les recettes BNC à ne pas soumettre aux cotisations des travailleurs indépendants (voir Fiche 3).\n\n**Points à confirmer :** la procédure exacte de l'ajout d'activité sur le Guichet unique depuis le transfert à l'Urssaf ; le traitement de la période de transition (ventes avant et après le changement). Délais indiqués par la Maison des Artistes (septembre 2026) : certificat Insee en 1 à 3 semaines, courrier des impôts en 1 mois, immatriculation Urssaf en 1 à 6 mois. Code APE attendu : 90.03A ou 90.03B.\n\n**Ma check-list « Mes démarches »**\n\n- [ ] Démarches de changement de statut faites sur le Guichet unique (INPI) et acceptées par l'Urssaf Limousin\n- [ ] Changement enregistré à l'INSEE\n- [ ] Recevoir le courrier de l'Urssaf Limousin avec mon code d'activation\n- [ ] Contrôler mon avis de situation INSEE (activité, code APE, SIRET)\n- [ ] Vérifier si mon ancienne micro-entreprise est clôturée ou conservée pour des activités annexes\n- [ ] Rassembler mes factures, relevés de ventes et déclarations de chiffre d'affaires de la micro-entreprise\n- [ ] Lister mes ventes et dépenses artistiques depuis le changement\n- [ ] Créer ou activer mon espace en ligne pour les artistes-auteurs (Urssaf), puis y récupérer l'attestation d'affiliation et la dispense de précompte (rubrique Messagerie)\n- [ ] Demander une modulation de mes cotisations provisionnelles si mes revenus sont faibles (voir Fiche 3)\n- [ ] Demander à l'Urssaf ou aux impôts comment traiter la période de transition avant ma prochaine déclaration\n- [ ] Si rien n'arrive après quelques semaines : relancer l'Urssaf Limousin avec mon SIRET et la date de ma démarche\n\n**Erreurs fréquentes :** continuer à facturer des œuvres via l'ancienne micro-entreprise ; oublier les déclarations de chiffre d'affaires tant qu'elle existe ; ne pas garder les preuves de la démarche.\n\n**Sources :** service-public.gouv.fr (fiche « Un artiste peut-il être micro-entrepreneur ? » et fiche « Artiste-auteur : affiliation et régime social ») ; Maison des Artistes, fiches « Identification fiscale et sociale » et « Démarches pour l'adjonction d'activité ou la multi-activité » ; Urssaf, « Débuter votre activité d'artiste-auteur ». Dernière vérification : 24 novembre 2026."},{id:"1",short:"L’affiliation",title:"L’affiliation",kw:["attestation","affiliation","seuils","revenus accessoires","Messagerie"],md:"**Réponse courte :** l'affiliation est ton entrée officielle dans la Sécurité sociale des artistes-auteurs. Elle vient après ta déclaration d'activité sur le Guichet unique ; depuis le 1er avril 2026, c'est l'Urssaf qui la prononce et qui dépose une attestation dans ton espace en ligne.\n\n**Pour qui ?** Toute personne dont les revenus viennent de la création d'œuvres, ici en arts plastiques.\n\n### Ce qu'il faut savoir\n\n- L'affiliation intervient dès la déclaration d'activité, ou dès qu'un tiers (éditeur, producteur, organisme de gestion collective) verse des droits d'auteur. La vérification porte sur le fait que ton activité relève bien du champ des artistes-auteurs.\n- Depuis le 1er avril 2026, l'Urssaf prononce l'affiliation. La déclaration d'activité reste à faire d'abord sur le Guichet unique, qui transmet les informations à l'Urssaf. Pour les artistes dont un diffuseur précompte les cotisations, l'affiliation se fait automatiquement à partir des déclarations du diffuseur.\n- Depuis le 1er juin 2026, l'Urssaf est aussi l'interlocuteur pour l'action sociale.\n- La déclaration annuelle des revenus et le paiement des cotisations se font auprès de l'Urssaf Limousin, en ligne (obligatoire depuis le 1er janvier 2026).\n- Le régime relève du régime général : mêmes prestations d'assurances sociales que les salariés, mais pas d'accès aux allocations chômage ; l'allocation des travailleurs indépendants reste possible si les conditions sont remplies. Dès le premier euro, tu as droit aux remboursements de soins et aux prestations de la CAF (sous conditions de ressources). Tu n'es pas couverte contre les accidents du travail et maladies professionnelles : une assurance volontaire est possible auprès de ta CPAM, sur une base de salaire que tu choisis (tutoriel de la SSAA). La Maison des Artistes propose aussi un contrat négocié (majoré de 30 % pour les non-adhérents).\n\n### Quels revenus sont concernés\n\n- **Revenus principaux :** vente ou location d'œuvres originales, cession de droits d'auteur, prix et récompenses, bourses et résidences de création, participation à un jury, présentation de tes œuvres ou de ton processus de création.\n- **Revenus accessoires :** cours donnés dans ton atelier, ateliers artistiques, rencontres sans lien avec ton œuvre. Ils sont déclarés à part et exigent d'avoir déjà perçu et déclaré un revenu artistique principal sur l'année en cours ou l'une des deux précédentes.\n- Au-delà du plafond des revenus accessoires, la part excédentaire relève du régime des travailleurs indépendants, dès le premier euro de l'excédent.\n\n### Les chiffres à connaître\n\n| Montant | À quoi il sert |\n| --- | --- |\n| 7 212 € de revenus sur une année (600 fois le Smic horaire en 2026) | Indemnités journalières (maladie, maternité) et validation de 4 trimestres de retraite |\n| 10 692 € de revenus artistiques en N-1 (environ 900 fois le Smic horaire 2025) | Affiliation au régime de retraite complémentaire RAAP (IRCEC) |\n| 14 424 € en 2026 (1 200 fois le Smic horaire) | Plafond annuel des revenus accessoires |\n\nCes seuils sont ceux de la fiche officielle de mars 2026. Les « 600 fois » et « 900 fois le Smic horaire » cités ailleurs désignent les mêmes seuils exprimés autrement : 600 × 12,02 € = 7 212 € en 2026. Seuls les montants en euros d'années anciennes sont périmés.\n\n### Ce que je dois faire\n\n1. Attendre l'attestation d'affiliation de l'Urssaf : elle arrive dans la rubrique « Messagerie » de mon espace en ligne. La garder.\n2. Activer mon espace en ligne sur le site de l'Urssaf pour les artistes-auteurs.\n3. Conserver mes factures et relevés de ventes pour la déclaration annuelle.\n4. Dire à mes diffuseurs, galeries et organismes de gestion collective que je suis affiliée, et leur remettre ma dispense de précompte (envoyée chaque fin d'année dans la Messagerie ; la première année, c'est la notification d'immatriculation qui en tient lieu).\n5. Faire ma déclaration sociale chaque année, en cohérence avec ma déclaration fiscale (voir Fiche 2).\n\n### Quand ?\n\nL'attestation arrive après la déclaration d'activité (immatriculation Urssaf en 1 à 6 mois selon la Maison des Artistes) ; la déclaration annuelle a lieu au printemps (dates fixées chaque année, à vérifier). Les cotisations de la déclaration BNC se paient tous les 3 mois : 15 janvier, 15 avril, 15 juillet, 15 octobre.\n\n**Exemple chiffré :** en micro-BNC, pour 10 000 € de chiffre d'affaires déclarés, l'assiette sociale est de 7 590 € (abattement de 34 % puis majoration de 15 %).\n\n**Erreurs fréquentes :** confondre affiliation et déclaration de revenus ; oublier de remettre sa dispense de précompte à ses diffuseurs ; compter des revenus accessoires sans revenu principal déclaré.\n\n**À vérifier avant publication :** les délais réels depuis le transfert. Selon la Maison des Artistes (septembre 2026) : certificat Insee en 1 à 3 semaines, courrier des impôts en 1 mois, immatriculation Urssaf (code d'activation, premier échéancier) en 1 à 6 mois. L'espace en ligne se crée avec le code d'activation reçu par courrier (mode d'emploi sur urssaf.fr).\n\n**Alerte code APE :** aucune alerte particulière pour cette fiche, sauf si le code figurant sur ton avis de situation INSEE ne correspond pas à ton activité (voir section 6 bis).\n\n**Sources :** Artiste-auteur : affiliation et régime social (service-public.gouv.fr, mise à jour du 25 mars 2026, revérifiée le 1er juin 2026) ; Urssaf artistes-auteurs, guide « L'Urssaf et vous » (janvier 2026) ; IRCEC, quel est mon régime. Dernière vérification : 24 novembre 2026. Prochaine revue : janvier 2027 (nouveaux barèmes).\n\n**Fiches liées :** Déclaration annuelle, Cotisations, Retraite, Micro-entreprise vers artiste-auteur."},{id:"2",short:"La déclaration annuelle",title:"La déclaration annuelle de revenus",kw:["déclarer 0 €","taxation d’office","surcotisation","2042 C PRO","déclaration"],md:"**Réponse courte :** chaque printemps, tu fais deux déclarations des revenus de l'année précédente : la déclaration sociale sur le site de l'Urssaf artistes-auteurs, la déclaration fiscale sur impots.gouv.fr. Les deux doivent donner les mêmes chiffres.\n\n**Pour qui ?** Toute artiste-auteur, quelle que soit sa situation : selon la fiche officielle, la déclaration sociale est indispensable dans tous les cas.\n\n### Ce qu'il faut savoir\n\n- **La déclaration sociale (Urssaf)** : chaque année, tu déclares tes revenus artistiques de l'année précédente à l'Urssaf Limousin et tu règles les cotisations correspondantes. Elle sert à calculer tes cotisations et à ouvrir tes droits.\n- **La déclaration fiscale (impôts)** : elle sert à calculer ton impôt sur le revenu. Tu la fais sur impots.gouv.fr, depuis ton Espace Finances publiques.\n- **Elles doivent concorder** : la déclaration sociale doit être cohérente avec la déclaration fiscale (mêmes montants, même régime).\n- **Tout se fait en ligne** : depuis le 1er janvier 2026, déclaration et paiement sont dématérialisés. Une dérogation est possible si tu ne peux pas déclarer ou payer par ce moyen.\n- **BNC ou traitements et salaires (TS)** : les droits d'auteur versés intégralement par des tiers (éditeurs, producteurs, organismes de gestion collective) peuvent être imposés en TS. Les ventes d'œuvres, prix, bourses et revenus accessoires relèvent des BNC. Pour toi, ce sera donc surtout du BNC.\n- **Comment l'Urssaf calcule l'assiette** :\n\n| Régime | Ce que tu déclares | Calcul de l'assiette sociale | Exemple pour 10 000 € |\n| --- | --- | --- | --- |\n| Micro-BNC | Recettes brutes hors taxes | Abattement de 34 %, puis majoration de 15 % | 7 590 € |\n| Déclaration contrôlée | Bénéfice | Bénéfice majoré de 15 % | 11 500 € |\n| TS | Montant brut hors taxes | Aucun ajustement | 10 000 € |\n\nEn régime mixte, l'assiette sociale globale est la somme des assiettes BNC et TS.\n\n- **Les revenus accessoires** (ateliers, cours) se déclarent distinctement dans la déclaration sociale.\n- **Le plafond du micro-BNC** : 83 600 € depuis le 1er janvier 2026 (77 700 € pour 2025). Au-delà, la déclaration contrôlée est obligatoire, avec une comptabilité détaillée des recettes et des dépenses.\n\n### Ce que je dois faire\n\n1. Attendre le courriel de l'Urssaf qui annonce l'ouverture de la campagne. La fiche officielle ne donne pas de date limite précise : la période est communiquée par courriel.\n2. Rassembler les certificats de précompte, les factures, les notes de droits d'auteur et mon numéro Siret (avec l'avis de situation Sirene pour les BNC).\n3. Me connecter à mon espace sur artistes-auteurs.urssaf.fr, rubrique « Déclaration ». Contrôler les revenus préremplis, les corriger si besoin et ajouter les revenus manquants.\n4. Renseigner les ventes ou cessions de droits à des particuliers, puis indiquer mon activité artistique principale et mes éventuelles activités secondaires.\n5. Déclarer à part les revenus accessoires.\n6. Regarder l'option de surcotisation si elle m'est proposée : elle entraîne des cotisations supplémentaires et peut être inutile si d'autres revenus permettent déjà de valider les droits.\n7. Valider la déclaration, puis télécharger le récapitulatif.\n8. Faire ma déclaration fiscale sur impots.gouv.fr avec les mêmes montants et le même régime.\n9. Consulter ensuite mon nouveau calendrier de paiement dans mon espace Urssaf.\n\n### Quand ?\n\n- En 2026 (revenus de 2025), la déclaration sociale était ouverte du 27 avril au 19 juin 2026. À partir du 22 juin 2026, les artistes en BNC ont reçu leur calendrier de paiement définitif pour 2025 et provisionnel pour 2026.\n- Les dates 2027 ne sont pas encore publiées. À rechercher au printemps.\n- Les cotisations BNC sont payables tous les 3 mois : 15 janvier, 15 avril, 15 juillet et 15 octobre.\n\n**Exemple chiffré :** pour 10 000 € de recettes en micro-BNC, l'assiette sociale est de 7 590 €. Pour 10 000 € de bénéfice en déclaration contrôlée, elle est de 11 500 € (exemples de la fiche officielle).\n\n**Erreurs fréquentes**\n\n- Déclarer des montants différents à l'Urssaf et aux impôts.\n- Valider le prérempli sans le vérifier.\n- Mélanger revenus principaux et revenus accessoires.\n- Perdre les certificats de précompte.\n- Aux impôts, remplir une case prévue pour les cotisations des indépendants classiques : un site spécialisé alerte sur la case 5HY, qui reviendrait à payer ses cotisations deux fois. À vérifier sur la notice officielle.\n\n**À confirmer**\n\n- Les cases de la 2042 C PRO. Selon une source secondaire : micro-BNC en case 5HQ ; en déclaration contrôlée, déclaration 2035 puis case 5QC ou 5QI ; case 5QL pour l'abattement de 50 % sur 5 ans des plasticien·nes en début d'activité. À confirmer sur la notice officielle de la 2042 C PRO.\n- Le traitement de ma période de transition depuis la micro-entreprise (voir 6 quater).\n- La procédure de correction d'une déclaration déjà faite. Pour l'absence de déclaration, l'Urssaf indique une taxation d'office : assiette des deux dernières années majorée de 25 %.\n\n**Alerte code APE :** aucune pour cette fiche. Tu déclares toutefois ton activité principale ; elle doit correspondre à ton avis de situation INSEE.\n\n**Sources :** [Artiste-auteur : affiliation et régime social](https://entreprendre.service-public.gouv.fr/vosdroits/F23749) (service-public.gouv.fr, vérifiée le 1er juin 2026) ; [Artiste-auteur : fiscalité](https://entreprendre.service-public.gouv.fr/vosdroits/F32113) (vérifiée le 20 février 2026) ; Urssaf artistes-auteurs ; [WebLex, calendrier des déclarations](https://www.weblex.fr/weblex-actualite/artistes-auteurs-le-calendrier-des-declarations-est-devoile) et [ouverture de la campagne](https://www.weblex.fr/weblex-actualite/artistes-auteurs-la-campagne-de-declaration-annuelle-est-ouverte) (sources secondaires). Dernière vérification : 24 novembre 2026. Prochaine revue : mars 2027, à la publication des dates de campagne.\n\n**Fiches liées :** Affiliation, Cotisations, Micro-BNC ou déclaration contrôlée, Calendrier."},{id:"3",short:"Les cotisations",title:"Combien vais-je payer de cotisations ?",kw:["acompte","modulation","échéances","CSG","forfait"],md:"**Réponse courte :** en BNC, tu paies toi-même tes cotisations à l'Urssaf Limousin, tous les trimestres. Elles sont d'abord provisoires, puis recalculées une fois ta déclaration annuelle faite. Pour 10 000 € de recettes en micro-BNC, compte environ 1 230 € par an, hors retraite complémentaire.\n\n**Pour qui ?** Les artistes-auteurs qui déclarent en BNC. En traitements et salaires, ce sont les diffuseurs qui retiennent les cotisations (précompte).\n\n### Ce qu'il faut savoir\n\n- **L'assiette** : c'est le bénéfice majoré de 15 %. En micro-BNC, cela donne tes recettes moins 34 %, puis plus 15 %.\n- **Les taux 2026 (BNC)**, d'après le barème Urssaf du 1er janvier 2026 repris par WebLex :\n\n| Cotisation | Taux | Pris en charge par l'État | Ce que tu paies |\n| --- | --- | --- | --- |\n| Vieillesse déplafonnée | 0,40 % | 0,40 % | 0 % |\n| Vieillesse plafonnée (jusqu'à 48 060 €) | 6,90 % | 0,75 % | 6,15 % |\n| CSG | 9,20 % | — | 9,20 % |\n| CRDS | 0,50 % | — | 0,50 % |\n| Formation professionnelle (CFP) | 0,35 % | — | 0,35 % |\n| **Total** | **17,35 %** | **1,15 %** | **16,20 %** |\n\n- **La retraite complémentaire (RAAP, IRCEC)** s'ajoute à part. Elle est obligatoire au-delà de 10 692 € de revenus artistiques en N-1. Le taux est de 8 %, ou de 4 % sur option si l'assiette ne dépasse pas 32 076 € (demande avant le 30 novembre). Elle fera l'objet de la fiche Retraite.\n- **Le mécanisme provisionnel** : tu paies en année N sur une estimation. Après ta déclaration du printemps, l'Urssaf régularise. Après la déclaration 2026, elle a calculé les cotisations définitives 2025, ajusté les provisionnelles 2026 et estimé les premières échéances 2027. Un trop-versé apparaît sous la mention « régularisation créditrice ». Selon la Maison des Artistes, les appels des deux premiers trimestres reposent sur les revenus de N-2 et ceux des deux derniers sur les revenus de N-1, sauf modulation.\n- **Le début d'activité** : selon l'Urssaf, les cotisations provisionnelles sont calculées sur un forfait de 600 fois le Smic horaire (environ 7 212 € en 2026), jusqu'au calcul définitif après ta première déclaration. Les premiers appels sont calculés au prorata de ta date de début d'activité.\n- **La modulation** : tu peux modifier tes cotisations provisionnelles en donnant une estimation de tes revenus de l'année, depuis ton espace en ligne, de la réception de l'échéancier (décembre) jusqu'au 30 septembre. La demande doit arriver au moins 15 jours avant l'échéance, sinon elle s'applique au trimestre suivant. La Maison des Artistes précise qu'on peut descendre jusqu'à 0 € sans revenus.\n- **Ce que tes cotisations ouvrent** : avec 7 212 € de revenus en 2026, tu valides 4 trimestres de retraite et tu as droit aux indemnités journalières. En dessous, tu peux surcotiser.\n- **La surcotisation** : c'est une option proposée lors de la déclaration annuelle. Depuis le 1er juin 2026, l'aide à la surcotisation se demande à l'Urssaf ; elle peut, sous conditions, prendre en charge les cotisations vieillesse plafonnée. Ses versements sont bloqués fin 2026 (voir Fiche 8).\n- **Le remboursement automatique** : depuis le 1er janvier 2026, certaines cotisations vieillesse plafonnées sont remboursées automatiquement. Pense à renseigner tes coordonnées bancaires dans ton espace en ligne.\n\n### Ce que je dois faire\n\n1. Vérifier mon échéancier dans mon espace Urssaf (rubrique paiement).\n2. Si mes revenus réels seront bien inférieurs au forfait ou à l'année passée, demander une modulation.\n3. Payer aux 4 échéances : 15 janvier, 15 avril, 15 juillet, 15 octobre.\n4. Après la déclaration annuelle, lire le nouveau calendrier : le montant restant à payer est à la page 2, un éventuel remboursement à la page 3.\n5. Récupérer ma dispense de précompte (envoyée en fin d'année, valable l'année suivante) et la remettre à mes diffuseurs. Celle de 2027 est disponible depuis le 23 novembre 2026.\n6. Renseigner mon RIB dans l'espace en ligne pour les remboursements.\n\n### Quand ?\n\nLes échéances tombent les 15 janvier, 15 avril, 15 juillet et 15 octobre. Le nouveau calendrier arrive après la déclaration annuelle, fin juin. La prochaine échéance est le 15 janvier 2027.\n\n### Exemple chiffré\n\nCalcul fait à partir des taux ci-dessus : 10 000 € de recettes en micro-BNC donnent une assiette de 7 590 €.\n\n- Vieillesse plafonnée : 7 590 × 6,15 % = 466,79 €\n- CSG : 7 590 × 9,20 % = 698,28 €\n- CRDS : 7 590 × 0,50 % = 37,95 €\n- CFP : 7 590 × 0,35 % = 26,57 €\n- **Total : environ 1 230 €**, soit à peu près 12,3 % des recettes. Il n'y a pas de RAAP, car on reste sous 10 692 €.\n\n**Erreurs fréquentes**\n\n- Payer le forfait de début d'activité sans demander de modulation alors que les revenus sont faibles.\n- Oublier que la RAAP est appelée à part par l'IRCEC.\n- Accepter la surcotisation sans vérifier qu'elle est utile.\n- En cas de cumul avec une activité de travailleur indépendant : voir ses revenus d'artiste comptés deux fois. Un usager raconte avoir dû remplir sur la 2042 C PRO la case « Recettes BNC à ne pas soumettre à cotisations sociales TI (ex. : artiste-auteur) ». Utile si tu gardes ta micro-entreprise.\n\n**À confirmer**\n\n- Le risque de régularisation si l'on module trop bas (aucune pénalité mentionnée par l'Urssaf).\n- Les conditions de la « demande de remboursement de la cotisation vieillesse plafonnée », seconde option de la déclaration annuelle.\n- Résolu : sur les 9,20 % de CSG, 6,80 points sont déductibles du revenu imposable (guide « Début d'activité » de la SSAA). Les diffuseurs paient en plus une contribution de 1,1 % du brut, à leur charge.\n- Les majorations de retard.\n\n**Sources :** Urssaf, barème des taux artistes-auteurs 2026 (via [WebLex](https://www.weblex.fr/chiffres-cles/tableau-des-cotisations-sociales-dues-par-les-artistes-auteurs-annee-2026), 13 avril 2026) ; [service-public.gouv.fr, affiliation et régime social](https://entreprendre.service-public.gouv.fr/vosdroits/F23749) (1er juin 2026) ; Urssaf, guide « L'Urssaf et vous » (janvier 2026) ; [IRCEC, mémo 2026](https://www.ircec.fr/wp-content/uploads/2026/02/mon-memo-ircec.pdf) ; Légifrance, Code de la sécurité sociale ; Maison des Artistes, mode d'emploi Guichet unique (janvier 2026). Dernière vérification : 24 novembre 2026. Prochaine revue : janvier 2027 (nouveaux barèmes, nouveau plafond de la Sécurité sociale).\n\n**Fiches liées :** Affiliation, Déclaration annuelle, Retraite, Micro-BNC ou déclaration contrôlée, Calendrier."},{id:"4",short:"La TVA",title:"Dois-je facturer la TVA sur mes ventes ?",kw:["franchise","293 B","5,5 %","seuil de TVA"],md:"**Réponse courte :** non, tant que tes recettes artistiques restent sous 50 000 € par an : tu es en franchise en base. Tu factures alors hors taxes, avec la mention « TVA non applicable – article 293 B du CGI ». Au-delà, tu factures 5,5 % sur tes œuvres originales, 10 % sur les cessions de droits et 20 % sur le reste.\n\n**Pour qui ?** Toute artiste-auteur qui vend des œuvres, cède des droits ou donne des ateliers.\n\n### Ce qu'il faut savoir\n\n**Les seuils de franchise (spécifiques aux auteurs, article 293 B I bis du CGI)**\n\n| Type de recettes | Seuil sur l'année précédente | Seuil de tolérance en cours d'année |\n| --- | --- | --- |\n| Ventes d'œuvres et cessions de droits | 50 000 € | 55 000 € |\n| Activités annexes (ateliers, cours, rencontres, ventes de biens qui ne sont pas des œuvres) | 35 000 € | 38 500 € |\n\n- Si tu dépasses 50 000 € sur une année, la franchise cesse au 1er janvier suivant.\n- Si tu dépasses 55 000 € dans l'année en cours, elle cesse dès le 1er jour du mois du dépassement. Les factures déjà émises dans ce mois doivent être rectifiées.\n- La première année d'activité, les seuils sont réduits au prorata des jours d'activité.\n- Ne comptent pas dans le chiffre d'affaires : le droit de suite, la rémunération pour copie privée, la rémunération équitable, ni les recettes hors champ ou exonérées (bourses, prix, dons, cours payés directement par les élèves). Les droits versés par un éditeur ou l'ADAGP comptent pour leur montant brut. Selon la Maison des Artistes, dépasser le seuil des œuvres fait aussi perdre la franchise sur les activités annexes, mais pas l'inverse.\n\n**Les taux, si tu factures la TVA**\n\n| Opération | Taux |\n| --- | --- |\n| Vente d'une œuvre originale par son auteur | 5,5 % |\n| Cession de droits d'auteur (reproduction, représentation, adaptation…) | 10 % |\n| Autres opérations (reproductions, produits dérivés, prestations) | 20 % |\n| Bourses et aides à la création sans contrepartie | Exonérées |\n| Cours et ateliers de pratique artistique payés directement par les élèves | Exonérés |\n\n- **Le taux de 5,5 % est réservé aux œuvres originales** au sens fiscal : tableaux, peintures, dessins, sculptures entièrement exécutés par l'artiste, gravures tirées en nombre limité, céramiques uniques signées… (liste de l'article 98 A de l'annexe III du CGI). Une reproduction mécanique ou un produit dérivé relève de 20 %.\n- **L'option pour la TVA** est possible même sous les seuils. Elle permet de récupérer la TVA sur tes achats (matériel, atelier). Elle se demande par écrit au service des impôts des entreprises (SIE) et vaut au moins 2 ans.\n- **Les droits versés par un diffuseur** (éditeur sous contrat d'édition, producteur, ADAGP, SAIF…) : le diffuseur déclare et paie la TVA pour ton compte (quote-part nette de 9,20 %). Tu n'as rien à déclarer pour ces droits, que tu sois en franchise ou non. Tu peux y renoncer par lettre recommandée au SIE, pour 5 ans.\n- **La CFE** (pas de la TVA, mais à savoir) : les peintres, sculpteurs, graveurs et dessinateurs qui ne vendent que le produit de leur art en sont exonérés.\n\n### Ce que je dois faire\n\n1. Calculer chaque année mes recettes artistiques, en séparant les œuvres et droits d'un côté, les activités annexes de l'autre.\n2. Tant que je suis sous les seuils : facturer hors taxes avec la mention « TVA non applicable – article 293 B du CGI ».\n3. Suivre mes recettes en cours d'année pour repérer un dépassement de 55 000 € (ou 38 500 € pour les activités annexes).\n4. En cas de dépassement : demander un numéro de TVA intracommunautaire au SIE, l'inscrire sur mes factures, appliquer le bon taux et déduire la TVA sur mes achats.\n5. Si j'achète beaucoup de matériel ou vends surtout à des professionnels, me demander si l'option pour la TVA serait avantageuse.\n\n### Quand ?\n\nEn décembre, faire le bilan des seuils de l'année (voir calendrier, section 12). En cours d'année, surveiller les recettes dès que je m'approche de 50 000 €.\n\n### Exemple chiffré\n\nVente d'un tableau original à 1 200 € :\n\n- en franchise : facture de 1 200 € hors taxes, avec la mention de l'article 293 B ;\n- assujettie à la TVA : 1 200 € HT + 66 € de TVA (5,5 %) = 1 266 € TTC.\n\nCession des droits de reproduction de ce tableau pour une affiche, 500 € : 50 € de TVA à 10 % si assujettie.\n\n**Erreurs fréquentes**\n\n- Appliquer 5,5 % à des reproductions ou à des produits dérivés.\n- Oublier la mention « TVA non applicable – article 293 B du CGI ».\n- Additionner œuvres et ateliers sans tenir compte de leurs seuils différents.\n- Se fier aux anciens seuils (25 000 €, 37 500 €) qui circulent encore sur Internet.\n\n**À confirmer**\n\n- Traité : les ventes à l'étranger sont détaillées dans la Fiche 7.\n- Une fois assujettie, selon la Maison des Artistes : réel simplifié (déclaration annuelle et acomptes) ou réel normal (déclaration mensuelle, formulaire 3310-CA3), depuis l'espace professionnel impots.gouv.fr. À confirmer avec le SIE.\n- La liste exacte des œuvres originales (article 98 A de l'annexe III), notamment pour les photographies et les tirages.\n- Traité : la facturation électronique est détaillée dans la Fiche 6.\n\n**Alerte code APE :** si tu vends des produits dérivés ou des tirages, vérifie que cette activité reste dans ton statut (voir section 6 bis).\n\n**Sources :** [Artiste-auteur : fiscalité (déclaration de revenus, TVA et CFE)](https://entreprendre.service-public.gouv.fr/vosdroits/F32113) (service-public.gouv.fr, vérifiée le 20 février 2026) ; [BOFiP, franchise en base accordée aux auteurs](https://bofip.impots.gouv.fr/bofip/148-PGP) (en vigueur depuis le 1er juillet 2026) ; [BOFiP, taux réduit des œuvres d'art](https://bofip.impots.gouv.fr/doctrine/pgp/1285-PGP) ; [vie-publique.fr, abrogation de la réforme de la franchise](https://www.vie-publique.fr/loi/298841-tva-auto-entrepreneurs-abrogation-reforme-proposition-de-loi-midy) (loi du 3 novembre 2025). Dernière vérification : 24 novembre 2026. Prochaine revue : janvier 2027 (loi de finances 2027).\n\n**Fiches liées :** Déclaration annuelle, Micro-BNC ou déclaration contrôlée, Facturation, Vendre à l'étranger, Ventes en galerie."},{id:"5",short:"Micro-BNC ou réel",title:"Micro-BNC ou déclaration contrôlée ?",kw:["abattement","déclaration contrôlée","2035","jeunes artistes"],md:"**Réponse courte :** le micro-BNC s'applique d'office sous 83 600 € de recettes. Il est simple : tu déclares tes recettes, l'administration retire 34 % de frais. La déclaration contrôlée demande une comptabilité, mais elle devient avantageuse si tes frais réels dépassent 34 % de tes recettes. Elle seule donne accès à l'abattement de 50 % des plasticien·nes débutant·es.\n\n**Pour qui ?** Les artistes-auteurs qui déclarent en BNC (ventes d'œuvres, commandes, bourses, ateliers).\n\n### Ce qu'il faut savoir\n\n|  | Micro-BNC | Déclaration contrôlée |\n| --- | --- | --- |\n| Ce que tu déclares | Recettes brutes hors taxes (2042 C PRO) | Bénéfice réel, recettes moins frais (2035, puis 2042 C PRO) |\n| Frais pris en compte | Forfait de 34 % | Frais réels justifiés |\n| Comptabilité | Livre des recettes | Comptabilité détaillée des recettes et dépenses |\n| Assiette sociale (Urssaf) | Recettes × 0,66 × 1,15 | Bénéfice × 1,15 |\n| Abattement de 50 % des jeunes plasticien·nes | Non | Oui, 5 ans |\n| Lissage des revenus (article 100 bis) | Non | Oui |\n| Déficit déductible | Non | Oui |\n\n- **Le plafond** : le micro-BNC s'applique si les recettes de l'année précédente ou de l'avant-dernière ne dépassent pas 83 600 € (seuil 2026). Après deux années consécutives au-dessus, la déclaration contrôlée devient obligatoire.\n- **L'option pour la déclaration contrôlée** : elle n'exige aucune formalité, il suffit de déposer la déclaration 2035. Selon impots.gouv.fr, elle vaut un an et se reconduit tacitement chaque année. Elle peut être exercée jusqu'à la date de dépôt de la 2035 (début mai). Pour revenir au micro-BNC, il faut y renoncer avant le 1er février (Maison des Artistes).\n- **L'abattement de 50 % des plasticien·nes (article 93-9 du CGI)** : les auteurs d'œuvres d'art bénéficient d'un abattement de 50 % sur leur bénéfice imposable la première année d'activité et les quatre suivantes. Il est réservé à la déclaration contrôlée et plafonné à 50 000 € par an. Il ne s'obtient qu'une fois : une reprise d'activité n'ouvre pas droit à un second abattement. L'année de départ est en général celle de ta déclaration d'activité. Il ne se cumule pas avec le lissage de l'article 100 bis.\n- **Le lissage (article 100 bis)** : en cas de forte variation de revenus, tu peux être imposée sur la moyenne de 3 ou 5 ans. C'est impossible en micro-BNC. La SAIF le décrit comme un pari sur l'avenir et conseille de faire des simulations avant d'opter.\n\n### Ce que je dois faire\n\n1. Tenir, dès maintenant, la liste de mes frais réels : matériel, atelier, transports, assurances, encadrement, frais d'exposition.\n2. En fin d'année, comparer : mes frais réels dépassent-ils 34 % de mes recettes ?\n3. Vérifier si j'ai encore droit à l'abattement de 50 % (date de ma première déclaration d'activité artistique).\n4. Si la déclaration contrôlée est plus intéressante : déposer la 2035 avant la date limite, puis reporter le résultat sur la 2042 C PRO.\n5. Utiliser le même régime et les mêmes montants dans ma déclaration Urssaf (voir Fiche 2).\n6. Envisager une association de gestion agréée (AGA) ou un·e comptable si je passe en déclaration contrôlée. Repères de la Maison des Artistes : crédit d'impôt jusqu'à 915 € pour les frais de comptabilité et d'AGA ; matériel de moins de 500 € HT déductible tout de suite ; part de loyer de l'atelier à domicile déductible au prorata de la surface ; déficit reportable 6 ans ; logiciel produisant un fichier FEC (un tableur ne suffit pas) ; compte bancaire dédié au-delà de 10 000 € de recettes deux années de suite.\n\n### Quand ?\n\nLe choix se fait au printemps, au moment de déclarer les revenus de l'année précédente : la 2035 se dépose début mai. Le suivi des frais se fait toute l'année.\n\n### Exemple chiffré\n\nCalcul fait à partir des règles ci-dessus, pour 20 000 € de recettes et 9 000 € de frais réels (45 % des recettes) :\n\n|  | Micro-BNC | Déclaration contrôlée | Déclaration contrôlée + abattement 50 % |\n| --- | --- | --- | --- |\n| Revenu imposable | 13 200 € | 11 000 € | 5 500 € |\n| Assiette sociale | 15 180 € | 12 650 € | 12 650 € (à vérifier) |\n| Cotisations (16,20 %) | environ 2 459 € | environ 2 049 € | environ 2 049 € |\n\nIci, la déclaration contrôlée fait économiser environ 410 € de cotisations et réduit fortement le revenu imposable. Avec peu de frais (moins de 34 %), le micro-BNC reste plus favorable.\n\n**Erreurs fréquentes**\n\n- Rester en micro-BNC par habitude alors que les frais réels sont élevés (achat de matériel, loyer d'atelier).\n- Ignorer l'abattement de 50 % pendant les 5 premières années.\n- Opter pour le lissage sans simulation : il fait perdre l'abattement de 50 %.\n- Choisir un régime différent aux impôts et à l'Urssaf.\n\n**À confirmer**\n\n- **Pour toi** : quelle année compte comme « première année d'activité » si tu vendais déjà des œuvres en micro-entreprise ? À demander à ton service des impôts des entreprises.\n- Résolu : l'abattement de 50 % est plafonné à 50 000 € par an (FAQ fiscale de la Maison des Artistes, mai 2026).\n- Si l'abattement de 50 % réduit aussi l'assiette sociale, ou seulement l'impôt.\n- Le minimum d'abattement en micro-BNC et la date exacte de dépôt de la 2035 en 2027.\n\n**Alerte code APE :** aucune.\n\n**Sources :** [BOFiP, abattement sur le bénéfice des artistes de la création plastique](https://bofip.impots.gouv.fr/bofip/4799-PGP) ; [BOFiP, seuils du micro-BNC](https://bofip.impots.gouv.fr/bofip/4807-PGP.html) ; [notice de la 2035 (2026)](https://www.impots.gouv.fr/sites/default/files/formulaires/2035-sd/2026/2035-sd_5385.pdf) ; [service-public.gouv.fr, fiscalité de l'artiste-auteur](https://entreprendre.service-public.gouv.fr/vosdroits/F32113) ; [SAIF, l'article 100 bis](https://saif.fr/site/assets/files/112479/100bis_-_soyons_clairs.pdf). Dernière vérification : 24 novembre 2026. Prochaine revue : janvier 2027 (loi de finances).\n\n**Fiches liées :** Déclaration annuelle, Cotisations, TVA."},{id:"6",short:"Facturer",title:"Comment faire mes factures ?",kw:["mentions","facture électronique","certificat d’authenticité","galerie"],md:"**Réponse courte :** tu factures obligatoirement tes clients professionnels (galeries, entreprises, collectivités). Pour un particulier qui achète une œuvre, la facture n'est obligatoire que s'il la demande. Les droits versés par un éditeur, un producteur ou l'ADAGP ne se facturent pas. Depuis le 1er septembre 2026, tu dois pouvoir recevoir des factures électroniques ; à partir du 1er septembre 2027, tu devras en émettre pour tes clients professionnels.\n\n**Pour qui ?** Toute artiste-auteur en BNC, en franchise de TVA ou non.\n\n### Ce qu'il faut savoir\n\n**Quand une facture est obligatoire**\n\n| Client et opération | Facture obligatoire ? |\n| --- | --- |\n| Professionnel (galerie, entreprise, collectivité) | Oui, à la livraison ou à la fin de la prestation |\n| Particulier, vente d'une œuvre originale | Seulement s'il la demande |\n| Particulier, prestation (atelier, cours) | Oui au-delà de 25 € TTC, ou s'il la demande |\n| Vente à distance ou livraison dans un autre pays de l'UE | Oui |\n| Droits versés par un éditeur, un producteur ou un organisme de gestion collective | Non, sauf si tu as renoncé à la retenue de TVA |\n\n**Les mentions obligatoires** (fiche service-public, vérifiée le 11 août 2026, et guide de l'AC-RA pour les artistes)\n\n- Date d'émission et numéro unique, dans une séquence chronologique continue\n- Date de la vente ou de la prestation\n- Ton identité : nom, prénom (ou pseudonyme) suivis de « EI » (entrepreneur individuel), adresse, numéro Siren ou Siret ; l'AC-RA conseille d'ajouter le code APE et ton numéro Urssaf\n- L'identité du client (nom de l'entreprise, ou nom et adresse du particulier)\n- La désignation précise de l'œuvre ou de la prestation (titre, technique, dimensions, année)\n- Le prix, le taux de TVA ligne par ligne et les totaux HT et TTC, ou bien la mention « TVA non applicable, art. 293 B du code général des impôts » en franchise\n- La date de règlement, les conditions d'escompte (« Escompte pour paiement anticipé : néant ») et le taux des pénalités de retard\n- Pour un client professionnel : l'indemnité forfaitaire de 40 € pour frais de recouvrement\n- Ton numéro de TVA intracommunautaire et celui du client professionnel, si tu factures la TVA (sauf facture de 150 € HT ou moins) ; pour les ventes dans l'UE, ton numéro est nécessaire même en franchise (voir Fiche 7)\n\n**La facturation électronique**\n\n- Elle concerne les artistes-auteurs, y compris en franchise de TVA : tu restes assujettie, même si tu ne factures pas la TVA.\n- **Depuis le 1er septembre 2026 :** obligation de pouvoir recevoir des factures électroniques, via une plateforme agréée, et de figurer dans l'annuaire.\n- **Au 1er septembre 2027 :** obligation d'émettre des factures électroniques à tes clients professionnels français, et de transmettre les données de tes autres ventes (particuliers, étranger) à l'administration (e-reporting).\n- Quatre nouvelles mentions s'ajoutent : le Siren du client professionnel, l'adresse de livraison si elle diffère, la nature de l'opération (livraison de biens ou prestation de services) et, le cas échéant, l'option pour le paiement de la TVA d'après les débits.\n\n**La conservation :** 10 ans pour les factures (durée commerciale ; la Maison des Artistes indique 6 ans minimum pour le fisc). Garde beaucoup plus longtemps les contrats de cession de droits, pour prouver ce que tu as cédé en cas de litige.\n\n### Ce que je dois faire\n\n1. **Maintenant (en retard d'environ 3 mois)** : choisir une plateforme agréée pour recevoir les factures électroniques et vérifier mon inscription dans l'annuaire.\n2. Créer un modèle de facture avec toutes les mentions ci-dessus et une numérotation continue.\n3. Ajouter un modèle de certificat d'authenticité à remettre avec chaque œuvre vendue.\n4. Prévenir mes diffuseurs, dans mes devis, que la contribution diffuseur est à leur charge.\n5. Courant 2027 : paramétrer l'émission de factures électroniques pour être prête au 1er septembre 2027.\n6. Classer mes factures et contrats pour la déclaration annuelle.\n\n### Quand ?\n\n- À chaque vente à un professionnel : à la livraison de l'œuvre ou à la fin de la prestation.\n- 1er septembre 2026 : réception électronique (déjà en vigueur).\n- 1er septembre 2027 : émission électronique et e-reporting.\n\n### Exemple\n\nFacture n° 2026-014 du 12 décembre 2026. Camille Martin (EI), Siret 123 456 789 00012, APE 90.03A (90.12Y à partir de 2027). Client : Galerie X, Siren 987 654 321. « Sans titre, huile sur toile, 80 × 100 cm, 2026 », 2 400 €. « TVA non applicable, art. 293 B du code général des impôts. » Paiement à 30 jours, pénalités de retard au taux légal majoré, indemnité forfaitaire de 40 €, escompte : néant. *(Exemple fictif.)*\n\n**Erreurs fréquentes**\n\n- Oublier la mention « EI », devenue obligatoire.\n- Numéroter les factures de façon discontinue, ou recommencer à 1 chaque année sans préfixe.\n- Indiquer « HT » et « TTC » alors qu'on est en franchise.\n- Penser que la franchise de TVA dispense de la facturation électronique.\n- Facturer des droits que l'éditeur ou l'ADAGP verse déjà avec retenue de TVA.\n\n**À confirmer**\n\n- Les règles d'émission électronique propres aux notes de droits d'auteur (un cas d'usage spécifique existe).\n- Une éventuelle évolution de la mention de franchise au 1er janvier 2027 (signalée par un éditeur de logiciel, non confirmée par service-public).\n- Les amendes en cas de facture manquante ou incomplète.\n- Le choix d'une plateforme agréée gratuite (liste officielle sur impots.gouv.fr).\n\n**Alerte code APE :** le code APE figure souvent sur la facture. S'il ne correspond pas à ton activité, voir section 6 bis.\n\n**Sources :** [Mentions obligatoires sur une facture](https://entreprendre.service-public.gouv.fr/vosdroits/F31808) (service-public.gouv.fr, vérifiée le 11 août 2026) ; [AC-RA, guide des factures de l'artiste-auteur](https://www.ac-ra.eu/wp-content/uploads/2023/02/Factures_v18_vf.pdf) ; [impots.gouv.fr, FAQ facturation électronique](https://www.impots.gouv.fr/foire-aux-questions-je-decouvre-la-facturation-electronique) ; [service-public.gouv.fr, fiscalité de l'artiste-auteur](https://entreprendre.service-public.gouv.fr/vosdroits/F32113) ; [Indy, facturation électronique des artistes-auteurs](https://www.indy.fr/guide/facturation/electronique/gratuit/artiste-auteur/) (source secondaire). Dernière vérification : 24 novembre 2026. Prochaine revue : juin 2027 (avant l'obligation d'émission).\n\n**Fiches liées :** TVA, Vendre à l'étranger, Déclaration annuelle, Ventes en galerie."},{id:"7",short:"Vendre à l’étranger",title:"Je vends ou je cède des droits à l’étranger",kw:["UE","hors UE","export","transport"],md:"**Réponse courte :** si tu résides en France, tes revenus de l'étranger sont déclarés et imposés en France, comme les autres. Pour la TVA, tout dépend du lieu et du client : professionnel ou particulier, Union européenne ou hors UE. En franchise, la plupart des ventes restent sans TVA, mais la facture est obligatoire pour les livraisons dans l'UE.\n\n**Pour qui ?** Les artistes qui vendent à des collectionneurs ou galeries étrangères, exposent hors de France ou cèdent des droits à un client étranger.\n\n### Ce qu'il faut savoir\n\n**La TVA selon le cas**\n\n| Opération | Si tu es en franchise | Si tu factures la TVA |\n| --- | --- | --- |\n| Vente d'une œuvre à un professionnel dans l'UE | Exonérée (article 293 B) | Livraison intracommunautaire exonérée, sous conditions (numéro de TVA du client, preuve du transport) |\n| Vente d'une œuvre à un particulier dans l'UE | Pas de TVA ; facture obligatoire | TVA française tant que tes ventes à distance dans l'UE restent sous 10 000 € par an ; au-delà, TVA du pays de l'acheteur |\n| Vente hors UE (export), à un particulier ou à un professionnel | Pas de TVA | Exonérée, à condition de prouver la sortie de l'UE (déclaration en douane) |\n| Cession de droits à un client professionnel étranger | Pas de TVA | En général pas de TVA française : le client professionnel l'autoliquide dans son pays |\n\n**L'impôt sur le revenu**\n\n- Les droits d'auteur venant de l'étranger sont imposables en France si tu y résides fiscalement.\n- Le client étranger peut prélever une retenue à la source. Selon la convention fiscale entre les deux pays, tu peux demander une réduction de cette retenue (formulaire du pays étranger), ou l'imputer comme crédit d'impôt en France.\n- Tu déclares alors le montant brut, retenue comprise, avec le formulaire 2047 en plus de la 2042 et de la 2042 C PRO.\n\n**Les cotisations sociales**\n\n- Un diffuseur étranger ne précompte pas les cotisations françaises. Ces revenus entrent dans ta déclaration annuelle à l'Urssaf. L'Urssaf signale une tolérance : les revenus perçus de l'étranger peuvent être déclarés en traitements et salaires sans avoir été précomptés ; les explications sont dans le portail artistes-auteurs.urssaf.fr.\n\n**Le transport des œuvres**\n\n- Pour exposer hors UE puis rapatrier les œuvres invendues, il existe des régimes d'admission temporaire en exonération de droits et taxes. Le carnet ATA, délivré par les chambres de commerce et d'industrie, sert à faire passer du matériel en douane de façon temporaire.\n\n### Ce que je dois faire\n\n1. Avant de vendre : identifier le client (professionnel ou particulier) et le pays (UE ou non).\n2. Faire une facture, obligatoire pour les livraisons dans l'UE, avec le numéro de TVA du client professionnel s'il en a un. Selon la Maison des Artistes, il me faut aussi mon propre numéro de TVA intracommunautaire, même en franchise (à demander par courrier au SIE). Pour une cession de droits à un professionnel de l'UE : mention « autoliquidation » sur la facture et déclaration européenne de services (DES) dans les 10 jours du mois suivant.\n3. Pour un envoi hors UE : garder la déclaration en douane et la preuve du paiement.\n4. Pour une exposition hors UE : se renseigner auprès de la CCI sur le carnet ATA ou l'admission temporaire avant le départ.\n5. Pour des droits payés par un client étranger : demander le formulaire de la convention fiscale, pour éviter ou récupérer la retenue à la source.\n6. Déclarer ces revenus à l'Urssaf et aux impôts comme les autres (2047 si retenue étrangère).\n7. Suivre le total de mes ventes à des particuliers dans l'UE (seuil de 10 000 €) si je deviens assujettie.\n\n### Quand ?\n\nAvant chaque vente ou expédition. Au printemps, lors des déclarations annuelles.\n\n### Exemple chiffré\n\nEn franchise, tu vends un dessin 800 € à un collectionneur belge particulier : facture de 800 € avec la mention « TVA non applicable, art. 293 B du CGI », sans TVA. Ces 800 € entrent dans tes recettes BNC et dans le calcul de tes seuils de franchise.\n\n**Erreurs fréquentes**\n\n- Oublier de déclarer en France des revenus versés par un client étranger.\n- Envoyer une œuvre hors UE sans garder la preuve de l'export.\n- Subir une retenue à la source étrangère sans la récupérer en crédit d'impôt.\n- Expédier des œuvres pour une exposition sans régime douanier temporaire, et payer des taxes au retour.\n\n**À confirmer**\n\n- La TVA des ventes à des particuliers dans l'UE pour une artiste en franchise (application du seuil de 10 000 €).\n- Le traitement social (Urssaf) des revenus versés par un diffuseur étranger.\n- Les conditions exactes de l'admission temporaire pour exposition et vente éventuelle.\n- Le cas d'une résidence à l'étranger (hors périmètre de cette fiche).\n\n**Alerte code APE :** aucune.\n\n**Sources :** [impots.gouv.fr, achat et vente de biens](https://www.impots.gouv.fr/professionnel/achatvente-de-biens) ; [Bpifrance Création, TVA dans l'UE et avec les pays tiers](https://bpifrance-creation.fr/encyclopedie/fiscalite-lentreprise/tva/tva-echanges-biens-lunion-europeenne-pays-tiers) ; [L'Europe est à vous, TVA transfrontière](https://europa.eu/youreurope/business/vat-customs/cross-border/index_fr.htm) ; [BOFiP, exportations d'œuvres d'art](https://bofip.impots.gouv.fr/doctrine/pgp/1294-PGP) ; [AC-RA, guide des factures](https://www.ac-ra.eu/wp-content/uploads/2023/02/Factures_v18_vf.pdf) ; [SAIF, droits d'auteur de l'étranger](https://www.saif.fr/site/assets/files/112479/droits_etrangers_-_soyons_clairs.pdf) ; [ARTCENA, TVA et autoliquidation](https://www.artcena.fr/precis-juridique/etudes/international/tournee-letranger). Dernière vérification : 24 novembre 2026. Prochaine revue : janvier 2027.\n\n**Fiches liées :** TVA, Facturation, Déclaration annuelle, Ventes en galerie."},{id:"8",short:"La retraite",title:"Comment je prépare ma retraite ?",kw:["trimestres","RAAP","IRCEC","taux plein"],md:"**Réponse courte :** ta retraite a deux étages. La retraite de base est celle du régime général, comme les salariés : tu valides un trimestre par tranche de 1 803 € d'assiette sociale en 2026, et 4 trimestres dès 7 212 €. La retraite complémentaire (RAAP), gérée par l'IRCEC, devient obligatoire dès 10 692 € d'assiette. Si tes revenus sont faibles, tu peux surcotiser pour valider tes 4 trimestres.\n\n**Pour qui ?** Toute artiste-auteur, et surtout celles dont les revenus varient d'une année sur l'autre.\n\n### Ce qu'il faut savoir\n\n**La retraite de base (régime général)**\n\n| Assiette sociale annuelle en 2026 | Trimestres validés |\n| --- | --- |\n| Moins de 1 803 € (150 fois le Smic horaire) | 0 |\n| 1 803 € à 3 605 € | 1 |\n| 3 606 € à 5 408 € | 2 |\n| 5 409 € à 7 211 € | 3 |\n| 7 212 € et plus (600 fois le Smic horaire) | 4 (maximum par an) |\n\n- Le seuil se calcule avec le Smic horaire du 1er janvier (12,02 € en 2026). La hausse du Smic de juin 2026 ne change pas les seuils de l'année.\n- **La surcotisation** : si tes revenus n'atteignent pas 7 212 €, tu peux demander que tes cotisations vieillesse soient calculées sur 600 fois le Smic horaire. La CSG, la CRDS et la formation professionnelle restent calculées sur ton revenu réel. L'option est proposée lors de la déclaration annuelle (voir Fiche 2).\n- **L'aide à la surcotisation** : depuis le 1er juin 2026, elle se demande à l'Urssaf. Elle peut, sous conditions, prendre en charge les cotisations vieillesse plafonnée de la surcotisation. Attention, en novembre 2026 : selon la SSAA, les versements d'aides sociales sont bloqués tant que le règlement d'action sociale prévu par le décret du 26 septembre 2026 n'est pas approuvé par arrêté. Conditions selon le guide « Aides en cas de faibles revenus » de la SSAA (avril 2026) : revenus artistiques sous 600 fois le Smic horaire, surcotisation demandée dans la déclaration, faibles ressources du foyer, pas plus de 3 années consécutives d'aide. Elle couvre les cotisations Sécurité sociale et vieillesse plafonnée ; CSG, CRDS et CFP restent dues. La demande se fait auprès de l'Urssaf Limousin.\n- **Les trimestres manquants du passé** : une aide exceptionnelle finance une partie de la régularisation des cotisations vieillesse arriérées (rachat de trimestres). Elle se demande aussi à l'Urssaf. La régularisation des cotisations arriérées (notamment pour les anciens assujettis Agessa) doit être déposée au plus tard le 31 décembre 2027, avec un devis de l'Assurance retraite (Maison des Artistes).\n\n**La retraite complémentaire (RAAP, IRCEC), valeurs 2026**\n\n| Paramètre | Valeur |\n| --- | --- |\n| Seuil d'affiliation obligatoire | 10 692 € d'assiette sociale |\n| Taux normal | 8 % de l'assiette |\n| Taux réduit (sur demande avant le 30 novembre) | 4 %, si l'assiette ne dépasse pas 32 076 € |\n| Assiette maximale | 144 180 € (3 fois le plafond de la Sécurité sociale) |\n| Cotisation volontaire sous le seuil | 427,68 € (4 %) ou 855,36 € (8 %), si tu as cotisé au RAAP au moins une fois dans les 4 années précédentes ; demande avant le 30 novembre |\n| Valeur d'achat du point | 90,30 € |\n| Valeur de service du point | 9,75 € de pension par an |\n\n- Le taux réduit de 4 % divise aussi par deux les points acquis, donc la future pension.\n- Le RAAP compte un minimum de 30 points : en dessous, la retraite complémentaire est versée en une seule fois (équivalent de 15 ans de pension). Exonérations possibles (Maison des Artistes) : revenus du foyer inférieurs à 16 038 € en 2026, ou arrêt d'au moins six mois avec indemnités journalières (6 points gratuits) ; demande avant le 31 mars de l'année suivante. L'exonération pour revenus faibles n'ouvre aucun point.\n- Les cotisations versées à l'IRCEC et à l'Urssaf sont déductibles fiscalement. Selon Le Guide de l'artiste auteur, la cotisation RAAP n'est plus due au-delà de 67 ans ou si l'on perçoit déjà une pension IRCEC (à confirmer auprès de l'IRCEC).\n- **Âge :** selon la Maison des Artistes (23 novembre 2026), la réforme de 2023 est suspendue jusqu'en janvier 2028 pour les pensions prenant effet à partir du 1er septembre 2026 : âge légal de 62 ans et 9 mois pour les générations 1963 à 1965, jusqu'à 64 ans pour 1969 et après ; 170 à 172 trimestres pour le taux plein. Le taux plein est automatique à 67 ans. La retraite n'est pas versée automatiquement : la demander en ligne sur info-retraite.fr environ 6 mois avant la date de départ (guide Retraite de la SSAA).\n\n### Ce que je dois faire\n\n1. Consulter mon relevé de carrière sur info-retraite.fr, pour voir mes trimestres déjà validés, y compris ceux de la micro-entreprise.\n2. Chaque printemps, lors de la déclaration Urssaf, vérifier si mon assiette atteint 7 212 €. Sinon, envisager la surcotisation et demander l'aide à l'Urssaf.\n3. Si mon assiette dépasse 10 692 € : créer mon espace adhérent IRCEC, y déclarer mon assiette au 2e trimestre, et payer les appels de cotisation.\n4. Avant le 30 novembre : décider du taux réduit de 4 % ou d'une cotisation volontaire.\n5. S'il me manque des trimestres d'années passées : me renseigner auprès de l'Urssaf sur l'aide au rachat.\n6. Déduire mes cotisations retraite de mes revenus imposables.\n\n### Quand ?\n\n| Période | Action |\n| --- | --- |\n| Avril–juin | Déclaration Urssaf, avec l'option de surcotisation |\n| 2e trimestre | Déclaration de l'assiette à l'IRCEC, premier appel de cotisation RAAP |\n| Dernier trimestre | Second appel de cotisation RAAP |\n| Avant le 30 novembre | Taux réduit de 4 % ou cotisation volontaire RAAP |\n\n### Exemple chiffré\n\nCalculs faits à partir des valeurs 2026 ci-dessus (à vérifier auprès de l'Urssaf et de l'IRCEC) :\n\n- **Assiette de 5 000 €** : 2 trimestres validés. Avec la surcotisation sur 7 212 €, tu en valides 4. Le surcoût de cotisation vieillesse plafonnée est d'environ 136 € (2 212 € × 6,15 %), avant une éventuelle aide de l'Urssaf.\n- **Assiette de 12 000 €** : 4 trimestres et cotisation RAAP obligatoire. À 8 %, 960 € donnent environ 10,6 points, soit environ 104 € de pension annuelle en plus. À 4 %, 480 € donnent environ 5,3 points, soit environ 52 € par an.\n\n**Erreurs fréquentes**\n\n- Croire que l'affiliation suffit à valider des trimestres : c'est l'assiette qui compte.\n- Laisser passer des années à moins de 4 trimestres sans regarder la surcotisation.\n- Choisir le taux réduit RAAP sans voir qu'il divise la future pension par deux.\n- Oublier de déclarer son assiette à l'IRCEC, qui est un organisme distinct de l'Urssaf.\n\n**À confirmer**\n\n- Le coût exact de la surcotisation : part de l'État, cotisation déplafonnée.\n- Les conditions et montants de l'aide à la surcotisation et de l'aide au rachat de trimestres (formulaires sur urssaf.fr).\n- La prise en compte de tes trimestres de micro-entreprise dans ton relevé de carrière.\n- Mon âge de départ exact selon mon année de naissance, avec la suspension de la réforme jusqu'en 2028 : à simuler sur info-retraite.fr (les 62 ans du guide SSAA et les 64 ans de l'IRCEC sont des cas particuliers).\n\n**Alerte code APE :** aucune.\n\n**Sources :** [IRCEC, guide de la retraite](https://ircec.fr/guide-ircec-accessible) (valeurs 2026) ; [IRCEC, mémo 2026](https://www.ircec.fr/wp-content/uploads/2026/02/mon-memo-ircec.pdf) ; [Assurance retraite, circulaire Cnav 2025-33](https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2025_33_23122025.pdf) (seuil de 1 803 € par trimestre) ; Urssaf, guide « L'Urssaf et vous » (janvier 2026) ; [Sénat, rapport sur les artistes-auteurs](https://www.senat.fr/rap/l25-206/l25-2061.pdf) ; [WebLex, action sociale à l'Urssaf](https://www.weblex.fr/weblex-actualite/artistes-auteurs-l-urssaf-devient-votre-interlocuteur-pour-l-action-sociale) (source secondaire). Dernière vérification : 24 novembre 2026. Prochaine revue : janvier 2027 (Smic, plafond de la Sécurité sociale, valeurs du point).\n\n**Fiches liées :** Affiliation, Cotisations, Déclaration annuelle."},{id:"9",short:"Mes droits d’auteur",title:"Quels droits ai-je sur mes œuvres ?",kw:["droit de suite","ADAGP","cession","droit de présentation"],md:"**Réponse courte :** tu es protégée dès la création, sans dépôt ni formalité. Vendre un tableau ne cède aucun droit d'auteur : l'acheteur possède l'objet, pas le droit de le reproduire ou de l'exposer. Toute cession de droits doit être écrite et précise. Quand ton œuvre est revendue par un professionnel, tu touches un droit de suite.\n\n**Pour qui ?** Toute artiste plasticienne qui vend, expose, reproduit ou fait reproduire ses œuvres.\n\n### Ce qu'il faut savoir\n\n**Les deux familles de droits**\n\n|  | Droit moral | Droits patrimoniaux |\n| --- | --- | --- |\n| Ce qu'il protège | Ton lien personnel avec l'œuvre : la signer (paternité), refuser qu'on la dénature (respect), décider de la montrer (divulgation) | L'exploitation de l'œuvre : reproduction (affiche, catalogue, site, produits) et représentation (exposition, diffusion) |\n| Peut-il être cédé ? | Non, jamais | Oui, par contrat écrit, ou confié à un organisme comme l'ADAGP |\n| Durée | Perpétuelle | Toute ta vie, puis 70 ans après ta mort |\n\n**Vendre une œuvre n'est pas céder ses droits.** Le Code de la propriété intellectuelle sépare la propriété incorporelle (tes droits) de la propriété de l'objet matériel. L'acheteur ne reçoit aucun droit d'auteur du seul fait de son achat.\n\n**Céder des droits : les règles du contrat**\n\n- La cession doit être constatée par écrit.\n- Chaque droit cédé doit être mentionné séparément, et son exploitation délimitée : étendue, destination, lieu et durée.\n- La cession doit prévoir une rémunération appropriée et proportionnelle aux recettes de l'exploitation (un forfait est possible dans certains cas).\n\n**Le droit de suite**\n\n- Quand ton œuvre originale est revendue avec l'intervention d'un professionnel du marché de l'art (galerie, maison de ventes, marchand), tu touches un pourcentage du prix.\n- Il ne s'applique pas à la première vente, ni sous 750 €.\n- Il ne peut être ni cédé ni abandonné (il passe seulement aux héritiers).\n\n| Tranche du prix de revente | Taux |\n| --- | --- |\n| Jusqu'à 50 000 € | 4 % |\n| 50 000,01 à 200 000 € | 3 % |\n| 200 000,01 à 350 000 € | 1 % |\n| 350 000,01 à 500 000 € | 0,5 % |\n| Au-delà de 500 000 € | 0,25 % |\n| Plafond par vente | 12 500 € |\n\n**Le droit de présentation publique (droit d'exposition)**\n\n- Exposer une œuvre au public est un acte de représentation qui relève de tes droits. En pratique, ce droit est rarement cédé par contrat et encore plus rarement payé.\n- Le ministère de la Culture recommande un minimum de rémunération pour les expositions temporaires. Il est obligatoire pour les lieux subventionnés par le ministère : 1 000 € pour une exposition monographique, 1 000 € à partager entre les artistes d'une exposition collective de moins de 10 artistes, 100 € par artiste au-delà.\n\n**L'ADAGP (gestion collective des arts visuels)**\n\n- Elle perçoit et répartit pour toi : droit de suite, droits de reproduction et de représentation, et droits collectifs (copie privée, reprographie…).\n- L'adhésion coûte 15,24 € une seule fois (une part de capital), sans cotisation annuelle.\n- Si tu adhères pour tous les droits, c'est l'ADAGP qui négocie et facture les reproductions de tes œuvres. Elle retient alors la TVA et les cotisations sociales (voir Fiches 3 et 4).\n\n### Ce que je dois faire\n\n1. Garder des preuves de création datées : photos, esquisses, inventaire de mes œuvres.\n2. À chaque vente, préciser par écrit (sur la facture ou le certificat d'authenticité) que la vente ne cède aucun droit de reproduction.\n3. Pour toute demande de reproduction (affiche, catalogue, produit), faire un contrat de cession qui liste chaque droit, l'usage, le lieu, la durée et le prix.\n4. Pour une exposition, demander un contrat qui prévoit la cession du droit de présentation publique et sa rémunération, en citant les minima du ministère pour un lieu subventionné.\n5. Envisager l'adhésion à l'ADAGP, au minimum pour le droit de suite et les droits collectifs.\n6. Signer mes œuvres, et exiger la mention de mon nom à chaque reproduction.\n\n### Quand ?\n\nÀ chaque vente, exposition, commande ou demande de reproduction. Selon le guide de l'administration, l'artiste ou l'organisme qu'elle a mandaté doit être informé de toute revente soumise au droit de suite dans les 3 ans.\n\n### Exemple chiffré\n\nUne galerie revend 8 000 € un tableau que tu avais vendu à un collectionneur : droit de suite de 4 % × 8 000 € = 320 € pour toi. Selon le Sénat, une dérogation existe quand le vendeur avait acheté l'œuvre directement à l'artiste moins de 3 ans avant, pour moins de 10 000 €.\n\nUne mairie veut ton tableau pour l'affiche d'un festival : un contrat de cession du droit de reproduction, « affiche et flyers, département, 1 an, 600 € », et ton nom sur chaque support.\n\n**Erreurs fréquentes**\n\n- Croire que l'acheteur d'une œuvre peut la reproduire librement.\n- Accepter une cession « de tous les droits, pour le monde entier, pour toute la durée de la protection » sans contrepartie.\n- Exposer sans contrat ni rémunération dans un lieu subventionné.\n- Ne pas réclamer le droit de suite sur les reventes en galerie ou aux enchères.\n\n**À confirmer**\n\n- Les montants actuels des minima du droit de présentation publique et leur date (non revalorisés depuis leur création ?).\n- Les conditions et frais de gestion de l'ADAGP en 2026.\n- Le traitement fiscal et social des droits d'auteur perçus via l'ADAGP (traitements et salaires ou BNC).\n- Des modèles de contrat de cession et d'exposition (AC-RA, ADAGP, CNAP).\n\n**Alerte code APE :** aucune.\n\n**Sources :** [Légifrance, Code de la propriété intellectuelle, articles L131-2 à L131-3](https://www.legifrance.gouv.fr/codes/id/LEGIARTI000044073293/2022-01-01) et [L131-4](https://www.legifrance.gouv.fr/codes/id/LEGIARTI000006278969/2026-04-19) ; [OMPI, CPI article L111-3](https://www.wipo.int/wipolex/en/text/492373) ; [OMPI, décret de 2007 sur le droit de suite](https://www.wipo.int/wipolex/fr/legislation/details/5685) ; [service-public, droit de suite](https://sites.service-information-publique.fr/vias/guide-particuliers/F33807.html) ; [ministère de la Culture, droit de présentation publique](https://www.culture.gouv.fr/thematiques/arts-plastiques/actualites/La-remuneration-du-droit-de-presentation-publique) ; [Sénat, rapport sur l'art contemporain](https://www.senat.fr/rap/r11-034/r11-0342.html) ; [AC-RA, droits collectifs](https://www.ac-ra.eu/wp-content/uploads/2023/02/brochure-droits_collectifs-web.pdf) ; [ADAGP](https://adagp.fr/en/adagp-role-and-missions/copyrights-managed-adagp/collective-rights). Dernière vérification : 24 novembre 2026. Prochaine revue : novembre 2027.\n\n**Fiches liées :** Facturation, TVA, Ventes en galerie, Cotisations."},{id:"10",short:"Les aides",title:"Quelles aides si mes revenus sont faibles ?",kw:["prime d’activité","RSA","CSS","France Travail","ARE"],md:"**Réponse courte :** être artiste-auteur ne te ferme aucune aide de droit commun. Avec de faibles revenus, tu peux demander la prime d'activité, le RSA et les aides au logement à la CAF, et la complémentaire santé solidaire à l'Assurance maladie. Le régime ajoute ses propres aides, instruites par l'Urssaf depuis le 1er juin 2026 (aide à la surcotisation, aide au rachat de trimestres), mais leurs versements sont bloqués en novembre 2026. La Maison des Artistes a aussi un bureau d'aide sociale pour ses adhérents. Il n'y a pas de chômage au titre de l'activité artistique.\n\n**Pour qui ?** Toute artiste-auteur affiliée aux ressources modestes, surtout pendant les premières années ou après une année creuse. Attention : la CAF et l'Assurance maladie regardent les ressources de tout le foyer (conjoint·e, autres revenus, aides), pas seulement tes revenus artistiques.\n\n### Ce qu'il faut savoir\n\n**Ce qui ne dépend pas de tes revenus.** Le remboursement des soins est ouvert dès l'affiliation, sans condition de revenus. Les indemnités journalières et 4 trimestres de retraite s'ouvrent à partir de 600 fois le Smic horaire d'assiette (7 212 € en 2026) ; en dessous, la surcotisation permet de les obtenir (Fiche 3).\n\n**La prime d'activité (CAF).** C'est un complément de revenus pour les travailleurs modestes, salariés ou indépendants, dès 18 ans. Le montant forfaitaire pour une personne seule est de 638,28 € par mois depuis le 1er avril 2026 (décret n° 2026-222) ; la revalorisation de 2026 peut ajouter jusqu'à 54 € par mois et par bénéficiaire. Tu déclares tes ressources tous les trois mois (déclaration trimestrielle) dans ton espace CAF ; la prime est versée chaque mois pendant trois mois, puis recalculée. Le montant dépend de toutes les ressources du foyer : seul le simulateur de la CAF donne un chiffre fiable.\n\n**Comment déclarer tes revenus artistiques à la CAF.**\n\n- En micro-BNC : tu déclares les recettes du trimestre et la CAF retient le montant après l'abattement de 34 %. Les consignes de la CAF demandent le chiffre d'affaires net après abattement et le chiffre d'affaires brut : lis bien l'écran pour ne pas appliquer l'abattement deux fois.\n- En déclaration contrôlée : selon le guide du Cnap (2026), la CAF retient chaque mois le bénéfice de la dernière année fiscale connue (N-2), divisé par 12. Pour le RSA, une fiche plus ancienne de la CAF indique que le conseil départemental évalue ces revenus une fois par an, sur l'avis d'imposition et la liasse fiscale.\n- Moins d'un an d'activité : tu indiques le chiffre d'affaires du trimestre.\n- Droits d'auteur déclarés en traitements et salaires : la CAF demande de les déclarer comme des salaires.\n\n**Le RSA.** Il s'adresse aux personnes de 25 ans et plus (moins de 25 ans sous conditions), résidant en France, aux ressources très faibles. Montant forfaitaire pour une personne seule sans ressources : 651,69 € par mois depuis le 1er avril 2026, diminué d'un forfait logement de 78,20 € si tu touches une aide au logement ou si tu es hébergée gratuitement. La demande se fait à la CAF, en ligne ou sur papier, puis tous les trois mois. Les bénéficiaires sont inscrits automatiquement à France Travail et signent un contrat d'engagement.\n\n**Le parcours France Travail pour les artistes-auteurs au RSA.** Un conseiller qui connaît le secteur fait un diagnostic, puis oriente vers un accompagnement par l'Afdas (si tu es éligible à ses formations) ou vers l'accompagnement classique. Contact : accompagnementartistesauteurs@francetravail.fr.\n\n**La complémentaire santé solidaire (CSS).** Elle prend en charge la part de tes frais de santé que la Sécurité sociale ne rembourse pas. En métropole, depuis le 1er avril 2026, elle est gratuite si les ressources annuelles du foyer ne dépassent pas 10 421 € pour une personne seule, et coûte de 8 à 30 € par mois selon l'âge jusqu'à 14 069 €. Ce sont les ressources des 12 mois précédant la demande qui comptent (du 13e au 2e mois avant la demande). La demande se fait sur ameli.fr et se renouvelle chaque année.\n\n**Les aides au logement.** APL, ALF ou ALS à la CAF (non cumulables, selon le logement et le foyer) ; Fonds de solidarité logement du département pour les impayés de loyer ou d'énergie (demande par un travailleur social) ; Visale (caution gratuite jusqu'à 31 ans) et Loca-Pass (avance du dépôt de garantie, moins de 30 ans) d'Action Logement.\n\n**Les aides propres au régime (Urssaf).** Depuis le 1er juin 2026, l'Urssaf instruit l'action sociale des artistes-auteurs :\n\n- L'aide à la surcotisation : si tes revenus artistiques sont sous 600 fois le Smic et que tu demandes la surcotisation, elle peut prendre en charge les cotisations Sécurité sociale et vieillesse plafonnée (détails dans la Fiche 3).\n- L'aide exceptionnelle à la régularisation des cotisations vieillesse arriérées : elle finance une partie du rachat de trimestres. Selon le Cnap, jusqu'à 75 % du devis de l'Assurance retraite, dans la limite du plafond mensuel de la Sécurité sociale, pour une demande de régularisation faite avant le 1er décembre 2028 (Fiche 8).\n- En novembre 2026, ces versements sont bloqués tant que l'arrêté approuvant le nouveau règlement d'action sociale n'est pas publié (communiqué SSAA du 12 novembre 2026). Si tu ne peux pas payer une échéance, demande plutôt un délai de paiement à l'Urssaf.\n\n**Le bureau d'aide sociale de la Maison des Artistes.** Réservé aux adhérents de l'association. Il peut prendre en charge des cotisations sociales impayées, aider pour des dépenses du quotidien (loyer, énergie), accorder une bourse de matériel ou aider pour les frais de santé. Une assistante sociale étudie le dossier (formulaire, lettre, avis d'imposition, notification CAF, CV artistique et portfolio, RIB).\n\n**Le chômage.** L'activité artistique n'ouvre pas droit à l'allocation chômage (ARE). Un emploi salarié exercé à côté peut, lui, en ouvrir. Le guide du Cnap mentionne aussi une allocation de solidarité spécifique (ASS) accessible aux artistes-auteurs inscrits à France Travail, avec des plafonds de ressources de 1 363,60 € par mois pour une personne seule et 2 142,80 € pour un couple au 1er avril 2026 : à confirmer auprès de France Travail.\n\n**Autres soutiens.** Mon soutien psy (séances remboursées sur orientation du médecin) ; Points conseil budget et Banque de France en cas de difficultés financières ou de surendettement ; allocation d'installation d'atelier de la DRAC (jusqu'à 50 % du coût d'aménagement), qui relève plutôt des aides à la création.\n\n### Ce que je dois faire\n\n- Dès que mes revenus baissent, faire les simulations de la CAF (prime d'activité, RSA, logement) et d'ameli.fr (CSS).\n- Déclarer à la CAF chaque trimestre, à temps, avec la bonne règle pour mes recettes artistiques.\n- Si mon assiette est sous 7 212 € : demander la surcotisation dans la déclaration annuelle, puis l'aide à la surcotisation à l'Urssaf.\n- Si je suis au RSA : demander le conseiller France Travail spécialisé artistes-auteurs.\n- Garder à portée de main l'attestation d'affiliation, le dernier avis d'imposition et le relevé de mes recettes.\n\n### Quand ?\n\nPrime d'activité et RSA : tous les trois mois, et à chaque changement de situation. CSS : chaque année. Barèmes de la CAF et de la CSS : revalorisés chaque 1er avril. Surcotisation : au moment de la déclaration annuelle de revenus.\n\n### Exemple chiffré\n\nTu vis seule, en micro-BNC, avec 8 000 € de recettes sur l'année et aucun autre revenu.\n\n- CAF : pour un trimestre à 2 000 € de recettes, la CAF retient 2 000 × 0,66 = 1 320 €, soit 440 € par mois. Le montant de prime d'activité ou de RSA se calcule ensuite au simulateur.\n- CSS : 8 000 € de ressources sur 12 mois, sous le plafond de 10 421 € : CSS gratuite.\n- Urssaf : assiette 8 000 × 0,66 × 1,15 = 6 072 €, sous 7 212 € : surcotisation possible, avec aide à demander à l'Urssaf.\n\n**Erreurs fréquentes**\n\n- Croire que le statut d'artiste-auteur exclut de la prime d'activité ou du RSA.\n- Appliquer deux fois l'abattement de 34 %, ou déclarer du brut là où l'écran demande du net.\n- Oublier une déclaration trimestrielle : le versement est suspendu.\n- Ne pas demander la CSS alors que tu y as droit.\n- Compter sur une aide de l'Urssaf pour payer une échéance proche alors que les versements sont bloqués.\n\n**À confirmer**\n\n- L'écran actuel de la déclaration trimestrielle de la CAF pour un artiste-auteur (brut ou net) et la règle en déclaration contrôlée (le Cnap et l'ancienne fiche CAF divergent).\n- L'ASS pour les artistes-auteurs : existence et conditions, auprès de France Travail.\n- La date de l'arrêté qui débloque les aides de l'Urssaf et la liste des aides du nouveau règlement d'action sociale.\n- Les heures d'activité demandées au RSA depuis 2025 et leurs adaptations pour les artistes-auteurs.\n\n**Alerte code APE :** aucune.\n\n**Sources :** [Cnap, Les dispositifs sociaux des artistes-auteurs des arts visuels (2026)](https://www.ac-ra.eu/wp-content/uploads/2026/06/Cnap_Droitsetaides_Maquette_Double_260529_WEB-1.pdf) ; [economie.gouv.fr, prime d'activité des indépendants](https://www.economie.gouv.fr/entreprises/travailleurs-independants-prime-activite) ; [service-public, prime d'activité revalorisée en 2026](https://www.service-public.gouv.fr/particuliers/actualites/A18815) ; [CAF, barème du RSA au 1er avril 2026](https://www.caf.fr/professionnels/offres-et-services/accompagnement-des-allocataires/bareme-revenu-de-solidarite-active) ; [CAF, déclaration trimestrielle de l'artiste-auteur](https://www.caf.fr/sites/default/files/medias/623/Tutoriels/DTRSA/fiche1_Web_artiste_auteur.pdf) ; [service-public, plafonds de la CSS au 1er avril 2026](https://www.service-public.gouv.fr/particuliers/actualites/A17326) ; [WebLex, l'Urssaf et l'action sociale](https://www.weblex.fr/weblex-actualite/artistes-auteurs-l-urssaf-devient-votre-interlocuteur-pour-l-action-sociale) ; [Maison des Artistes, formulaire d'aide sociale](https://lamaisondesartistes.fr/site/wp-content/uploads/2024/09/Formulaire-demande-aide-sociale-2024_09-1.pdf) ; [France Travail, artistes-auteurs au RSA](https://www.francetravail.fr/files/live/sites/PE/files/masters/spectacle/Flyer_Artistes_Aut_mars26.pdf). Dernière vérification : 24 novembre 2026. Prochaine revue : avril 2027 (revalorisation des barèmes).\n\n**Fiches liées :** Cotisations, Déclaration annuelle, Micro-BNC ou déclaration contrôlée, Retraite."}],LDH_GLOSSAIRE=[{t:"ADAGP",d:"Organisme de gestion collective des arts visuels. Il perçoit pour toi le droit de suite, les droits de reproduction et les droits collectifs.",e:"Adhésion unique de 15,24 €, sans cotisation annuelle.",f:"9",th:"Statut et organismes"},{t:"Affiliation",d:"Ton entrée officielle dans la Sécurité sociale des artistes-auteurs. Depuis le 1er avril 2026, c'est l'Urssaf qui la prononce.",e:"Tu reçois l'attestation dans la Messagerie de ton espace Urssaf après ta déclaration d'activité.",f:"1",th:"Statut et organismes"},{t:"Afdas",d:"Organisme qui finance la formation professionnelle des artistes-auteu
