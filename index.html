// Icônes : Lucide (script chargé plus haut), rendues en SVG.
const kebab = (n) => n.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
const toNodes = (found) => {
  if (!found) return [];
  if (found.iconNode) return toNodes(found.iconNode);
  if (Array.isArray(found)) {
    if (found[0] === 'svg' && Array.isArray(found[2])) return found[2].filter(Array.isArray);
    return found.filter(n => Array.isArray(n) && typeof n[0] === 'string');
  }
  return [];
};
const makeIcon = (...names) => (props) => {
  const { className = '', ...rest } = props;
  let nodes = [];
  try {
    const lib = (window.lucide && window.lucide.icons) || {};
    const found = names.map(n => lib[n] || lib[kebab(n)]).find(Boolean);
    nodes = toNodes(found);
  } catch (e) {
    nodes = [];
  }
  return React.createElement(
    'svg',
    { xmlns: 'http://www.w3.org/2000/svg', width: 24, height: 24, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round', className, ...rest },
    nodes.map((n, i) => React.createElement(n[0], { key: i, ...(n[1] || {}) }))
  );
};

// THÈME, PROFIL & RÉGLAGES (couche visuelle uniquement : aucune logique métier modifiée)

// ======================================================================
const hexToRgb = (h) => {
  const m = /^#?([0-9a-f]{6})$/i.exec((h || '').trim());
  const n = m ? parseInt(m[1], 16) : 0;
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
};
const toHex = (rgb) => '#' + rgb.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
const mixHex = (a, b, t) => { const A = hexToRgb(a), B = hexToRgb(b); return toHex(A.map((v, i) => v * (1 - t) + B[i] * t)); };
const lumOf = (h) => {
  const [r, g, b] = hexToRgb(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
};
const contrastOf = (a, b) => { const x = lumOf(a), y = lumOf(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
const bestOn = (bg) => (contrastOf(bg, '#FFFFFF') >= contrastOf(bg, '#1B1917') ? '#FFFFFF' : '#1B1917');
const ensureContrast = (fg, bg, min) => {
  const toward = lumOf(bg) > 0.4 ? '#000000' : '#FFFFFF';
  let c = fg;
  for (let i = 0; i < 14 && contrastOf(c, bg) < min; i++) c = mixHex(c, toward, 0.12);
  return c;
};
const rgbaOf = (h, a) => { const [r, g, b] = hexToRgb(h); return `rgba(${r},${g},${b},${a})`; };
const isHex = (v) => /^#[0-9a-f]{6}$/i.test(v || '');

const withDefaults = (raw) => {
  const r = raw && typeof raw === 'object' ? raw : {};
  const colors = { ...DEFAULT_SETTINGS.colors };
  Object.keys(colors).forEach(k => { if (r.colors && isHex(r.colors[k])) colors[k] = r.colors[k]; });
  if (!r.preset || r.preset === 'atelier') Object.assign(colors, PRESETS.atelier.colors);
  if (r.designV !== 3) return { ...DEFAULT_SETTINGS, ...r, colors, ...(r.designV !== 2 ? { fontHeading: 'dmsans', fontBody: 'dmsans', cardOpacity: 62, blur: 18 } : {}), designV: 3 };
  return { ...DEFAULT_SETTINGS, ...r, colors };
};

function buildTheme(s) {
  const c = s.colors;
  const dark = lumOf(c.bg) < 0.35;
  const toward = dark ? '#FFFFFF' : '#000000';
  const op = Math.min(1, Math.max(0.4, s.cardOpacity / 100));
  const tint = mixHex(c.surface, c.accent, 0.12);
  const accentText = ensureContrast(c.accent, tint, 4.5);
  const scrimBase = lumOf(c.primary) < 0.2 ? c.primary : mixHex(c.accent, '#000000', 0.6);
  const heroTo = mixHex(scrimBase, c.accent, 0.55);
  const radius = (RADII[s.radius] || RADII.round)[1];
  const hv = Math.min(1, Math.max(0, s.heroVeil / 100));
  return {
    dark,
    vars: {
      '--bg': c.bg,
      '--surface': rgbaOf(c.surface, op),
      '--surface-solid': c.surface,
      '--soft': mixHex(c.surface, c.text, 0.04),
      '--soft2': mixHex(c.bg, c.text, 0.06),
      '--soft3': mixHex(c.bg, c.text, 0.1),
      '--border': mixHex(c.bg, c.text, 0.09),
      '--border2': mixHex(c.bg, c.text, 0.13),
      '--border3': mixHex(c.bg, c.text, 0.28),
      '--edge': dark ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.75)',
      '--coral-1': mixHex(c.accent, '#FFFFFF', 0.14),
      '--coral-2': mixHex(c.accent, '#F59A6C', 0.5),
      '--text': c.text,
      '--t7': mixHex(c.text, c.bg, 0.08),
      '--t6': mixHex(c.text, c.bg, 0.18),
      '--t5': mixHex(c.text, c.bg, 0.3),
      '--t4': mixHex(c.text, c.bg, 0.52),
      '--t3': mixHex(c.text, c.bg, 0.75),
      '--primary': c.primary,
      '--primary-2': mixHex(c.primary, toward === '#FFFFFF' && lumOf(c.primary) < 0.4 ? '#FFFFFF' : '#000000', 0.14),
      '--primary-hover': mixHex(c.primary, '#000000', lumOf(c.primary) < 0.4 ? 0.6 : 0.12),
      '--primary-a': rgbaOf(c.primary, 0.14),
      '--on-primary': bestOn(c.primary),
      '--accent': c.accent,
      '--accent-hover': mixHex(c.accent, '#000000', 0.2),
      '--on-accent': contrastOf(c.accent, '#FFFFFF') >= 3 ? '#FFFFFF' : bestOn(c.accent),
      '--accent-text': accentText,
      '--accent-strong': mixHex(accentText, toward, 0.2),
      '--tint1': mixHex(c.surface, c.accent, 0.07),
      '--tint': tint,
      '--tint2': mixHex(c.surface, c.accent, 0.2),
      '--tint3': mixHex(c.surface, c.accent, 0.3),
      '--tint-bg': mixHex(c.bg, c.accent, 0.08),
      '--accent-a20': rgbaOf(c.accent, 0.2),
      '--accent-a35': rgbaOf(c.accent, 0.35),
      '--accent-a60': rgbaOf(c.accent, 0.6),
      '--highlight': c.highlight,
      '--icon-on-primary': ensureContrast(c.highlight, c.primary, 3),
      '--logo-bg': mixHex(c.bg, c.accent, 0.14),
      '--shadow': dark ? '0 10px 30px -12px rgba(0,0,0,0.6)' : `0 8px 24px -12px ${rgbaOf(c.text, 0.32)}`,
      '--header-bg': rgbaOf(c.bg, 0.78),
      '--side-bg': rgbaOf(c.surface, Math.min(1, op * 0.94)),
      '--veil': rgbaOf(c.bg, Math.min(1, Math.max(0, s.bgVeil / 100))),
      '--overlay': dark ? 'rgba(0,0,0,0.65)' : 'rgba(44,41,39,0.6)',
      '--hero-a': rgbaOf(scrimBase, 0.55 + hv * 0.4),
      '--hero-b': rgbaOf(heroTo, 0.35 + hv * 0.4),
      '--hero-from': scrimBase,
      '--hero-to': heroTo,
      '--scrim': mixHex(scrimBase, '#000000', 0.35),
      '--scrim-a': rgbaOf(mixHex(scrimBase, '#000000', 0.35), 0.82),
      '--blur': `${Math.max(0, Math.min(30, s.blur))}px`,
      '--r1': radius[0],
      '--r2': radius[1],
      '--r3': radius[2],
      '--font-heading': (FONT_HEADINGS[s.fontHeading] || FONT_HEADINGS.lora)[1],
      '--font-body': (FONT_BODIES[s.fontBody] || FONT_BODIES.system)[1]
    }
  };
}

const UiContext = React.createContext({ profile: DEFAULT_PROFILE, images: {}, settings: DEFAULT_SETTINGS });

// Réduit une image choisie sur l'ordinateur avant de la garder dans le navigateur.
const fileToDataUrl = (file, maxSide, keepAlpha) => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onerror = () => reject(reader.error);
  reader.onload = () => {
    if (file.type === 'image/svg+xml') { resolve(reader.result); return; }
    const img = new Image();
    img.onerror = () => reject(new Error('image illisible'));
    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * k));
      const h = Math.max(1, Math.round(img.height * k));
      const cv = document.createElement('canvas');
      cv.width = w;
      cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(keepAlpha ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', 0.82));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});

const initialsOf = (name) => (name || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase() || '?';

function Avatar({ src, name, size = 40, className = '' }) {
  const style = { width: size, height: size, fontSize: Math.round(size * 0.38) };
  if (src) return <span className={`tl-avatar ${className}`} style={{ ...style, backgroundImage: `url(${src})` }} role="img" aria-label={name || 'Avatar'} />;
  return <span className={`tl-avatar tl-avatar-empty ${className}`} style={style} aria-hidden="true">{initialsOf(name)}</span>;
}

// Visuel d'un média : photo, vidéo ou aperçu de texte.
function Cover({ m }) {
  const [failed, setFailed] = useState(false);
  if (m.type === 'text' || !m.url || failed) {
    return (
      <div className="tl-cover-fallback">
        {m.type === 'text' ? <p>{(m.notes || m.title || '').slice(0, 140)}</p> : <span>{TYPE_ICONS[m.type] || '🖼️'}</span>}
      </div>
    );
  }
  if (isVideoSource(m)) {
    return <video src={m.url.includes('#') ? m.url : m.url + '#t=0.1'} muted playsInline preload="metadata" onError={() => setFailed(true)} className="tl-cover-media" />;
  }
  return <img src={m.url} alt="" onError={() => setFailed(true)} className="tl-cover-media" />;
}

const fmtDay = (iso) => {
  const d = new Date(iso + 'T12:00:00');
  return isNaN(d) ? iso : d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
};

  return (
    <span className="tl-tip" tabIndex={0} role="note" aria-label={text} onClick={(e) => e.stopPropagation()}>
      <InfoIcon className="w-4 h-4" />
      <span className="tl-tip-box" role="tooltip">{text}</span>

  );
}

      {hint && <span className="block text-xs text-stone-400">{hint}</span>}

function Section({ icon, title, desc, children }) {
  const mobile = useMedia('(max-width: 820px)');
  const [open, setOpen] = useState(false);
  const shown = !mobile || open;
  return (
    <section className="wd-card" style={{ gap: 14 }}>
      {mobile ? (
        <button type="button" className="st-fold" onClick={() => setOpen(!open)} aria-expanded={open}>
          <span className="wd-h2" style={{ fontSize: 16 }}>{icon}{title}{desc && <InfoTip text={desc} />}</span>
          {open ? <ChevronUp className="w-4 h-4 opacity-60" /> : <ChevronDown className="w-4 h-4 opacity-60" />}
        </button>
      ) : (
        <div>
          <h3 className="wd-h2" style={{ fontSize: 16 }}>{icon}{title}{desc && <InfoTip text={desc} />}</h3>
        </div>
      )}
      {shown && children}
    </section>
  );
}

  return (

function Slider({ label, value, min, max, step = 1, unit = '', onChange }) {

    </label>
  );
}

function ImageField({ label, hint, value, onSet, maxSide = 1600, keepAlpha = false, round = false, notify }) {
  const [link, setLink] = useState('');
  const inputRef = React.useRef(null);
  const onFile = async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    if (!f.type.startsWith('image/')) { notify('Choisis un fichier image.'); return; }
    try { onSet(await fileToDataUrl(f, maxSide, keepAlpha)); } catch (err) { notify('Impossible de lire cette image.'); }
  };
  const applyLink = () => {
    const v = link.trim();
    if (!v) return;
    if (!/^https?:\/\//i.test(v)) { notify('Colle un lien complet, qui commence par https://'); return; }
    onSet(v);
    setLink('');
  };
  return (
    <div className="space-y-2">
      <div className="text-xs font-bold text-stone-700">{label}</div>
      <div className="flex items-center gap-3">
        <div className={`tl-thumb ${round ? 'is-round' : ''}`} style={value ? { backgroundImage: `url(${value})` } : undefined}>
          {!value && <ImageIcon className="w-5 h-5 text-stone-400" />}
        </div>
        <div className="flex flex-wrap items-center gap-2">
          <input ref={inputRef} type="file" accept="image/*" onChange={onFile} className="hidden" aria-label={label} />

// --- AUJOURD'HUI : les 3 choses les plus utiles à faire maintenant ---
const daysSince = (iso) => -daysUntil(iso);
const backupInfo = (lastBackup, since, days) => {
  const ref = lastBackup || since || toIso(new Date());
  const n = daysSince(ref);
  return { n, never: !lastBackup, due: days > 0 && n >= days };
};

function buildTodayActions({ postsList, contactsList, openCallsList, backup }) {
  const now = new Date();
  const today = toIso(now);
  const nowKey = `${today}T${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  const acts = [];

  postsList.filter(p => p.status !== 'published').forEach(p => {
    const late = `${p.date}T${p.time || '00:00'}` < nowKey;
    const soon = p.date >= today && daysUntil(p.date) <= 2;
    if (late) {
      acts.push({ id: 'p' + p.id, score: 90, tone: 'rose', tab: 'agenda', emoji: '📣', title: `Publier « ${p.title} »`, sub: `${PLATFORMS[p.platform] || 'Post'} · prévu le ${fmtLong(p.date)}${p.time ? ' à ' + p.time : ''}, en retard`, cta: 'Ouvrir l’agenda' });
    } else if (p.date === today) {
      acts.push({ id: 'p' + p.id, score: 70, tone: 'amber', tab: 'agenda', emoji: '📣', title: p.status === 'draft' ? `Finaliser « ${p.title} »` : `Publier « ${p.title} » aujourd’hui`, sub: `${PLATFORMS[p.platform] || 'Post'}${p.time ? ' · à ' + p.time : ''}`, cta: 'Ouvrir l’agenda' });
    } else if (p.status === 'draft' && soon) {
      acts.push({ id: 'p' + p.id, score: 50, tone: 'amber', tab: 'agenda', emoji: '✍️', title: `Finaliser « ${p.title} »`, sub: `${PLATFORMS[p.platform] || 'Post'} · prévu ${deadlineLabel(p.date)}`, cta: 'Ouvrir l’agenda' });
    }
  });

  contactsList.filter(c => c.followUpDate && c.followUpDate <= today).forEach(c => {
    const late = daysSince(c.followUpDate);
    acts.push({ id: 'c' + c.id, score: 80 + Math.min(late, 10) / 10, tone: 'rose', tab: 'contacts', emoji: '📬', title: `Relancer ${c.name}`, sub: `${c.detail || 'Contact'} · ${late > 0 ? `relance en retard de ${plural(late, 'jour', 'jours')}` : 'relance prévue aujourd’hui'}`, cta: 'Écrire' });
  });

  openCallsList.filter(isCallOpen).forEach(o => {
    if (!o.deadline) return;
    const n = daysUntil(o.deadline);
    if (n > 21) return;
    const cp = callProgress(o);
    const prog = cp.next ? ` · ${cp.done}/${cp.total} étapes, ensuite : ${cp.next.label.toLowerCase()}` : '';
    acts.push({ id: 'o' + o.id, score: n < 0 ? 95 : n <= 7 ? 85 : 60, tone: n <= 7 ? 'rose' : 'amber', tab: 'opencalls', emoji: '🏛️', title: `Candidature : ${o.title}`, sub: `Date limite ${deadlineLabel(o.deadline)}${prog}`, cta: 'Préparer le dossier' });
  });

  if (backup.due) {
    acts.push({ id: 'backup', score: 40, tone: 'amber', tab: 'cloud', emoji: '🛟', title: 'Faire une sauvegarde complète', sub: backup.never ? 'Tu n’as encore jamais téléchargé de sauvegarde complète (.zip).' : `Dernière sauvegarde complète il y a ${plural(backup.n, 'jour', 'jours')}.`, cta: 'Sauvegarder' });
  }
  const sorted = acts.sort((a, b) => b.score - a.score);
  return { top: sorted.slice(0, 3), more: Math.max(0, sorted.length - 3) };
}

function useMedia(query) {
  const [m, setM] = useState(() => window.matchMedia(query).matches);
  useEffect(() => {
    const mq = window.matchMedia(query);
    const on = () => setM(mq.matches);
    if (mq.addEventListener) mq.addEventListener('change', on); else mq.addListener(on);
    on();
    return () => { if (mq.removeEventListener) mq.removeEventListener('change', on); else mq.removeListener(on); };
  }, [query]);
  return m;
}

const fmtLong = (iso) => {
  const d = new Date(iso + 'T12:00:00');
  return isNaN(d) ? iso : d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' });
};
const plural = (n, one, many) => `${n} ${n > 1 ? many : one}`;
const TAB_ICONS = { agenda: Megaphone, opencalls: Landmark, contacts: Mail, cloud: ShieldCheck, studio: ImageIcon };
const PLATFORM_ICONS = { instagram: Instagram, linkedin: Briefcase, gmail: Mail };
const TYPE_ICON_C = { image: ImageIcon, video: Video, text: PenLine };

// --- Cloche : retards, échéances, rappels ---
function buildNotifications({ postsList, contactsList, openCallsList, backup }) {
  const now = new Date();
  const today = toIso(now);
  const nowKey = `${today}T${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  const late = [], due = [], remind = [];
  postsList.filter(p => p.status !== 'published' && `${p.date}T${p.time || '00:00'}` < nowKey).forEach(p => {
    late.push({ id: 'p' + p.id, tab: 'agenda', Icon: Megaphone, title: `Publier « ${p.title} »`, sub: `${PLATFORMS[p.platform] || 'Post'} · prévu le ${fmtLong(p.date)}` });
  });
  contactsList.filter(c => c.followUpDate && c.followUpDate <= today).forEach(c => {
    const n = daysSince(c.followUpDate);
    (n > 0 ? late : due).push({ id: 'c' + c.id, tab: 'contacts', Icon: Mail, title: `Relancer ${c.name}`, sub: n > 0 ? `Relance en retard de ${plural(n, 'jour', 'jours')}` : 'Relance prévue aujourd’hui' });
  });
  openCallsList.filter(isCallOpen).forEach(o => {
    if (!o.deadline) return;
    const n = daysUntil(o.deadline);
    if (n > 21) return;
    const cp = callProgress(o);
    (n < 0 ? late : due).push({ id: 'o' + o.id, tab: 'opencalls', Icon: Landmark, title: o.title, sub: `${n < 0 ? 'Date limite ' + deadlineLabel(o.deadline) : 'Date limite ' + deadlineLabel(o.deadline)}${cp.next ? ` · étape ${cp.nextIndex} sur ${cp.total}` : ''}` });
  });
  if (backup.due) {
    remind.push({ id: 'backup', tab: 'cloud', Icon: ShieldCheck, title: 'Faire une sauvegarde', sub: backup.never ? 'Tu n’as encore jamais téléchargé de sauvegarde' : `La dernière date de ${plural(backup.n, 'jour', 'jours')}` });
  }
  const groups = [
    { key: 'late', label: 'En retard', color: '#e5546b', items: late },
    { key: 'due', label: 'Échéances', color: '#f3b92d', items: due },
    { key: 'remind', label: 'Rappels', color: '#8e74e0', items: remind }
  ].filter(g => g.items.length > 0);
  return { groups, total: late.length + due.length + remind.length };
}

const WIDGET_DEFAULT_D = [['profil', 1], ['candid', 2], ['today', 2], ['thalie', 1], ['atelier', 3]];
const WIDGET_DEFAULT_M = [['profil', 1], ['candid', 1], ['today', 1], ['timer', 1]];
const WIDGET_PRESETS = {
  'Complet': WIDGET_DEFAULT_D,
  'Essentiel': [['today', 2], ['timer', 1], ['atelier', 3]],
  'Candidatures': [['candid', 3], ['today', 2], ['relances', 1], ['agenda', 2], ['backup', 1]],
  'Création': [['atelier', 3], ['thalie', 1], ['pubs', 2], ['rythme', 1]]
};

function WCard({ icon: Icon, title, right, className = '', children }) {
  return (
    <div className={`wd-card ${className}`}>
      {title && <h3 className="wd-h">{Icon && <Icon className="w-4 h-4" />}{title}{right}</h3>}
      {children}
    </div>
  );
}

const dueText = (iso) => {
  const n = daysUntil(iso);
  return n < 0 ? `Dépassée depuis ${plural(-n, 'jour', 'jours')}` : n === 0 ? 'Aujourd’hui' : n === 1 ? 'Demain' : `Dans ${n} jours`;
};
const weekStartOf = () => { const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return toIso(d); };

// Widget « Récemment dans l'atelier » : filtres par type, tuiles pastel, réseaux où le contenu a servi.

        const dim = new Date(y, m + 1, 0).getDate();
        const has = new Set(posts.map(p => p.date));

        for (let i = 0; i < offset; i++) cells.push(<span key={'o' + i} className="o" />);
        for (let d = 1; d <= dim; d++) {

        <div className="wd-card wd-flash">
          <span className="wd-ic" style={{ background: 'var(--p-butter)', color: 'var(--ink-fixed)' }}><Clock className="w-4 h-4" /></span>
          <span><b>Session flash</b><span className="wd-timer2">{c.timer.format(c.timer.seconds)}</span></span>
          <button className="wd-round" onClick={c.timer.toggle} aria-label={c.timer.active ? 'Pause' : 'Lancer'}>{c.timer.active ? <Pause className="w-4 h-4" /> : <Play className="w-4 h-4" />}</button>

}

// --- Dépôt rapide : photo, vidéo, note, dictée ---
function DepositSheet({ open, onClose, onAdd, notify }) {
  const [type, setType] = useState(null);
  const [title, setTitle] = useState('');
  const [tags, setTags] = useState('');
  const [notes, setNotes] = useState('');
  const [url, setUrl] = useState('');
  const [files, setFiles] = useState([]);
  const [fileKey, setFileKey] = useState(0);
  const [listening, setListening] = useState(false);
  const rec = React.useRef(null);
  const stop = () => { try { rec.current && rec.current.stop(); } catch (e) { /* déjà arrêté */ } setListening(false); };
  const reset = () => { stop(); setType(null); setTitle(''); setTags(''); setNotes(''); setUrl(''); setFiles([]); setFileKey(k => k + 1); };
  const close = () => { reset(); onClose(); };
  useEffect(() => { if (!open) stop(); }, [open]);
  if (!open) return null;

  const pick = (t) => { setType(t); setFiles([]); setFileKey(k => k + 1); };
  const dictate = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { notify('La dictée n’est pas disponible dans ce navigateur (essaie Chrome ou Safari).'); return; }
    setType('text');
    if (listening) { stop(); return; }
    const r = new SR();
    r.lang = 'fr-FR';
    r.continuous = true;
    r.interimResults = false;
    r.onresult = (e) => {
      const t = Array.from(e.results).slice(e.resultIndex).map(x => x[0].transcript).join(' ').trim();
      if (t) setNotes(n => (n ? n.replace(/\s+$/, '') + ' ' : '') + t);
    };
    r.onend = () => setListening(false);
    r.onerror = () => { setListening(false); notify('Micro indisponible ou refusé : vérifie l’autorisation du navigateur.'); };
    try { r.start(); rec.current = r; setListening(true); } catch (e) { notify('Impossible de démarrer la dictée.'); }
  };
  const submit = (e) => {
    e.preventDefault();
    if (type === 'text' && !notes.trim()) { notify('Écris ou dicte ton texte avant de l’enregistrer.'); return; }
    if (type !== 'text' && files.length === 0 && !url.trim()) { notify('Choisis un fichier ou colle un lien.'); return; }
    stop();
    const tagsArray = tags ? tags.split(',').map(t => t.trim().replace(/^#/, '')).filter(Boolean) : [];
    onAdd(type, title, notes, url, tagsArray, files);
    close();
  };
  const tiles = [
    ['image', Camera, 'Photo', 'Choisir un fichier', 'var(--p-rose)'],
    ['video', Video, 'Vidéo', 'Choisir un fichier', 'var(--p-peach)'],
    ['text', PenLine, 'Note', 'Écrire une pensée', 'var(--p-lav)']
  ];
  return (
    <>
      <div className="tl-scrim" onClick={close} />
      <div className="tl-sheet" role="dialog" aria-label="Déposer dans l’atelier">
        <div className="tl-handle" />
        <div className="wd-row"><h3 className="wd-h2">Déposer dans l’atelier</h3><button className="wd-ib wd-sp" onClick={close} aria-label="Fermer"><XIcon className="w-4 h-4" /></button></div>
        <div className="wd-quick">
          {tiles.map(([k, I, label, sub, bg]) => (
            <button key={k} type="button" className={`wd-q ${type === k ? 'on' : ''}`} style={{ background: bg }} onClick={() => pick(k)}><span className="wd-ic"><I className="w-5 h-5" /></span><span><b>{label}</b><small>{sub}</small></span></button>
          ))}
          <button type="button" className={`wd-q ${listening ? 'on' : ''}`} style={{ background: 'var(--p-mint)' }} onClick={dictate}><span className="wd-ic"><Mic className="w-5 h-5" /></span><span><b>{listening ? 'J’écoute…' : 'Dicter'}</b><small>{listening ? 'Touche pour arrêter' : 'Parler, le texte s’écrit'}</small></span></button>
        </div>
        {type && (
          <form onSubmit={submit} className="wd-form">
            {type !== 'text' && (
              <div className="wd-two">
                <FileIn key={fileKey} type="file" multiple accept={type === 'image' ? 'image/*' : 'video/*'} onChange={(e) => setFiles(Array.from(e.target.files || []))} aria-label="Choisir un fichier sur l’ordinateur" className="wd-field" />
                <input type="url" value={url} onChange={(e) => setUrl(e.target.value)} placeholder="… ou un lien vers le fichier" className="wd-field" />
              </div>
            )}
            <div className="wd-two">
              <input type="text" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Titre (facultatif)" className="wd-field" />
              <input type="text" value={tags} onChange={(e) => setTags(e.target.value)} placeholder="Mots-clés : huile, bleu, or…" className="wd-field" />
            </div>
            <textarea value={notes} onChange={(e) => setNotes(e.target.value)} placeholder={type === 'text' ? 'Ta pensée, un extrait de carnet…' : 'Notes d’atelier…'} className="wd-field" style={{ minHeight: type === 'text' ? 110 : 64 }} />
            <button type="submit" className="wd-btn wd-dark wd-wide">Enregistrer dans l’atelier</button>
          </form>
        )}
      </div>
    </>
  );
}

// Variables des modèles : remplacées à l'insertion dans un message adressé à un contact.
const fillVars = (text, c) => {
  if (!c) return text;
  const full = c.name || '';
  const parts = full.trim().split(/\s+/);
  const map = { 'prénom': parts[0] || '', 'prenom': parts[0] || '', 'nom': parts.slice(1).join(' ') || full, 'nom complet': full, 'structure': c.detail || '' };
  return text.replace(/\{\s*([^{}]+?)\s*\}/g, (m, k) => (Object.prototype.hasOwnProperty.call(map, k.toLowerCase()) ? map[k.toLowerCase()] : m));
};
const TEMPLATE_TYPES = { instagram: 'Instagram', linkedin: 'LinkedIn', gmail: 'Newsletter', email: 'E-mail', other: 'Tous usages' };
const TEMPLATE_COLORS = {
  instagram: 'bg-rose-100 text-rose-800',
  linkedin: 'bg-blue-100 text-blue-800',
  gmail: 'bg-emerald-100 text-emerald-800',
  email: 'bg-amber-100 text-amber-800',
  other: 'bg-stone-200 text-stone-700'
};
// Un modèle « Tous usages » (ou sans type) est proposé partout.
const templateFits = (t, kinds) => !t.type || t.type === 'other' || kinds.includes(t.type);

function TemplatesView({ templates, setTemplates, notify }) {
  const [newTitle, setNewTitle] = useState('');
  const [newContent, setNewContent] = useState('');
  const [newType, setNewType] = useState('instagram');
  const [filter, setFilter] = useState('all');
  const [editId, setEditId] = useState(null);
  const [draft, setDraft] = useState({ title: '', content: '', type: 'other' });
  const [confirmId, setConfirmId] = useState(null);

  const keyOf = (t) => t.id || t.title;
  const shown = templates.filter(t => filter === 'all' || (t.type || 'other') === filter);

  const handleAddTemplate = (e) => {
    e.preventDefault();
    if (!newTitle.trim() || !newContent.trim()) return;
    setTemplates([...templates, { id: 't_' + Date.now(), title: newTitle.trim(), content: newContent, type: newType }]);
    setNewTitle('');
    setNewContent('');
    notify("Nouveau modèle enregistré !");
  };

  const startEdit = (t) => {
    setEditId(keyOf(t));
    setDraft({ title: t.title, content: t.content, type: t.type || 'other' });
    setConfirmId(null);
  };

  const saveEdit = () => {
    if (!draft.title.trim() || !draft.content.trim()) {
      notify('Le titre et le texte ne peuvent pas être vides.');
      return;
    }
    setTemplates(templates.map(t => keyOf(t) === editId ? { ...t, ...draft, title: draft.title.trim() } : t));
    setEditId(null);
    notify('Modèle enregistré');
  };

  const removeTemplate = (t) => {
    setTemplates(templates.filter(x => keyOf(x) !== keyOf(t)));
    setConfirmId(null);
    notify('Modèle supprimé.');
  };

  const [showForm, setShowForm] = useState(false);
  const FILTER_ICONS = { all: LayoutGrid, instagram: Instagram, linkedin: Briefcase, gmail: Mail, email: Mail, other: Sparkles };
  const TYPE_ICON_T = FILTER_ICONS;
  const typeSelect = (value, onChange, label) => (
    <select value={value} onChange={(e) => onChange(e.target.value)} aria-label={label} className="tp-field">
      {Object.keys(TEMPLATE_TYPES).map(k => <option key={k} value={k}>{TEMPLATE_TYPES[k]}</option>)}
    </select>
  );

  return (
    <div className="space-y-6">
      <div className="tl-ph flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div className="tl-titlerow">
          <h2 className="font-serif font-bold text-lg text-stone-900">Modèles & notes</h2>
          <InfoTip text="Tes blocs de texte récurrents : signatures, intros, hashtags. Chaque modèle est proposé là où il sert ; « Tous usages » apparaît partout." />
        </div>
        <button onClick={() => setShowForm(!showForm)} className="wd-btn wd-coralbtn"><Plus className="w-4 h-4" />{showForm ? 'Fermer' : 'Nouveau modèle'}</button>
      </div>

      {showForm && (
        <form onSubmit={(e) => { handleAddTemplate(e); }} className="wd-card tp-form">
          <h3 className="wd-h2">Nouveau modèle</h3>
          <div className="wd-two">
            <input type="text" placeholder="Titre du modèle (ex : Signature Instagram)" value={newTitle} onChange={(e) => setNewTitle(e.target.value)} className="tp-field" />
            {typeSelect(newType, setNewType, 'Type du modèle')}
          </div>
          <textarea placeholder="Contenu du texte…" value={newContent} onChange={(e) => setNewContent(e.target.value)} className="tp-field" style={{ minHeight: 110 }} />
          <small style={{ color: 'var(--t5)' }}>Astuce : écris <code>{'{prénom}'}</code>, <code>{'{nom}'}</code> ou <code>{'{structure}'}</code> : ils se remplissent tout seuls quand tu ajoutes le modèle à un mail pour un contact.</small>
          <button type="submit" className="wd-btn wd-dark self-start"><Check className="w-4 h-4" />Ajouter ce modèle</button>
        </form>
      )}

      <div className="wd-chips">
        {['all', ...Object.keys(TEMPLATE_TYPES)].map(k => {
          const I = TYPE_ICON_T[k];
          return (
            <button key={k} onClick={() => setFilter(k)} className={`wd-chip ${filter === k ? 'wd-chipon' : ''}`}>
              <I className="w-3.5 h-3.5" />
              {k === 'all' ? `Tous (${templates.length})` : `${TEMPLATE_TYPES[k]} (${templates.filter(t => (t.type || 'other') === k).length})`}
            </button>
          );
        })}
      </div>

      <div className="fl-grid">
        {shown.map((tpl) => {
          const TI = TYPE_ICON_T[tpl.type || 'other'];
          return editId === keyOf(tpl) ? (
            <div key={keyOf(tpl)} className="tp-card is-edit">
              <input type="text" value={draft.title} onChange={(e) => setDraft({ ...draft, title: e.target.value })} aria-label="Titre du modèle" className="tp-field font-bold" />
              {typeSelect(draft.type, (v) => setDraft({ ...draft, type: v }), 'Type du modèle')}
              <textarea value={draft.content} onChange={(e) => setDraft({ ...draft, content: e.target.value })} aria-label="Contenu du modèle" className="tp-field" style={{ minHeight: 120 }} />
              <div className="tp-acts">
                <button onClick={saveEdit} className="wd-btn wd-dark"><Check className="w-4 h-4" />Enregistrer</button>
                <button onClick={() => setEditId(null)} className="wd-btn">Annuler</button>
              </div>
            </div>
          ) : (
            <div key={keyOf(tpl)} className={`tp-card tp-${tpl.type || 'other'}`}>
              <div className="flex items-center justify-between gap-2">
                <h4 className="font-serif">{tpl.title}</h4>
                <span className="wd-t flex-shrink-0"><TI className="w-3.5 h-3.5" />{TEMPLATE_TYPES[tpl.type || 'other']}</span>
              </div>
              <p className="tp-body">{tpl.content}</p>
              <div className="tp-acts">
                <button
                  className="tp-btn"
                  onClick={async () => {
                    const ok = await copyText(tpl.content);

                  }}
                ><Copy className="w-3.5 h-3.5" />Copier</button>
                <button onClick={() => startEdit(tpl)} className="tp-btn"><PenLine className="w-3.5 h-3.5" />Modifier</button>
                {confirmId === keyOf(tpl) ? (
                  <span className="tp-del flex items-center gap-2">
                    Supprimer ?
                    <button onClick={() => removeTemplate(tpl)} className="font-bold underline">Oui</button>
                    <button onClick={() => setConfirmId(null)} className="underline">Non</button>
                  </span>
                ) : (
                  <button onClick={() => setConfirmId(keyOf(tpl))} className="tp-del" aria-label={`Supprimer ${tpl.title}`}><Trash2 className="w-4 h-4" /></button>
                )}
              </div>
            </div>
          );
        })}
        <button className="tp-new" onClick={() => { setShowForm(true); try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) { /* facultatif */ } }}>
          <Plus className="w-6 h-6" />Créer un modèle
        </button>
      </div>
    </div>
  );
}

  Presse: ['rgba(59,130,246,0.14)', 'rgba(59,130,246,0.35)'],
  Newsletter: ['rgba(245,158,11,0.16)', 'rgba(245,158,11,0.4)']
};
const CONTACT_TAG_OPTIONS = [['Galerie', '🏛️ Galerie & Curateur'], ['Collectionneur', '🎨 Collectionneur'], ['Presse', '📰 Presse / Médias'], ['Newsletter', '💌 Abonnés Newsletter']];
const CONTACT_STATUSES = ['Premier contact', 'Discussion active', 'Fidèle', 'Régulier', 'En pause', 'Sans réponse'];
const addDays = (iso, n) => {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return toIso(d);
};

function ContactPhotoField({ value, onSet, name, notify }) {
  const ref = React.useRef(null);
  const onFile = async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    if (!f.type.startsWith('image/')) { notify('Choisis un fichier image.'); return; }
    try { onSet(await fileToDataUrl(f, 256, false)); } catch (err) { notify('Impossible de lire cette image.'); }
  };
  return (
    <div className="flex items-center gap-3">
      <Avatar src={value} name={name} size={56} />
      <div className="flex flex-wrap items-center gap-2">
        <input ref={ref} type="file" accept="image/*" onChange={onFile} className="hidden" aria-label="Photo du contact" />
        <button type="button" onClick={() => ref.current && ref.current.click()} className="bg-[#2C2927] hover:bg-black text-white text-xs px-3 py-1.5 rounded-xl font-semibold flex items-center gap-1.5">
          <Upload className="w-3.5 h-3.5 text-amber-300" /> {value ? 'Changer la photo' : 'Ajouter une photo'}
        </button>
        {value && <button type="button" onClick={() => onSet('')} className="bg-[#F4F0EA] hover:bg-[#EBE5DA] text-stone-800 text-xs px-3 py-1.5 rounded-xl font-semibold">Retirer</button>}
      </div>
    </div>
  );
}

function ContactsView({ onWin = () => {}, contacts, setContacts, sentHistory, setSentHistory, mediaList, templates = [], notify }) {
  const [filterTag, setFilterTag] = useState('Tous');
  const [searchQuery, setSearchQuery] = useState('');
  
  // Selection multiple de contacts
  const [selectedContactIds, setSelectedContactIds] = useState([]);
  const [selectedTemplateTitle, setSelectedTemplateTitle] = useState('');

  const [selectedContactForEmail, setSelectedContactForEmail] = useState(null);
  const [emailSubject, setEmailSubject] = useState('');
  const [emailBody, setEmailBody] = useState('');
  const [attachedMediaId, setAttachedMediaId] = useState('');
  const [shownOpenId, setShownOpenId] = useState(null);
  const toggleShown = (c, mid) => setContacts(contacts.map(x => x.id === c.id ? { ...x, shown: (x.shown || []).includes(mid) ? x.shown.filter(i => i !== mid) : [...(x.shown || []), mid] } : x));
  
  // Historique des envois
    
  const [showAddForm, setShowAddForm] = useState(false);
  const [newName, setNewName] = useState('');
  const [newDetail, setNewDetail] = useState('');
  const [newEmail, setNewEmail] = useState('');
  const [newTag, setNewTag] = useState('Galerie');
  const [newPhoto, setNewPhoto] = useState('');
  const [newFollowUp, setNewFollowUp] = useState('');
  const [openHistoryId, setOpenHistoryId] = useState(null);
  const [confirmHistoryId, setConfirmHistoryId] = useState(null);
  const [historyFilter, setHistoryFilter] = useState('all');
  const [editContactId, setEditContactId] = useState(null);
  const [contactDraft, setContactDraft] = useState({ name: '', email: '', detail: '', tag: 'Galerie', photo: '', followUpDate: '' });
  const [confirmContactId, setConfirmContactId] = useState(null);
  const [relanceOpenId, setRelanceOpenId] = useState(null);
  const [relanceDate, setRelanceDate] = useState('');
  const [relanceDays, setRelanceDays] = useState('');

  const todayKey = toIso(new Date());
  const isDue = (c) => !!c.followUpDate && c.followUpDate <= todayKey;
  const lateDays = (c) => Math.max(0, Math.round((new Date(todayKey + 'T12:00:00') - new Date(c.followUpDate + 'T12:00:00')) / 86400000));
  const relanceFor = (day) => (relanceDays ? { followUpDate: addDays(day, Number(relanceDays)) } : {});
  const relanceNote = (day) => (relanceDays ? ` Relance prévue le ${fmtDay(addDays(day, Number(relanceDays)))}.` : '');

  const mailTemplates = templates.filter(t => templateFits(t, ['email', 'gmail']));

  const filteredContacts = contacts.filter(c => {
    const matchesTag = filterTag === 'Tous' || (filterTag === 'À relancer' ? isDue(c) : c.tag === filterTag);
    const matchesQuery = 
      c.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
      c.detail.toLowerCase().includes(searchQuery.toLowerCase()) ||
      (c.email || '').toLowerCase().includes(searchQuery.toLowerCase());
    return matchesTag && matchesQuery;
  });

  const toggleContactSelection = (id) => {
    if (selectedContactIds.includes(id)) {
      setSelectedContactIds(selectedContactIds.filter(cId => cId !== id));
    } else {
      setSelectedContactIds([...selectedContactIds, id]);
    }
  };

  const handleSelectAllContacts = () => {
    const allFilteredIds = filteredContacts.map(c => c.id);
    if (selectedContactIds.length === allFilteredIds.length) {
      setSelectedContactIds([]);
    } else {
      setSelectedContactIds(allFilteredIds);
    }
  };

  // Chaque modèle choisi s'ajoute à la suite du message ; le menu revient à zéro pour en ajouter un autre.
  const handleApplyTemplate = (templateId) => {
    const found = templates.find(t => (t.id || t.title) === templateId);
    if (!found) return;
    const who = selectedContactForEmail && !selectedContactForEmail.ids ? contacts.find(c => c.id === selectedContactForEmail.id) : (selectedContactForEmail && selectedContactForEmail.ids && selectedContactForEmail.ids.length === 1 ? contacts.find(c => c.id === selectedContactForEmail.ids[0]) : null);
    setEmailBody(body => (body.trim() ? body.replace(/\s+$/, '') + '\n\n' : '') + fillVars(found.content, who));
    setSelectedTemplateTitle('');
  };

  const handleOpenEmailComposer = (contact) => {
    setSelectedContactForEmail(contact);
    setEmailSubject(contact.tag === 'Newsletter' ? "Nouvelles fraîches de l'atelier" : `Suivi & Actualités - Atelier Thalie / ${contact.name}`);
    setEmailBody(`Bonjour ${contact.name.split(' ')[0]},\n\nJ'espère que vous allez bien.\n\nJe souhaitais partager avec vous les dernières créations sorties de l'atelier...`);
  };

  const handleOpenBulkEmailComposer = () => {
    if (selectedContactIds.length === 0) {
      notify("Veuillez sélectionner au moins un contact !");
      return;
    }
    const recipientsEmails = contacts
      .filter(c => selectedContactIds.includes(c.id))
      .map(c => c.email);

    setSelectedContactForEmail({
      name: `${selectedContactIds.length} contact(s) sélectionné(s)`,
      email: recipientsEmails.join(', '),
      tag: 'Envoi Groupé',
      ids: selectedContactIds,
      warnNewsletter: contacts.some(c => selectedContactIds.includes(c.id) && c.tag === 'Newsletter')
    });
    setEmailSubject("Nouvelles fraîches de l'atelier");
    setEmailBody("Bonjour,\n\nVoici les dernières actualités du studio...");
  };

  // OPTION 1 : Générer l'URL mailto: pour ouvrir Gmail / App Mail native
  const handleOpenNativeMail = () => {
    if (!emailSubject.trim() || !emailBody.trim()) {
      notify("Veuillez remplir l'objet et le message.");
      return;
    }
    const enc = (a) => encodeURIComponent(a).replace(/%40/g, '@');
    const list = selectedContactForEmail.email.split(',').map(a => a.trim()).filter(Boolean);
    const isGroup = list.length > 1;
    const params = [`subject=${encodeURIComponent(emailSubject)}`, `body=${encodeURIComponent(emailBody)}`];
    // Envoi groupé : adresses en copie cachée pour ne pas les exposer entre destinataires.
    if (isGroup) params.unshift(`bcc=${list.map(enc).join(',')}`);
    window.location.href = `mailto:${isGroup ? '' : enc(list[0] || '')}?${params.join('&')}`;
    const visual = mediaList.find(m => m.id === attachedMediaId);
    notify(visual
      ? `Messagerie ouverte. Joins le visuel « ${visual.title} » à la main : un lien mailto ne peut pas contenir de pièce jointe ✉️`
      : 'Ouverture de votre messagerie (Gmail / Client Mail)... ✉️');
  };

  const handleSaveToHistory = (e, sent = false) => {
    e.preventDefault();
    if (!emailSubject.trim() || !emailBody.trim()) {
      notify("Veuillez remplir l'objet et le message.");
      return;
    }

    const todayStr = toIso(new Date());
    const entryIds = selectedContactForEmail.ids || (selectedContactForEmail.id ? [selectedContactForEmail.id] : []);
    const historyId = selectedContactForEmail.historyId;
    const existing = historyId ? sentHistory.find(h => h.id === historyId) : null;
    const isSent = sent || (!!existing && existing.status === 'sent');
    const newlySent = isSent && !(existing && existing.status === 'sent');
    const newHistoryEntry = {
      id: historyId || 'h_' + Date.now(),
      contactName: selectedContactForEmail.name,
      contactEmail: selectedContactForEmail.email,
      contactIds: entryIds,
      subject: emailSubject,
      date: todayStr,
      preview: emailBody.substring(0, 100) + '...',
      body: emailBody,
      status: isSent ? 'sent' : 'prepared',
      sentAt: isSent ? ((existing && existing.sentAt) || todayStr) : ''
    };

    setSentHistory(historyId
      ? sentHistory.map(h => h.id === historyId ? newHistoryEntry : h)
      : [newHistoryEntry, ...sentHistory]);
    if (newlySent && entryIds.length > 0) {
      setContacts(contacts.map(c => entryIds.includes(c.id) ? { ...c, lastContactDate: todayStr, ...relanceFor(todayStr), ...(attachedMediaId ? { shown: [...new Set([...(c.shown || []), attachedMediaId])] } : {}) } : c));
    }
    if (newlySent) onWin();
    notify(newlySent
      ? `Message archivé comme envoyé Dernier contact mis à jour.${relanceNote(todayStr)}`
      : historyId ? 'Archive mise à jour' : 'Message archivé, pas encore envoyé');
    setSelectedContactForEmail(null);
    setSelectedContactIds([]);
    setEmailSubject('');
    setEmailBody('');
    setAttachedMediaId('');
    setRelanceDays('');
  };

  const reopenHistory = (item) => {
    setSelectedContactForEmail({
      name: item.contactName,
      email: item.contactEmail,
      tag: 'Archive',
      ids: item.contactIds || [],
      historyId: item.id
    });
    setEmailSubject(item.subject);
    setEmailBody(item.body || (item.preview || '').replace(/\.\.\.$/, ''));
    setAttachedMediaId('');
    setSelectedTemplateTitle('');
    setTimeout(() => {
      const el = document.getElementById('composer-gmail');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 50);
  };

  const markSent = (item) => {
    const today = toIso(new Date());
    setSentHistory(sentHistory.map(h => h.id === item.id ? { ...h, status: 'sent', sentAt: today } : h));
    const ids = item.contactIds || [];
    if (ids.length > 0) {
      setContacts(contacts.map(c => ids.includes(c.id) ? { ...c, lastContactDate: today, ...relanceFor(today) } : c));
    }
    notify(`Marqué comme envoyé Dernier contact mis à jour.${relanceNote(today)}`);
    onWin();
    setRelanceDays('');
  };

  const markPrepared = (item) => {
    setSentHistory(sentHistory.map(h => h.id === item.id ? { ...h, status: 'prepared', sentAt: '' } : h));
    notify('Remis en « préparé, pas envoyé ».');
  };

  const copyHistory = async (item) => {
    const ok = await copyText(item.body || item.preview || '');
    notify(ok ? 'Message copié' : 'Copie impossible : sélectionne le texte à la main.');
  };

  const deleteHistory = (id) => {
    setSentHistory(sentHistory.filter(h => h.id !== id));
    setConfirmHistoryId(null);
    setOpenHistoryId(null);
    notify('Message retiré de l’historique.');
  };

  const startEditContact = (c) => {
    setEditContactId(c.id);
    setContactDraft({ name: c.name, email: c.email, detail: c.detail || '', tag: c.tag, photo: c.photo || '', followUpDate: c.followUpDate || '' });
    setConfirmContactId(null);
    setRelanceOpenId(null);
  };

  const saveContactEdit = (e) => {
    e.preventDefault();
    if (!contactDraft.name.trim() || !contactDraft.email.trim()) {
      notify('Le nom et l’e-mail sont obligatoires.');
      return;
    }
    setContacts(contacts.map(c => c.id === editContactId
      ? { ...c, ...contactDraft, name: contactDraft.name.trim(), email: contactDraft.email.trim(), color: CONTACT_COLORS[contactDraft.tag] || c.color }
      : c));
    setEditContactId(null);
    notify('Contact enregistré');
  };

  const changeStatus = (id, status) => setContacts(contacts.map(c => c.id === id ? { ...c, status } : c));

  const deleteContact = (c) => {
    setContacts(contacts.filter(x => x.id !== c.id));
    setSelectedContactIds(selectedContactIds.filter(id => id !== c.id));
    setConfirmContactId(null);
    notify('Contact supprimé. Ses messages restent dans l’historique.');
  };

  const markFollowedUp = (c, next) => {
    setContacts(contacts.map(x => x.id === c.id ? { ...x, lastContactDate: todayKey, followUpDate: next } : x));
    setRelanceOpenId(null);
    setRelanceDate('');
    notify(next ? `Relance notée Prochaine relance : ${fmtDay(next)}.` : 'Relance notée Aucune nouvelle relance prévue.');
    onWin();
  };

  const relanceSelect = (
    <label className="flex items-center gap-1.5 text-xs text-stone-600">
      Si envoyé, relancer dans :
      <select
        value={relanceDays}
        onChange={(e) => setRelanceDays(e.target.value)}
        className="p-1.5 bg-white border border-[#EBE5DA] rounded-lg text-xs font-bold text-stone-700"
      >
        <option value="">pas de relance</option>
        <option value="7">1 semaine</option>
        <option value="14">2 semaines</option>
        <option value="30">1 mois</option>
        <option value="90">3 mois</option>
      </select>
    </label>
  );

  const handleAddContact = (e) => {
    e.preventDefault();
    if (!newName.trim() || !newEmail.trim()) return;

    const colors = {
      Galerie: 'bg-purple-100 text-purple-800',
      Collectionneur: 'bg-emerald-100 text-emerald-800',
      Presse: 'bg-blue-100 text-blue-800',
      Newsletter: 'bg-amber-100 text-amber-800'
    };

    const newC = {
      id: 'c_' + Date.now(),
      name: newName,
      detail: newDetail || 'Contact',
      email: newEmail,
      tag: newTag,
      color: colors[newTag] || 'bg-stone-100 text-stone-800',
      note: '',
      photo: newPhoto,
      status: 'Premier contact',
      lastContactDate: toIso(new Date()),
      followUpDate: newFollowUp || ''
    };

    setContacts([newC, ...contacts]);
    setShowAddForm(false);
    setNewName('');
    setNewDetail('');
    setNewEmail('');
    setNewPhoto('');
    setNewFollowUp('');
    notify(`Contact "${newName}" ajouté !`);
  };

  return (
    <div className="space-y-6">
      <div className="tl-ph flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div className="tl-titlerow">
          <h2 className="font-serif font-bold text-lg text-stone-900">Mon réseau</h2>
          <InfoTip text="Tes contacts et tes messages : sélectionne des contacts pour pré-remplir un mail ou appliquer tes modèles." />
        </div>

        <div className="flex items-center gap-2">
          {selectedContactIds.length > 0 && (
            <button
              onClick={handleOpenBulkEmailComposer}
              className="bg-emerald-800 hover:bg-emerald-900 text-white text-xs px-4 py-2 rounded-2xl font-bold flex items-center gap-1.5 shadow-sm transition-all"
            >
              <Mail className="w-4 h-4 text-amber-300" />
              <span>Écrire à ({selectedContactIds.length})</span>
            </button>
          )}

          <button
            onClick={() => setShowAddForm(!showAddForm)}
            className="wd-btn wd-coralbtn"
          >
            <Plus className="w-4 h-4" />
            <span>{showAddForm ? "Fermer" : "Nouveau contact"}</span>
          </button>
        </div>
      </div>

      {/* Barre d'outils de sélection groupée */}
      <div className="rs-bar">
      <div className="rs-search">
          <Search className="w-4 h-4" />
          <input
            type="text"
            value={searchQuery}
            onChange={(e) => setSearchQuery(e.target.value)}
            placeholder="Rechercher un contact, une structure ou un e-mail"
            aria-label="Rechercher un contact"
          />
        </div>
        <div className="rs-chipsr">
          <button
            onClick={handleSelectAllContacts}
            className="wd-chip"
          >
            <CheckCircle2 className="w-3.5 h-3.5" />
            {selectedContactIds.length === filteredContacts.length && filteredContacts.length > 0 
              ? "Tout désélectionner" 
              : "Tout sélectionner"}
          </button>

          {selectedContactIds.length > 0 && (
            <span className="wd-pill">
              {selectedContactIds.length} contact(s) sélectionné(s)
            </span>
          )}
          {['Tous', 'Galerie', 'Collectionneur', 'Presse', 'Newsletter', 'À relancer'].map(tag => (
            <button
              key={tag}
              onClick={() => setFilterTag(tag)}
              className={`wd-chip ${filterTag === tag ? 'wd-chipon' : ''}`}
            >
              {tag === 'À relancer' ? <><Clock className="w-3.5 h-3.5" />{`À relancer (${contacts.filter(isDue).length})`}</> : tag}
            </button>
          ))}
        </div>
      </div>

      {showAddForm && (
        <form onSubmit={handleAddContact} className="bg-white p-5 rounded-3xl border border-[#EBE5DA] shadow-sm space-y-4">
          <h3 className="font-serif font-bold text-sm text-stone-900">Ajouter un nouveau contact</h3>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <input
              type="text"
              placeholder="Nom complet (ex: Éléonore Laurent)..."
              value={newName}
              onChange={(e) => setNewName(e.target.value)}
              className="p-2.5 bg-[#FAF7F2] border border-[#EBE5DA] rounded-xl text-xs text-stone-800 focus:outline-none"
              required
            />
            <input
              type="email"
              placeholder="Email Gmail (ex: contact@galerie.fr)..."
              value={newEmail}
              onChange={(e) => setNewEmail(e.target.value)}
              className="p-2.5 bg-[#FAF7F2] border border-[#EBE5DA] rounded-xl text-xs text-stone-800 focus:outline-none"
              required
            />
            <input
              type="text"
              placeholder="Structure / Détail (ex: Galerie Horizon)..."
              value={newDetail}
              onChange={(e) => setNewDetail(e.target.value)}
              className="p-2.5 bg-[#FAF7F2] border border-[#EBE5DA] rounded-xl text-xs text-stone-800 focus:outline-none"
            />
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div className="flex items-center gap-2">
              <label className="text-xs font-bold text-stone-700">Type :</label>
              <select
                value={newTag}
                onChange={(e) => setNewTag(e.target.value)}
                className="flex-1 p-2 bg-[#FAF7F2] border border-[#EBE5DA] rounded-xl text-xs text-stone-800 focus:outline-none font-semibold"
              >
                <option value="Galerie">🏛️ Galerie & Curateur</option>
                <option value="Collectionneur">🎨 Collectionneur</option>
                <option value="Presse">📰 Presse / Médias</option>
                <option value="Newsletter">💌 Abonnés Newsletter</option>
              </select>
            </div>

            <div className="flex items-center gap-2">
              <label className="text-xs font-bold text-stone-700">Date de relance conseillée :</label>
              <input
                type="date"
                value={newFollowUp}
                onChange={(e) => setNewFollowUp(e.target.value)}
                className="flex-1 p-2 bg-[#FAF7F2] border border-[#EBE5DA] rounded-xl text-xs text-stone-800 focus:outline-none"
              />
            </div>
          </div>

          <ContactPhotoField value={newPhoto} onSet={setNewPhoto} name={newName} notify={notify} />

          <button type="submit" className="w-full bg-[#2C2927] text-white text-xs py-2 rounded-xl font-bold">
            Enregistrer dans l'Annuaire
          </button>
        </form>
      )}

      {selectedContactForEmail && (
        <div id="composer-gmail" className="bg-white p-6 rounded-3xl border-2 border-emerald-600/30 shadow-lg space-y-4">
          <div className="flex items-center justify-between border-b border-stone-100 pb-3">
            <div className="flex items-center gap-2">
              <Mail className="w-5 h-5 text-emerald-700" />
              <h3 className="font-serif font-bold text-base text-stone-900">
                Préparer un envoi Gmail / Modèle
              </h3>
            </div>
            <button
              onClick={() => setSelectedContactForEmail(null)}
              className="text-stone-400 hover:text-stone-700 text-xs font-bold"
            >
              ✕ Fermer
            </button>
          </div>

          {(selectedContactForEmail.tag === 'Newsletter' || selectedContactForEmail.warnNewsletter) && (
            <div className="bg-amber-50 border border-amber-200/60 text-amber-900 text-xs p-3 rounded-xl">
              Envoi à une liste d’abonnés : le lien mail ne convient pas à un grand envoi (limite de taille, spam, pas de désinscription). Pour écrire à tous tes abonnés, utilise un service dédié (Brevo, MailerLite, Substack).
            </div>
          )}

          <form onSubmit={handleSaveToHistory} className="space-y-3">
            {/* Choix d'un Modèle Enregistré */}
            {mailTemplates.length > 0 && (
              <div className="bg-amber-50 p-3 rounded-2xl border border-amber-200/60 flex items-center gap-3">
                <span className="text-xs font-bold text-amber-900">🖋️ Ajouter un modèle enregistré :</span>
                <select
                  value={selectedTemplateTitle}
                  onChange={(e) => handleApplyTemplate(e.target.value)}
                  className="p-1.5 bg-white border border-amber-300 rounded-xl text-xs font-bold text-stone-800 focus:outline-none flex-1"
                >
                  <option value="">-- Ajouter un modèle / une note --</option>
                  {mailTemplates.map((tpl) => (
                    <option key={tpl.id || tpl.title} value={tpl.id || tpl.title}>{tpl.title}</option>
                  ))}
                </select>
              </div>
            )}

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label className="text-xs font-bold text-stone-600">Destinataire(s) :</label>
                <input
                  type="text"
                  value={`${selectedContactForEmail.name} (${selectedContactForEmail.email})`}
                  disabled
                  className="w-full p-2 bg-stone-100 border border-stone-200 rounded-xl text-xs text-stone-600 font-mono"
                />
              </div>

              <div>
                <label className="text-xs font-bold text-stone-600">Visuel à joindre à la main (rappel, optionnel) :</label>
                <select
                  value={attachedMediaId}
                  onChange={(e) => setAttachedMediaId(e.target.value)}
                  className="w-full p-2 bg-[#FAF7F2] border border-[#EBE5DA] rounded-xl text-xs text-stone-800 focus:outline-none"
                >
                  <option value="">-- Aucun visuel joint --</option>
                  {mediaList.map(m => (
                    <option key={m.id} value={m.id}>{TYPE_ICONS[m.type]} {m.title}</option>
                  ))}
                </select>
                {attachedMediaId && (
                  <button

const CALL_STATUSES = ['À préparer', 'En préparation', 'Envoyée', 'Acceptée', 'Refusée'];
const CALL_STATUS_COLORS = {
  'À préparer': 'bg-stone-200 text-stone-700',
  'En préparation': 'bg-amber-100 text-amber-800',
  'Envoyée': 'bg-blue-100 text-blue-800',
  'Acceptée': 'bg-emerald-100 text-emerald-800',
  'Refusée': 'bg-rose-100 text-rose-800'
};
const callStatus = (o) => o.status || 'À préparer';
const isCallOpen = (o) => ['À préparer', 'En préparation'].includes(callStatus(o));
const daysUntil = (iso) => Math.round((new Date(iso + 'T12:00:00') - new Date(toIso(new Date()) + 'T12:00:00')) / 86400000);
const deadlineLabel = (iso) => {
  const n = daysUntil(iso);
  return n < 0 ? `dépassée depuis ${plural(-n, 'jour', 'jours')}` : n === 0 ? 'aujourd’hui' : n === 1 ? 'demain' : `dans ${n} jours`;
};
const deadlineTone = (iso, open) => {
  if (!open) return 'bg-stone-100 text-stone-600';
  const n = daysUntil(iso);
  return n <= 7 ? 'bg-rose-100 text-rose-800' : n <= 21 ? 'bg-amber-100 text-amber-800' : 'bg-amber-50 text-amber-800';
};
// Appels à faire d'abord (échéance la plus proche en premier), puis les autres (les plus récents en premier).
const sortCalls = (list) => [...list].sort((a, b) => {
  const oa = isCallOpen(a);
  const ob = isCallOpen(b);
  if (oa !== ob) return oa ? -1 : 1;
  const da = a.deadline || '';
  const db = b.deadline || '';
  if (!da && !db) return 0;
  if (!da) return 1;
  if (!db) return -1;
  return oa ? da.localeCompare(db) : db.localeCompare(da);
});

const CALL_DONE_STATUSES = ['Envoyée', 'Acceptée', 'Refusée'];
// Les 5 étapes d'une candidature se déduisent de la fiche : rien de plus à saisir.
function callSteps(o) {
  const reqs = (o.info && o.info.requiredDocs) || [];
  const left = reqs.filter(d => !d.done).length;
  return [
    { id: 'read', label: 'Lire l’appel', done: hasInfo(o), todo: o.callPdf ? 'Demander à Thalie de lire l’appel' : 'Ajouter le PDF de l’appel' },
    { id: 'pieces', label: 'Choisir les pièces', done: (o.mediaIds || []).length > 0, todo: 'Choisir les pièces à présenter' },
    { id: 'statement', label: 'Écrire le statement', done: !!(o.statement || '').trim(), todo: 'Écrire le statement' },
    { id: 'docs', label: 'Réunir les documents', done: reqs.length ? left === 0 : (o.docIds || []).length > 0, todo: reqs.length ? `Cocher les pièces demandées (${left} restante${left > 1 ? 's' : ''})` : 'Joindre tes documents' },
    { id: 'send', label: 'Envoyer', done: CALL_DONE_STATUSES.includes(callStatus(o)), todo: 'Marquer comme envoyée' }
  ];
}
const callProgress = (o) => {
  const steps = callSteps(o);
  const next = steps.find(s => !s.done) || null;
  return { steps, next, done: steps.filter(s => s.done).length, total: steps.length, nextIndex: next ? steps.indexOf(next) + 1 : 0 };
};

const DOC_KINDS = ['Portfolio', 'CV', 'Lettre de motivation', 'Autre'];
const DOC_ICONS = { 'Appel à projet': '📋', Portfolio: '🖼️', CV: '📄', 'Lettre de motivation': '✉️', Autre: '📎' };
const CANDIDATE_KINDS = DOC_KINDS;
const frDate = (iso) => {
  const d = new Date(iso + 'T12:00:00');
  return !iso || isNaN(d) ? '—' : d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
};
const fmtSize = (n) => (!n ? '' : n < 1024 * 1024 ? `${Math.max(1, Math.round(n / 1024))} Ko` : `${(n / 1024 / 1024).toFixed(1)} Mo`);

const saveBlobAs = (blob, name) => {
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = u;
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(u), 1000);
};

const downloadDocument = async (d, notify) => {
  try {
    const blob = await loadFile(d.fileId);
    if (!blob) {
      notify('Ce document n’est plus disponible dans ce navigateur : ajoute-le à nouveau.');
      return;
    }
    saveBlobAs(blob, d.name || `${slugify(d.title) || 'document'}.pdf`);
    notify('Document téléchargé');
  } catch (e) {
    notify('Impossible de lire ce document dans ce navigateur.');
  }
};

const openDocument = async (d, notify) => {
  const w = window.open('', '_blank');
  try {
    const blob = await loadFile(d.fileId);
    if (!blob) {
      if (w) w.close();
      notify('Ce document n’est plus disponible dans ce navigateur : ajoute-le à nouveau.');
      return;
    }
    if (w) {
      w.location.href = URL.createObjectURL(blob);
    } else {
      saveBlobAs(blob, d.name || 'document.pdf');
    }
  } catch (e) {
    if (w) w.close();
    notify('Impossible de lire ce document dans ce navigateur.');
  }
};

// --- Infos de l'appel (remplies par Thalie ou à la main) ---
const EMPTY_INFO = { organizer: '', link: '', summary: '', eligibility: '', fees: '', themes: '', contact: '', warnings: [], keyDates: [], requiredDocs: [] };
const hasInfo = (o) => !!o.info && Object.values(o.info).some(v => (Array.isArray(v) ? v.length > 0 : !!String(v || '').trim()));
const isIsoDate = (v) => /^\d{4}-\d{2}-\d{2}$/.test(String(v || '').trim());
const dateText = (v) => (isIsoDate(v) ? frDate(v) : v);
const linesOf = (t) => String(t || '').split('\n').map(x => x.trim()).filter(Boolean);
const datesToText = (arr) => (arr || []).map(d => `${d.label}${d.date ? ' : ' + d.date : ''}`).join('\n');
const textToDates = (t) => linesOf(t).map(l => {
  const i = l.indexOf(' : ');
  return i === -1 ? { label: l, date: '' } : { label: l.slice(0, i).trim(), date: l.slice(i + 3).trim() };
});
const textToDocs = (t, prev) => linesOf(t).map(label => ({ label, done: !!(prev || []).find(p => p.label === label && p.done) }));

const draftFromCall = (o) => {
  const i = o.info || EMPTY_INFO;
  return {
    title: o.title || '', deadline: o.deadline || '', match: o.match || '', statement: o.statement || '',
    mediaIds: o.mediaIds || [], docIds: o.docIds || [], callPdf: o.callPdf || null,
    organizer: i.organizer || '', link: i.link || '', summary: i.summary || '', eligibility: i.eligibility || '',
    fees: i.fees || '', themes: i.themes || '', contact: i.contact || '',
    warningsText: (i.warnings || []).join('\n'), datesText: datesToText(i.keyDates), docsText: (i.requiredDocs || []).map(d => d.label).join('\n')
  };
};
const callFromDraft = (d, prev) => ({
  title: d.title.trim(), deadline: d.deadline, match: d.match, statement: d.statement,
  mediaIds: d.mediaIds, docIds: d.docIds, callPdf: d.callPdf,
  info: {
    organizer: d.organizer.trim(), link: d.link.trim(), summary: d.summary.trim(), eligibility: d.eligibility.trim(),
    fees: d.fees.trim(), themes: d.themes.trim(), contact: d.contact.trim(),
    warnings: linesOf(d.warningsText), keyDates: textToDates(d.datesText), requiredDocs: textToDocs(d.docsText, prev)
  }
});
