// --- AGENDA : liste + calendrier mensuel, publication manuelle ---
const downloadMedia = async (m, notify) => {
  if (m.type === 'text') {
    notify('Cette fiche est une note : il n’y a pas de fichier à télécharger.');
    return;
  }
  if (!m.url) {
    notify('Ce visuel n’est plus disponible : ré-importe-le dans le Studio.');
    return;
  }
  const exts = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif', 'video/mp4': 'mp4', 'video/quicktime': 'mov', 'video/webm': 'webm' };
  const fromUrl = (m.url.split('?')[0].match(/\.([a-z0-9]{2,4})$/i) || [])[1];
  const ext = exts[m.mime || ''] || fromUrl || (m.type === 'video' ? 'mp4' : 'jpg');
  const save = (href) => {
    const a = document.createElement('a');
    a.href = href;
    a.download = `${slugify(m.title) || 'visuel'}.${ext}`;
    a.click();
  };
  try {
    if (m.url.startsWith('blob:')) {
      save(m.url);
    } else {
      const blob = await (await fetch(m.url)).blob();
      const u = URL.createObjectURL(blob);
      save(u);
      setTimeout(() => URL.revokeObjectURL(u), 1000);
    }
    notify('Visuel téléchargé');
  } catch (e) {
    window.open(m.url, '_blank', 'noopener');
    notify('Le lien ne permet pas le téléchargement direct : il s’ouvre dans un onglet, enregistre le visuel depuis là.');
  }
};

function PostCard({ post, mediaList = [], onPatch, onStatus, onDelete, notify }) {
  const { caption, tags } = splitHashtags(post.content);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const visuals = (post.mediaIds || []).map(id => mediaList.find(m => m.id === id)).filter(m => m && m.type !== 'text');
  const now = new Date();
  const nowKey = `${toIso(now)}T${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  const isLate = post.status !== 'published' && `${post.date}T${post.time || '00:00'}` < nowKey;

  const downloadVisual = (m) => downloadMedia(m, notify);
  const textToCopy = post.platform === 'gmail' ? post.content : caption;

  const handleCopy = async (text, msg) => {
    const ok = await copyText(text);
    notify(ok ? msg : 'Copie impossible : sélectionne le texte à la main.');
  };

  const PLATFORM_URLS = { instagram: 'https://www.instagram.com/', linkedin: 'https://www.linkedin.com/feed/' };
  const copyAndOpen = async () => {
    const ok = await copyText(textToCopy);
    notify(ok ? `Texte copié ${PLATFORMS[post.platform]} s’ouvre : colle-le dans ta publication.` : 'Copie impossible : sélectionne le texte à la main.');
    window.open(PLATFORM_URLS[post.platform], '_blank', 'noopener');
  };

  const handleDownload = () => {
    const body = post.platform === 'gmail' ? post.content : caption + (tags ? `\n\n${tags}` : '');
    const url = URL.createObjectURL(new Blob([body], { type: 'text/plain;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = `${slugify(post.title) || 'post'}.txt`;
    a.click();
    URL.revokeObjectURL(url);
    notify('Texte téléchargé Ajoute ton visuel et publie quand tu veux.');
  };

  const PI = PLATFORM_ICONS[post.platform] || Mail;
  const n = [...post.content].length;
  const limit = CHAR_LIMITS[post.platform];
  const over = limit && n > limit;
  const counter = !limit ? `${n} caractères` : over ? `${n} / ${limit} · ${n - limit} en trop` : `${n} / ${limit}`;
  return (
    <div className={`ag-post ag-${post.platform} ${post.status === 'published' ? 'is-pub' : ''}`}>
      <div className="flex flex-wrap items-center gap-2">
        <span className="wd-t"><PI className="w-3.5 h-3.5" />{PLATFORMS[post.platform]}</span>
        <input
          type="text"
          value={post.title}
          onChange={(e) => onPatch(post.id, { title: e.target.value })}
          onBlur={(e) => { if (!e.target.value.trim()) onPatch(post.id, { title: `Post · ${PLATFORMS[post.platform]}` }); }}
          aria-label="Titre du post"
          className="ag-title"
        />
        <span className="wd-t">{STATUS_LABELS[post.status] || 'Brouillon'}</span>
        {isLate && <span className="wd-t" style={{ color: '#b4233c' }}>En retard</span>}
      </div>

      <div className="flex flex-wrap items-center gap-2">
        <input type="date" value={post.date} onChange={(e) => onPatch(post.id, { date: e.target.value })} aria-label="Date de publication" className="ag-in" />
        <input type="time" value={post.time} onChange={(e) => onPatch(post.id, { time: e.target.value })} aria-label="Heure de publication" className="ag-in" />
      </div>

      {visuals.length > 0 && (
        <div className="flex flex-wrap gap-3">
          {visuals.map(m => (
            <div key={m.id} className="w-28 space-y-1">
              <MediaThumb key={m.url} m={m} />
              <button onClick={() => downloadVisual(m)} className="ag-btn w-full justify-center"><Download className="w-3.5 h-3.5" />Visuel</button>
            </div>
          ))}
        </div>
      )}

      <textarea
        value={post.content}
        onChange={(e) => onPatch(post.id, { content: e.target.value })}
        aria-label="Texte du post"
        className="ag-in focus:outline-none font-sans"
      />
      <div className="flex flex-wrap items-start justify-between gap-2">
        <p className="ag-hint">{FORMAT_HINTS[post.platform]}</p>
        <span className="ag-hint flex-shrink-0" style={over ? { color: '#b4233c', fontWeight: 700 } : undefined}>{counter}</span>
      </div>

      <div className="flex flex-wrap items-center gap-2">
        {post.status === 'published' ? (
          <>
            <span className="ag-btn"><CheckCircle2 className="w-4 h-4" /> Publié</span>
            <button onClick={() => onStatus(post.id, 'ready')} className="ag-link">Annuler</button>
          </>
        ) : (
          <>
            {PLATFORM_URLS[post.platform] && (
              <button onClick={copyAndOpen} className="ag-btn ag-main"><Copy className="w-3.5 h-3.5" /> Copier & ouvrir {PLATFORMS[post.platform]}</button>
            )}
            <button onClick={() => handleCopy(textToCopy, 'Texte copié')} className="ag-btn"><Copy className="w-3.5 h-3.5" /> Copier le texte</button>
            {post.platform !== 'gmail' && tags && (
              <button onClick={() => handleCopy(tags, 'Hashtags copiés')} className="ag-btn">Copier les hashtags</button>
            )}
            <button onClick={handleDownload} className="ag-btn"><Download className="w-3.5 h-3.5" />Télécharger</button>
            {post.status === 'draft' ? (
              <button onClick={() => onStatus(post.id, 'ready')} className="ag-btn">Marquer prêt</button>
            ) : (
              <button onClick={() => onStatus(post.id, 'published')} className="ag-btn ag-main"><Check className="w-3.5 h-3.5" /> Marquer comme publié</button>
            )}
          </>
        )}
        {confirmDelete ? (
          <span className="ag-link flex items-center gap-2 ml-auto" style={{ textDecoration: 'none' }}>
            Supprimer ?
            <button onClick={() => onDelete(post.id)} className="font-bold underline">Oui</button>
            <button onClick={() => setConfirmDelete(false)} className="underline">Non</button>
          </span>
        ) : (
          <button onClick={() => setConfirmDelete(true)} className="ml-auto opacity-60 hover:opacity-100" aria-label="Supprimer ce post"><Trash2 className="w-4 h-4" /></button>
        )}
      </div>
    </div>
  );
}

function AgendaView({ postsList, setPostsList, mediaList = [], notify, onRitualDone }) {
  const now = new Date();
  const [viewMode, setViewMode] = useState('list');
  const [platformFilter, setPlatformFilter] = useState('all');
  const [cursor, setCursor] = useState({ y: now.getFullYear(), m: now.getMonth() });
  const [selectedDay, setSelectedDay] = useState(null);

  const byTime = (a, b) => `${a.date}${a.time}`.localeCompare(`${b.date}${b.time}`);
  const posts = postsList.filter(p => platformFilter === 'all' || p.platform === platformFilter);

  const patchPost = (id, changes) => {
    setPostsList(postsList.map(p => p.id === id ? { ...p, ...changes } : p));
    if (changes.date && selectedDay) setSelectedDay(changes.date);
  };
  const setStatus = (id, status) => {
    setPostsList(postsList.map(p => p.id === id ? { ...p, status } : p));
    if (status === 'published') {
      onRitualDone();
      notify('Marqué comme publié. Une belle étape franchie');
    }
  };
  const deletePost = (id) => setPostsList(postsList.filter(p => p.id !== id));

  const goToday = () => {
    const d = new Date();
    setCursor({ y: d.getFullYear(), m: d.getMonth() });
    setSelectedDay(null);
  };

  const moveMonth = (delta) => {
    const d = new Date(cursor.y, cursor.m + delta, 1);
    setCursor({ y: d.getFullYear(), m: d.getMonth() });
  };

  const card = (p) => <PostCard key={p.id} post={p} mediaList={mediaList} onPatch={patchPost} onStatus={setStatus} onDelete={deletePost} notify={notify} />;
  const todo = posts.filter(p => p.status !== 'published').sort(byTime);
  const done = posts.filter(p => p.status === 'published').sort(byTime).reverse();
  const FILTER_I = { all: LayoutGrid, instagram: Instagram, linkedin: Briefcase, gmail: Mail };

  const renderCalendar = () => {
    const offset = (new Date(cursor.y, cursor.m, 1).getDay() + 6) % 7;
    const daysInMonth = new Date(cursor.y, cursor.m + 1, 0).getDate();
    const todayIso = toIso(new Date());
    const cells = [];
    for (let i = 0; i < offset; i++) cells.push(<div key={`o${i}`} />);
    for (let d = 1; d <= daysInMonth; d++) {
      const key = `${cursor.y}-${String(cursor.m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const dayPosts = posts.filter(p => p.date === key).sort(byTime);
      cells.push(
        <button
          key={key}
          onClick={() => setSelectedDay(key === selectedDay ? null : key)}
          aria-label={`${d} ${MONTHS[cursor.m]} : ${dayPosts.length} post${dayPosts.length > 1 ? 's' : ''}`}
          className={`ag-cell ${key === selectedDay ? 'is-sel' : ''} ${key === todayIso ? 'is-today' : ''}`}
        >
          <span>{d}</span>
          {dayPosts.slice(0, 3).map(p => { const PI = PLATFORM_ICONS[p.platform] || Mail; const vm = (p.mediaIds || []).map(id => mediaList.find(m => m.id === id)).find(m => m && m.type === 'image' && m.url); return (
            <span key={p.id} className={`ag-ev ${p.platform}`} style={p.status === 'published' ? { opacity: 0.5, textDecoration: 'line-through' } : undefined}>{vm ? <img src={vm.url} alt="" className="ag-evimg" /> : <PI className="w-3 h-3 flex-shrink-0" />}<span>{p.time}</span></span>
          ); })}
          {dayPosts.length > 3 && <span className="text-xs opacity-60">+{dayPosts.length - 3}</span>}
        </button>
      );
    }

    const dayLabel = selectedDay ? new Date(selectedDay + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }) : '';
    const rTodo = selectedDay ? todo.filter(p => p.date === selectedDay) : todo;
    const rDone = selectedDay ? done.filter(p => p.date === selectedDay) : done;

    const wkStart = (() => { const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; })();
    const weekDays = Array.from({ length: 7 }, (_, i) => { const d = new Date(wkStart); d.setDate(wkStart.getDate() + i); return d; });
    const weekStrip = (
      <div className="ag-week">
        {weekDays.map(d => {
          const k = toIso(d);
          const has = posts.some(p => p.date === k);
          return (
            <button key={k} className={`${k === todayIso ? 't' : ''} ${selectedDay === k ? 'sel' : ''}`} onClick={() => setSelectedDay(selectedDay === k ? null : k)} aria-label={`${d.getDate()} ${MONTHS[d.getMonth()]}`}>
              {['L', 'M', 'M', 'J', 'V', 'S', 'D'][(d.getDay() + 6) % 7]}<b>{d.getDate()}</b>{has ? <i /> : <i style={{ opacity: 0 }} />}
            </button>
          );
        })}
      </div>
    );

    return (
      <div className="ag-split">
        <div className="wd-card">
          {weekStrip}
          <div className="wd-row">
            <button onClick={() => moveMonth(-1)} aria-label="Mois précédent" className="wd-ib"><ChevronLeft className="w-4 h-4" /></button>
            <h3 className="wd-h2 capitalize" style={{ margin: '0 auto' }}>{MONTHS[cursor.m]} {cursor.y}<button onClick={goToday} className="wd-link" style={{ fontSize: 12, marginLeft: 10 }}>Aujourd’hui</button></h3>
            <button onClick={() => moveMonth(1)} aria-label="Mois suivant" className="wd-ib"><ChevronRight className="w-4 h-4" /></button>
          </div>
          <div className="ag-cal">
            {['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'].map(d => <div key={d} className="h">{d}</div>)}
            {cells}
          </div>
        </div>
        <div className="space-y-3">
          {selectedDay && (
            <div className="wd-row">
              <h3 className="ag-sec capitalize">{dayLabel}</h3>
              <button onClick={() => setSelectedDay(null)} className="wd-chip wd-sp"><XIcon className="w-3.5 h-3.5" />Tout voir</button>
            </div>
          )}
          {posts.length === 0 && <div className="wd-empty">Aucun post ici. Compose-en un depuis l’atelier.</div>}
          {posts.length > 0 && rTodo.length === 0 && rDone.length === 0 && <div className="wd-empty">Aucun post ce jour-là. Change la date d’un post pour le déplacer ici.</div>}
          {rTodo.length > 0 && <h3 className="ag-sec">À publier ({rTodo.length})</h3>}
          {rTodo.map(card)}
          {!selectedDay && todo.length === 0 && done.length > 0 && <div className="wd-empty">Rien à publier pour l’instant</div>}
          {rDone.length > 0 && <h3 className="ag-sec" style={{ paddingTop: 8 }}>Publiés ({rDone.length})</h3>}
          {rDone.map(card)}
        </div>
      </div>
    );
  };

  return (
    <div className="space-y-4">
      <div className="tl-ph flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div className="tl-titlerow">
          <h2 className="font-serif font-bold text-lg text-stone-900">Agenda de publication</h2>
          <InfoTip text="Tu publies toi-même : copie le texte, ouvre le réseau, puis marque le post comme publié." />
        </div>
      </div>

      <div className="wd-chips" style={{ overflowX: 'auto', flexWrap: 'nowrap', paddingBottom: 2 }}>
        {['all', 'instagram', 'linkedin', 'gmail'].map(k => {
          const I = FILTER_I[k];
          return (
            <button key={k} onClick={() => setPlatformFilter(k)} className={`wd-chip whitespace-nowrap ${platformFilter === k ? 'wd-chipon' : ''}`}>
              <I className="w-3.5 h-3.5" />{k === 'all' ? `Tous les réseaux (${postsList.length})` : PLATFORMS[k]}
            </button>
          );
        })}
      </div>

      {renderCalendar()}
    </div>
  );
}

// --- SAUVEGARDE LOCALE (navigateur) ---
const failedKeys = new Set();
const flagStorage = (key, failed) => {
  const had = failedKeys.has(key);
  if (failed && !had) failedKeys.add(key);
  else if (!failed && had) failedKeys.delete(key);
  else return;
  try { window.dispatchEvent(new Event('thalie-storage')); } catch (e) { /* rien à faire */ }
};

function usePersistentState(key, initial, sanitize) {
  const [value, setValue] = useState(() => {
    let raw = null;
    try {
      raw = window.localStorage.getItem(key);
      return raw ? JSON.parse(raw) : initial;
    } catch (e) {
      // Données illisibles : on en garde une copie avant qu'elles ne soient remplacées.
      try { if (raw) window.localStorage.setItem(key + '.illisible', raw); } catch (e2) { /* rien à faire */ }
      return initial;
    }
  });
  useEffect(() => {
    try {
      window.localStorage.setItem(key, JSON.stringify(sanitize ? sanitize(value) : value));
      flagStorage(key, false);
    } catch (e) {
      flagStorage(key, true);
    }
  }, [key, value]);
  return [value, setValue];
}

@media (min-width:640px){.tl-header{padding:12px 32px}}
.tl-brand{display:flex;align-items:center;gap:12px;min-width:0}
.tl-logo{width:42px;height:42px;flex:none;border-radius:var(--r2);background-color:var(--logo-bg);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:inset 0 1px 3px var(--primary-a)}
.tl-brand-name{font-weight:700;font-size:1.05rem;letter-spacing:-.01em;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-brand-sub{display:none}
@media (min-width:640px){.tl-brand-sub{display:flex}}
.tl-crumb{display:none;position:absolute;left:50%;transform:translateX(-50%);padding:7px 18px;border-radius:999px;background:var(--surface);border:1px solid var(--border2);font-size:.75rem;font-weight:700;color:var(--t6);box-shadow:var(--shadow);align-items:center;gap:8px;white-space:nowrap}
@media (min-width:1100px){.tl-crumb{display:flex}}
.tl-actions{display:flex;align-items:center;gap:10px;flex:none}
.tl-me{display:flex;align-items:center;gap:8px;padding:3px;border-radius:999px;background:var(--surface);border:1px solid var(--border2)}
.tl-me:hover{border-color:var(--accent)}
.tl-avatar{display:inline-block;flex:none;border-radius:50%;background-size:cover;background-position:center;background-color:var(--soft3)}
.tl-avatar-empty{display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--hero-to))}
.tl-avatar-xl{border:4px solid var(--surface-solid);box-shadow:var(--shadow)}


/* ---- Structure ---- */
.tl-shell{max-width:80rem;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:20px}
@media (min-width:640px){.tl-shell{padding:24px 32px 56px}}
@media (min-width:768px){.tl-shell{flex-direction:row;gap:24px}}
.tl-side-wrap{flex:none;width:100%}
@media (min-width:768px){.tl-side-wrap{width:16.5rem}}
.tl-side{background:var(--side-bg);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border:1px solid var(--border2);border-radius:var(--r3);padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
@media (min-width:768px){.tl-side{position:sticky;top:5rem;max-height:calc(100vh - 6.5rem);overflow-y:auto}}
.tl-side-label{display:none;padding:10px 12px 4px;font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--t4)}
@media (min-width:768px){.tl-side-label{display:block}}
.tl-profile{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px;border-radius:var(--r2);background:var(--soft);border:1px solid var(--border)}
.tl-profile:hover{border-color:var(--accent)}
.tl-profile.is-active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-a20)}
.tl-nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tl-nav::-webkit-scrollbar{display:none}
@media (min-width:768px){.tl-nav{flex-direction:column;overflow:visible}}
.tl-nav-item{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none;text-align:left;padding:9px 12px;border-radius:var(--r2);color:var(--t6);border:1px solid transparent}
@media (min-width:768px){.tl-nav-item{width:100%}}
.tl-nav-item:hover{background:var(--soft2);color:var(--text)}
.tl-nav-item.is-active{background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow)}
.tl-nav-ico{flex:none;display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:calc(var(--r1) + 2px);background:var(--soft2);color:var(--accent-text)}
.tl-nav-item.is-active .tl-nav-ico{background:rgba(255,255,255,.14);color:var(--icon-on-primary)}
.tl-nav-text{min-width:0}
.tl-nav-label{font-size:.78rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-nav-sub{font-size:.7rem;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-compact .tl-nav-sub{display:none}
@media (max-width:767px){.tl-nav-sub{display:none}.tl-profile{display:none}.tl-victory{display:none}}
.tl-badge{flex:none;font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--soft3);color:var(--t6)}
.tl-nav-item.is-active .tl-badge{background:var(--highlight);color:#1B1917}
.tl-victory{margin-top:16px;padding:16px;text-align:center;border-radius:var(--r3);border:1px solid var(--border2);background:linear-gradient(135deg,var(--tint-bg),var(--tint2))}
.tl-main{flex:1;min-width:0}

/* ---- Bandeau d'accueil (type « Explorer ») ---- */
.tl-hero{position:relative;overflow:hidden;border-radius:var(--r3);min-height:210px;display:flex;align-items:center;justify-content:center;text-align:center;padding:36px 20px;background-size:cover;background-position:center;background-image:linear-gradient(135deg,var(--hero-from),var(--hero-to));box-shadow:var(--shadow);isolation:isolate}
.tl-hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(135deg,var(--hero-a),var(--hero-b))}
.tl-hero::after{content:"";position:absolute;z-index:-1;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 65%)}
.tl-hero-inner{max-width:36rem;display:flex;flex-direction:column;align-items:center;gap:10px;color:#fff}
.tl-hero-title{font-size:1.6rem;line-height:1.2;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.35)}
@media (min-width:640px){.tl-hero-title{font-size:2rem}}
.tl-hero-sub{font-size:.8rem;color:rgba(255,255,255,.88);text-shadow:0 1px 8px rgba(0,0,0,.3)}
.tl-hero-btn{margin-top:6px;display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;background:var(--surface-solid);color:var(--text);font-size:.75rem;font-weight:700;box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}
.tl-hero-btn:hover{transform:translateY(-1px)}

.tl-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px}
.tl-section-head h3{font-size:1.05rem;font-weight:700;color:var(--text)}
.tl-seeall{font-size:.75rem;font-weight:700;color:var(--accent-text);padding:4px 8px;border-radius:999px}
.tl-seeall:hover{background:var(--tint1)}

/* ---- Cartes « à la une » ---- */
.tl-feature{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:300px;overflow:hidden;border-radius:var(--r3);border:1px solid var(--accent-a35);background:var(--scrim);box-shadow:var(--shadow);cursor:pointer;text-align:left;color:#fff}
.tl-feature-cover{position:absolute;inset:0 0 auto 0;height:62%}
.tl-cover-media{width:100%;height:100%;object-fit:cover;display:block}
.tl-cover-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:18px;font-size:3rem;background:linear-gradient(135deg,var(--hero-from),var(--hero-to));color:rgba(255,255,255,.9)}
.tl-cover-fallback p{font-size:.8rem;line-height:1.5;font-style:italic;text-align:center}
.tl-feature-panel{position:relative;margin-top:96px;padding:46px 20px 18px;border-radius:50% 50% 0 0 / 38px 38px 0 0;background:var(--scrim-a);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tl-egg{position:absolute;left:50%;top:-30px;transform:translateX(-50%);width:60px;height:68px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;background:var(--surface-solid);border:3px solid var(--accent);box-shadow:0 8px 18px -6px rgba(0,0,0,.5)}
.tl-feature h4{font-size:1.2rem;font-weight:700;color:#fff;margin-bottom:4px}
.tl-feature p.tl-desc{font-size:.75rem;color:rgba(255,255,255,.82);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:3em}
.tl-feature-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-size:.7rem;color:rgba(255,255,255,.7)}
.tl-tag{padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-size:.68rem;font-weight:600}

/* ---- Cartes « à venir » ---- */
.tl-mini{display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--r3);border:1px solid var(--accent-a35);background:var(--surface);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));box-shadow:var(--shadow);text-align:left;width:100%;cursor:pointer}
.tl-mini:hover{border-color:var(--accent)}
.tl-hex{flex:none;width:52px;height:58px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(145deg,var(--accent),var(--hero-from))}
.tl-mini h4{font-size:.85rem;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-mini p{font-size:.72rem;color:var(--t5)}
.tl-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;background:var(--soft2);border:1px solid var(--border2);font-size:.72rem;color:var(--t6)}
.tl-chip strong{color:var(--text)}
.tl-today{padding:18px;border-radius:var(--r3);border:1px solid var(--accent-a35);background:var(--surface);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.tl-today-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.tl-today-head h3{font-size:1.1rem;font-weight:700;color:var(--text)}
.tl-today-head p{font-size:.75rem;color:var(--t5)}
.tl-flash{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;background:var(--primary);color:var(--on-primary);font-size:.75rem;font-weight:700}
.tl-flash:hover{background:var(--primary-hover)}
.tl-act{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;border-radius:var(--r2);background:var(--soft);border:1px solid var(--border2);border-left:4px solid var(--border3)}
button.tl-act:hover{border-color:var(--accent);transform:translateY(-1px)}
.tl-act.is-rose{border-left-color:#E11D48}
.tl-act.is-amber{border-left-color:var(--accent)}
.tl-act.is-calm{border-left-color:#10B981;cursor:default}
.tl-act-emoji{flex:none;font-size:1.4rem}
.tl-act-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tl-act-body strong{font-size:.85rem;color:var(--text)}
.tl-act-body span{font-size:.75rem;color:var(--t5)}
.tl-act-cta{flex:none;font-size:.75rem;font-weight:700;color:var(--accent-text);white-space:nowrap}
@media (max-width:520px){.tl-act-cta{display:none}}
.tl-today-more{font-size:.72rem;color:var(--t5);padding:0 4px}
.tl-steps{padding:14px;border-radius:var(--r2);background:var(--soft);border:1px solid var(--border2);display:flex;flex-direction:column;gap:10px}
.tl-steps-top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.78rem;color:var(--text)}
.tl-steps-top span{font-family:ui-monospace,monospace;font-size:.72rem;color:var(--t5)}
.tl-bar{height:8px;border-radius:999px;background:var(--soft3);overflow:hidden}
.tl-bar>div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--highlight));transition:width .4s ease}
.tl-pills{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.tl-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 6px;border-radius:999px;border:1px solid var(--border3);background:var(--surface-solid);font-size:.72rem;font-weight:600;color:var(--t6)}
.tl-pill:hover{border-color:var(--accent)}
.tl-pill-n{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--soft3);font-size:.68rem;font-weight:800}
.tl-pill.is-done{color:var(--t5)}
.tl-pill.is-done .tl-pill-n{background:#10B981;color:#fff}
.tl-pill.is-next{border-color:var(--accent);color:var(--text);box-shadow:0 0 0 3px var(--accent-a20)}
.tl-pill.is-next .tl-pill-n{background:var(--accent);color:var(--on-accent)}
.tl-next{align-self:flex-start;padding:7px 14px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:.75rem;font-weight:700}
.tl-next:hover{background:var(--accent-hover)}
.tl-prog{height:10px;border-radius:999px;background:var(--soft3);overflow:hidden}
.tl-prog>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--highlight));transition:width .2s}
.tl-restore{padding:14px;border-radius:var(--r2);border:1px solid var(--accent-a60);background:var(--tint-bg);display:flex;flex-direction:column;gap:8px;font-size:.75rem;color:var(--t7)}
.tl-empty{padding:18px;text-align:center;font-size:.75rem;color:var(--t5);border:1px dashed var(--border3);border-radius:var(--r3)}

/* ---- Notification ---- */
.tl-toast{position:fixed;z-index:50;bottom:24px;right:24px;left:24px;max-width:26rem;margin-left:auto;display:flex;align-items:center;gap:12px;padding:12px 18px;border-radius:var(--r2);background:var(--scrim);color:#fff;border:1px solid var(--accent-a35);box-shadow:0 14px 34px -10px rgba(0,0,0,.55);font-size:.85rem;font-weight:500}

/* ---- Profil ---- */
.tl-profile-cover{height:150px;background-size:cover;background-position:center;background-image:linear-gradient(135deg,var(--hero-from),var(--hero-to))}
@media (min-width:640px){.tl-profile-cover{height:190px}}
.tl-profile-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;margin-top:-48px}
.tl-profile-head>div:nth-child(2){padding-bottom:4px}
.tl-thumb{flex:none;width:72px;height:72px;border-radius:var(--r2);background:var(--soft2) center/cover no-repeat;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center}
.tl-thumb.is-round{border-radius:50%}

/* ---- Réglages ---- */
.tl-presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tl-preset{display:flex;flex-direction:column;gap:8px;padding:8px;text-align:left;border-radius:var(--r2);background:var(--soft);border:2px solid var(--border2)}
.tl-preset:hover{border-color:var(--border3)}
.tl-preset.is-on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-a20)}
.tl-preset-sw{display:block;height:46px;border-radius:calc(var(--r1) - 2px);border:1px solid var(--border2)}
.tl-color{flex:none;width:42px;height:42px;padding:0;border:1px solid var(--border3);border-radius:var(--r1);background:none;cursor:pointer}
.tl-color::-webkit-color-swatch-wrapper{padding:3px}
.tl-color::-webkit-color-swatch{border:none;border-radius:calc(var(--r1) - 3px)}
.tl-switch{flex:none;position:relative;width:44px;height:26px;border-radius:999px;background:var(--border3);transition:background-color .2s}
.tl-switch span{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .2s}
.tl-switch.is-on{background:var(--accent)}
.tl-switch.is-on span{transform:translateX(18px)}
.tl-range{height:6px}
`;

// --- NOUVEAU DESIGN (socle) : barre du haut, widgets, feuilles, barre mobile ---
const DESIGN_CSS = String.raw`
.tl-app{--p-rose:#F2B9B9;--p-peach:#F9CDA8;--p-lav:#D9CCF7;--p-mint:#BDE8D6;--p-butter:#FBD85D;--p-blue:#C7D9F5;--p-pink:#F4B8E4;--ink-fixed:#1d1b19}
.tl-app :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tl-app .bg-white.rounded-3xl,.tl-app .bg-white.rounded-2xl{box-shadow:var(--shadow),0 0 0 1px rgba(29,27,25,.05)}
.tl-app .bg-white.rounded-full,.tl-app .bg-white.rounded-xl{border-color:var(--border2)}

/* ---- barre du haut ---- */
.tl-topwrap{position:sticky;top:0;z-index:30;padding:10px 16px 0}
.tl-top{max-width:1680px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:calc(var(--r3) + 4px);background:var(--surface);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.3);backdrop-filter:blur(var(--blur)) saturate(1.3);border:1px solid var(--edge);box-shadow:var(--shadow),0 0 0 1px rgba(29,27,25,.05)}
.tl-brand2{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer}
.tl-logo2{width:38px;height:38px;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--highlight));background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:19px}
.tl-name2{max-width:170px;font-weight:700;font-size:1rem;letter-spacing:-.01em;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-nav2{display:flex;gap:2px;margin:0 auto;padding:4px;border-radius:999px;background:var(--soft2);border:1px solid var(--edge);overflow-x:auto;scrollbar-width:none}
.tl-nav2::-webkit-scrollbar{display:none}
.tl-np{position:relative;display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--t6);cursor:pointer;white-space:nowrap}
.tl-np:hover{background:var(--soft3);color:var(--text)}
.tl-np.on{background:var(--primary);color:var(--on-primary);box-shadow:0 8px 18px -10px rgba(0,0,0,.6)}
.tl-np .dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:1.5px solid var(--surface-solid)}
@media (max-width:1180px){.tl-np .lbl{display:none}.tl-np.on .lbl{display:inline}}
.tl-acts{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
.tl-nav2+.tl-acts{margin-left:0}
.tl-ib{position:relative;width:38px;height:38px;border-radius:50%;background:var(--soft2);border:1px solid var(--edge);display:inline-flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer;flex:none}
.tl-ib:hover{background:var(--soft3)}
.tl-ib.on{background:var(--tint2);border-color:var(--accent)}
.tl-ib .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:1.5px solid var(--surface-solid)}
.tl-dep{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:12px;box-shadow:0 10px 20px -12px var(--accent)}
.tl-dep:hover{background:var(--accent-hover)}
.tl-wrap{max-width:1680px;margin:0 auto;padding:16px 16px 56px}
.tl-seclab{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin:6px 4px 0;color:var(--t6)}
.tl-seclab:after{content:"";flex:1;height:1px;background:var(--border2)}
.tl-seclab b{width:24px;height:24px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:inline-flex;align-items:center;justify-content:center;font-size:12px}

/* ---- barre du bas et pastille Thalie (mobile) ---- */
.tl-dock{display:none;position:fixed;left:14px;right:14px;bottom:14px;z-index:40;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:30px;background:rgba(29,27,25,.88);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 20px 34px -16px #000a}
.tl-dock button{width:58px;height:46px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#cfc8c0;font-size:9px;font-weight:600;position:relative}
.tl-dock button.on{background:#fff;color:#1d1b19}
.tl-dock .plus{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);margin-top:-22px;box-shadow:0 14px 24px -8px var(--accent),0 0 0 6px rgba(29,27,25,.88)}
.tl-dock .dot{position:absolute;top:4px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.tl-thpill{display:none;position:fixed;right:16px;bottom:96px;z-index:39;align-items:center;gap:7px;padding:11px 16px 11px 13px;border-radius:999px;font-size:13px;font-weight:700;color:#1d1b19;background:linear-gradient(135deg,#f9b9dc,#c9b4f5 55%,#a8c8f5);border:1px solid rgba(255,255,255,.7);box-shadow:0 14px 26px -12px #8e74e0,inset 0 1px 0 #fffb}
@media (max-width:820px){
  .tl-nav2,.tl-dep{display:none}
  .tl-acts{margin-left:auto}
  .tl-dock{display:flex}.tl-thpill{display:flex}
  .tl-wrap{padding-bottom:210px}
  .tl-toast{bottom:104px}

/* ---- feuilles, fenêtres, cloche ---- */

  const [lastBackup, setLastBackup] = usePersistentState('thalie.lastBackup', '');
  const [lastJson, setLastJson] = usePersistentState('thalie.lastJson', '');
  const [since] = usePersistentState('thalie.since', toIso(new Date()));
  const theme = buildTheme(settings);

  const [activeTab, setActiveTab] = useState(START_TABS.some(t => t[0] === settings.startTab) ? settings.startTab : 'dashboard');

  // Les images (profil, logo, fonds) sont gardées dans le navigateur, comme les médias importés.
  useEffect(() => {
    IMAGE_KEYS.forEach(k => {
      loadFile('img:' + k).then(v => { if (v) setImages(im => ({ ...im, [k]: v })); }).catch(() => {});
    });
  }, []);
  const setImage = (key, value) => {
    setImages(im => ({ ...im, [key]: value || '' }));
    (value ? saveFile('img:' + key, value) : deleteFile('img:' + key))
      .catch(() => notify('Le navigateur n’a pas pu garder cette image pour la prochaine visite.'));
  };
  const resetSettings = () => {
    setRawSettings(DEFAULT_SETTINGS);
    setImage('hero', '');
    setImage('bg', '');
    notify('Apparence remise à zéro');
  };
  const resetProfile = () => {
    setProfile(DEFAULT_PROFILE);
    ['avatar', 'logo', 'cover'].forEach(k => setImage(k, ''));
    notify('Profil remis à zéro.');
  };

  useEffect(() => {
    document.documentElement.style.background = theme.vars['--bg'];
    document.body.style.background = theme.vars['--bg'];
    document.documentElement.style.fontSize = settings.textScale + '%';
    return () => { document.documentElement.style.fontSize = ''; };
  }, [theme.vars['--bg'], settings.textScale]);
  useEffect(() => {
    document.title = profile.studioName && profile.studioName !== DEFAULT_STUDIO_NAME ? profile.studioName : 'THALIE Studio';
  }, [profile.studioName]);

  const [wins, setWins] = usePersistentState('thalie.wins', []);
  const addWin = () => setWins(w => [...w.slice(-199), toIso(new Date())]);
  const weekStartIso = (() => {
    const d = new Date();
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return toIso(d);
  })();
  const ritualsDone = wins.filter(d => d >= weekStartIso).length;
  const [storageFailed, setStorageFailed] = useState(failedKeys.size > 0);
  useEffect(() => {
    const h = () => setStorageFailed(failedKeys.size > 0);
    window.addEventListener('thalie-storage', h);
    h();
    return () => window.removeEventListener('thalie-storage', h);
  }, []);
  const toastRef = React.useRef(null);
  const endRef = React.useRef(0);
  
  const [timerSeconds, setTimerSeconds] = useState(settings.timerMinutes * 60);
  const [timerActive, setTimerActive] = useState(false);

  const [mediaList, setMediaList] = usePersistentState('thalie.media', [], dropBlobUrls);
  // Retrouve les photos et vidéos gardées dans le navigateur après un rechargement.
  useEffect(() => {
    const missing = mediaList.filter(m => m.fileId && !m.url);
    if (missing.length === 0) return;
    (async () => {
      const urls = {};
      for (const m of missing) {
        try {
          const blob = await loadFile(m.fileId);
          if (blob) urls[m.id] = URL.createObjectURL(blob);
        } catch (e) {
          // Fichier introuvable : la fiche garde simplement son icône.
        }
      }
      setMediaList(list => list.map(m => (urls[m.id] ? { ...m, url: urls[m.id] } : m)));
    })();
  }, []);

  const [postsList, setPostsList] = usePersistentState('thalie.posts', []);
  const [contactsList, setContactsList] = usePersistentState('thalie.contacts', []);
  const [openCallsList, setOpenCallsList] = usePersistentState('thalie.opencalls', []);
  const [documents, setDocuments] = usePersistentState('thalie.documents', []);

  // Reprise : un PDF d'appel déjà rangé dans « Mes documents » passe dans son appel.
  useEffect(() => {
    const legacy = documents.filter(d => d.kind === 'Appel à projet');
    if (legacy.length === 0) return;
    const linked = new Set(openCallsList.map(o => o.callDocId).filter(Boolean));
    setOpenCallsList(list => list.map(o => {
      const d = legacy.find(x => x.id === o.callDocId);
      return d && !o.callPdf ? { ...o, callPdf: { fileId: d.fileId, title: d.title, name: d.name, size: d.size, addedAt: d.addedAt }, callDocId: '' } : o;
    }));
    setDocuments(list => list
      .filter(d => !(d.kind === 'Appel à projet' && linked.has(d.id)))
      .map(d => (d.kind === 'Appel à projet' ? { ...d, kind: 'Autre' } : d)));
  }, []);
  const [sentHistory, setSentHistory] = usePersistentState('thalie.history', []);

  const [templates, setTemplates] = usePersistentState('thalie.templates', [
    { id: 't_signature', type: 'instagram', title: 'Signature Instagram', content: '#ArtContemporain #PeintureAHuile #AtelierArtiste #ArtFrançais' },
    { id: 't_intro', type: 'gmail', title: 'Intro Newsletter', content: 'Chers passionnés d’art, voici quelques nouvelles fraîches depuis l’atelier...' }
  ]);

  // Reprise des modèles déjà enregistrés : identifiant unique et type.
  useEffect(() => {
    if (templates.every(t => t.id && t.type)) return;
    const guess = { 'Signature Instagram': 'instagram', 'Intro Newsletter': 'gmail' };
    setTemplates(list => list.map((t, i) => ({ ...t, id: t.id || 't_' + Date.now() + '_' + i, type: t.type || guess[t.title] || 'other' })));
  }, []);

  const [sweetToast, setSweetToast] = useState(null);

  // Exemples fournis au départ : retirés seulement s'ils n'ont pas été modifiés.
  // Nettoyage unique : retire les anciens exemples fournis au départ (posts, contacts, appel, médias, message),
  // seulement s'ils sont encore tels quels. Ce que tu as créé ou renommé est conservé.
  useEffect(() => {
    let done = false;
    try { done = !!localStorage.getItem('thalie.demoCleaned'); } catch (e) { done = true; }
    if (done) return;
    const gone = (list, key, ids) => list.filter(x => !(ids[x.id] && (x[key] === ids[x.id])));
    setMediaList(l => gone(l, 'title', { m1: 'Série Éphémère - Toile #4', m2: 'Work in progress - Gestuelle nocturne' }));
    setPostsList(l => gone(l, 'title', { p1: 'Présentation Série Éphémère', p2: 'Notes de Coulisses LinkedIn' }));
    setContactsList(l => gone(l, 'name', { c1: 'Éléonore Laurent', c2: 'Marc Antoine', c3: 'Claire Dupont', c4: 'Abonnés Newsletter Atelier' }));
    setOpenCallsList(l => gone(l, 'title', { o1: 'Résidence de Création - Fondation d’Art 2027' }));
    setSentHistory(l => gone(l, 'subject', { h1: 'Dossier d’exposition & Nouvelles toiles' }));
    try { localStorage.setItem('thalie.demoCleaned', '1'); } catch (e) { /* facultatif */ }
  }, []);

  const exportBackup = () => {
    const data = {
      exportedAt: new Date().toISOString(),
      media: dropBlobUrls(mediaList),
      posts: postsList,
      contacts: contactsList,
      history: sentHistory,
      templates,
      opencalls: openCallsList,
      documents,
      profile,
      settings,
      wins
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = `thalie-sauvegarde-${toIso(new Date())}.json`;
    a.click();
    URL.revokeObjectURL(url);
    setLastJson(toIso(new Date()));
    notify('Données téléchargées Ce n’est pas une sauvegarde complète (ni photos, vidéos, PDF) : le rappel continue tant que tu n’as pas fait le .zip.');
  };

  // Un message plus long reste plus longtemps ; un nouveau message remplace le précédent sans être coupé trop tôt.
  const notify = (msg) => {
    setSweetToast(msg);
    clearTimeout(toastRef.current);
    const readMs = Math.min(12000, 1500 + String(msg).length * 55);
    toastRef.current = setTimeout(() => setSweetToast(null), Math.max(settings.toastSeconds * 1000, readMs));
  };

  useEffect(() => {
    try {
      if (sessionStorage.getItem('thalie.restored')) {
        sessionStorage.removeItem('thalie.restored');
        notify('Sauvegarde restaurée Tout est de retour.');
      }
    } catch (e) { /* facultatif */ }
  }, []);

  const handleQuickAddMedia = (type, titleInput, notesInput, fileUrlInput, tagsInput = [], filesInput = []) => {
    const isText = type === 'text';
    const base = {
      notes: notesInput.trim(),
      tags: tagsInput.filter(Boolean),
      date: 'À l’instant',
      addedAt: toIso(new Date()),
      status: 'draft',
      manualPosts: { instagram: '', linkedin: '', gmail: '' }
    };
    const hasFiles = !isText && filesInput.length > 0;
    let items;
    if (hasFiles) {
      items = filesInput.map((f, i) => {
        const id = 'm_' + Date.now() + '_' + i;
        return {
          ...base,
          id,
          fileId: id,
          mime: f.type,
          type,
          url: URL.createObjectURL(f),
          title: filesInput.length === 1 && titleInput.trim() ? titleInput.trim() : f.name.replace(/\.[^.]+$/, '')
        };
      });
    } else {
      items = [{
        ...base,
        id: 'm_' + Date.now(),
        type,
        url: isText ? '' : (fileUrlInput || '').trim(),
        title: titleInput.trim() || (isText ? notesInput.trim().slice(0, 40) : type === 'video' ? 'Vidéo d’atelier' : 'Photo d’atelier')
      }];
    }

    setMediaList([...items, ...mediaList]);

    if (!hasFiles) {
      notify('Nouveau contenu ajouté avec succès !');
      return;
    }
    Promise.all(items.map((it, i) => saveFile(it.fileId, filesInput[i])))
      .then(() => notify('Ajouté à l’atelier Tes fichiers sont gardés dans ce navigateur.'))
      .catch(() => notify('Ajouté, mais le navigateur n’a pas pu garder les fichiers : ils ne resteront que pour cette session.'));
  };

  // Le décompte se calcule sur l'heure de fin : il reste juste même si l'onglet est en arrière-plan.
  useEffect(() => {
    if (!timerActive) return undefined;
    const tick = () => {
      const left = Math.max(0, Math.round((endRef.current - Date.now()) / 1000));
      setTimerSeconds(left);
      if (left === 0) {
        setTimerActive(false);
        notify("Session Flash terminée ! Bravo");
      }
    };
    const id = setInterval(tick, 500);
    return () => clearInterval(id);
  }, [timerActive]);

  const toggleTimer = () => {
    if (timerActive) {
      setTimerActive(false);
      return;
    }
    const start = timerSeconds > 0 ? timerSeconds : settings.timerMinutes * 60;
    setTimerSeconds(start);
    endRef.current = Date.now() + start * 1000;
    setTimerActive(true);
  };
  const resetTimer = () => { setTimerActive(false); setTimerSeconds(settings.timerMinutes * 60); };
  useEffect(() => { if (!timerActive) setTimerSeconds(settings.timerMinutes * 60); }, [settings.timerMinutes]);

  const formatTime = (sec) => {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  };

  const backup = backupInfo(lastBackup, since, settings.backupReminderDays);
  // --- Nouveau design : widgets, feuilles, navigation ---
  const [layoutD, setLayoutD] = usePersistentState('thalie.widgets.d', WIDGET_DEFAULT_D);
  const [layoutM, setLayoutM] = usePersistentState('thalie.widgets.m', WIDGET_DEFAULT_M);
  const mobile = useMedia('(max-width: 820px)');
  const [sheet, setSheet] = useState(null);
  const [intent, setIntent] = useState(null);
  const tab = activeTab === 'profile' ? 'settings' : activeTab;
  const go = (t) => { setSheet(null); setActiveTab(t === 'profile' ? 'settings' : t); try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) { /* facultatif */ } };
  const notifs = buildNotifications({ postsList, contactsList, openCallsList, backup });
  const resetWidgets = () => {
    setLayoutD(WIDGET_DEFAULT_D.map(x => x.slice()));
    setLayoutM(WIDGET_DEFAULT_M.map(x => x.slice()));
    notify('Disposition du tableau de bord remise à zéro');
  };
  const askThalie = (kind) => {
    if (kind === 'summarize') { go('opencalls'); return; }
    setIntent(kind);
    go('studio');
  };
  const onFlash = () => {
    if (!timerActive) toggleTimer();
    notify('Session lancée : une petite action à la fois');
  };
  // « Terminer d'un geste » (mobile) : un post prévu passe en publié ; le reste ouvre la bonne page.
  const completeAction = (a) => {
    if (a.id.startsWith('p') && a.tab === 'agenda') {
      const pid = a.id.slice(1);
      setPostsList(l => l.map(p => (p.id === pid ? { ...p, status: 'published' } : p)));
      addWin();
      notify('Marqué comme publié. Une belle étape franchie');
    } else {
      go(a.tab);
    }
  };
  // Bascule clair / sombre : mémorise ta palette pour la retrouver en revenant au clair.
  const toggleDark = () => {
    setRawSettings(raw => {
      const cur = withDefaults(raw);
      const isDark = lumOf(cur.colors.bg) < 0.35;
      if (isDark) {
        const back = cur.lightBackup && cur.lightBackup.colors ? cur.lightBackup : { preset: 'atelier', colors: { ...PRESETS.atelier.colors } };
        return { ...cur, preset: back.preset, colors: { ...back.colors }, lightBackup: null };
      }
      return { ...cur, lightBackup: { preset: cur.preset, colors: { ...cur.colors } }, preset: 'nuit', colors: { ...PRESETS.nuit.colors } };
    });
  };
  const NAVS = [
    ['dashboard', 'Aujourd’hui', Home], ['studio', 'Atelier', ImageIcon], ['templates', 'Modèles', PenLine], ['agenda', 'Agenda', CalendarDays],
    ['contacts', 'Réseau', Mail], ['opencalls', 'Open calls', Landmark], ['cloud', 'Sauvegarde', ShieldCheck], ['settings', 'Réglages', Sliders]
  ];
  const lateAgenda = notifs.groups.some(g => g.key === 'late' && g.items.some(i => i.tab === 'agenda'));
  const ctx = {
    profile, setProfile, resetProfile,
    settings, setSettings, setColors, applyPreset, resetSettings, resetWidgets,
    images, setImage,
    stats: { media: mediaList.length, posts: postsList.length, contacts: contactsList.length }
  };

  return (
    <UiContext.Provider value={ctx}>
    <div className={`tl-app ${settings.reduceMotion ? 'tl-calm' : ''} ${tab === 'dashboard' ? 'tl-dash' : ''}`} data-mode={theme.dark ? 'dark' : 'light'} style={theme.vars}>
      <style>{CUSTOM_CSS}</style>
      <style>{THEME_CSS}</style>
      <style>{DESIGN_CSS}</style>
      <style>{PAGES_CSS}</style>
      <div className="tl-bg" aria-hidden="true" />
      {images.bg && <div className="tl-bg-img" aria-hidden="true" style={{ backgroundImage: `url(${images.bg})` }} />}
      {images.bg && <div className="tl-veil" aria-hidden="true" />}

      <div className="tl-layer">
      {sweetToast && (
        <div className="tl-toast" role="status">
          <Sparkles className="w-4 h-4 text-amber-300" />
          <span>{sweetToast}</span>
        </div>
      )}

      {storageFailed && (
        <div role="alert" className="bg-rose-50 border-b border-rose-200 text-rose-900 text-xs px-4 py-3 flex flex-wrap items-center justify-center gap-x-4 gap-y-1">
          <span>Ton navigateur n’arrive pas à enregistrer tes modifications (espace plein ou stockage bloqué). Ne ferme pas cette page avant d’avoir téléchargé tes données.</span>
          <button onClick={exportBackup} className="font-bold underline">Télécharger mes données (.json)</button>
          <button onClick={() => go('cloud')} className="font-bold underline">Ouvrir la sauvegarde</button>
        </div>
      )}

      <div className="tl-topwrap">
        <header className="tl-top">
          <div className="tl-brand2" onClick={() => go('dashboard')} role="button" tabIndex={0} onKeyDown={(e) => { if (e.key === 'Enter') go('dashboard'); }}>
            <div className="tl-logo2" style={images.logo ? { backgroundImage: `url(${images.logo})` } : undefined}>{!images.logo && (profile.logoEmoji || '🌿')}</div>
            <h1 className="font-serif tl-name2">{profile.studioName || DEFAULT_STUDIO_NAME}</h1>
          </div>

          <nav className="tl-nav2" aria-label="Navigation principale">
            {NAVS.map(([id, label, Icon]) => (
              <button key={id} className={`tl-np ${tab === id ? 'on' : ''}`} onClick={() => go(id)} aria-current={tab === id ? 'page' : undefined} title={label}>
                <Icon className="w-4 h-4" /><span className="lbl">{label}</span>
                {id === 'cloud' && backup.due && <i className="dot" />}
              </button>
            ))}
          </nav>

          <div className="tl-acts">
            <button className="tl-ib" onClick={toggleDark} aria-label={theme.dark ? 'Passer en mode clair' : 'Passer en mode sombre'} title={theme.dark ? 'Mode clair' : 'Mode sombre'}>
              {theme.dark ? <Sun className="w-4 h-4" /> : <Moon className="w-4 h-4" />}
            </button>
            <button className="tl-ib" onClick={() => setSheet(sheet === 'notif' ? null : 'notif')} aria-label="Notifications" title="Notifications">
              <Bell className="w-4 h-4" />{notifs.total > 0 && <i className="dot" />}
            </button>
            <button className="tl-ib" onClick={() => go('settings')} aria-label="Profil et réglages" title="Profil et réglages" style={{ padding: 0 }}>
              <Avatar src={images.avatar} name={profile.name} size={34} />
            </button>
          </div>
        </header>
      </div>

      <div className="tl-wrap">
        <main className="tl-main2">
          {tab === 'dashboard' && (
            <WidgetDashboard
              layout={mobile ? layoutM : layoutD}
              setLayout={mobile ? setLayoutM : setLayoutD}
              resetLayout={() => (mobile ? setLayoutM(WIDGET_DEFAULT_M.map(x => x.slice())) : setLayoutD(WIDGET_DEFAULT_D.map(x => x.slice())))}
              mobile={mobile}
              profile={profile}
              images={images}
              settings={settings}
              mediaList={mediaList}
              postsList={postsList}
              contactsList={contactsList}
              openCallsList={openCallsList}
              onNavigate={go}
              ritualsDone={ritualsDone}
              backup={backup}
              lastBackup={lastBackup}
              timer={{ seconds: timerSeconds, active: timerActive, toggle: toggleTimer, reset: resetTimer, format: formatTime }}
              onFlash={onFlash}
              onComplete={completeAction}
              openNotif={() => setSheet('notif')}
              onToggleDark={toggleDark}
              isDark={theme.dark}
              hasNotif={notifs.total > 0}
              openDeposit={() => setSheet('deposit')}
              askThalie={askThalie}
            />
          )}

          {tab === 'studio' && (
            <StudioView
              templates={templates}
              mediaList={mediaList}
              setMediaList={setMediaList}
              postsList={postsList}
              setPostsList={setPostsList}
              notify={notify}
              onRitualDone={addWin}
              intent={intent}
              onIntentDone={() => setIntent(null)}
              openDeposit={() => setSheet('deposit')}
            />
          )}

          {tab === 'templates' && (
            <TemplatesView
              templates={templates}
              setTemplates={setTemplates}
              notify={notify}
            />
          )}

          {tab === 'agenda' && (
            <AgendaView mediaList={mediaList}
              postsList={postsList}
              setPostsList={setPostsList}
              notify={notify}
              onRitualDone={addWin}
            />
          )}

          {tab === 'contacts' && (
            <ContactsView onWin={addWin}
              contacts={contactsList}
              setContacts={setContactsList}
              sentHistory={sentHistory}
              setSentHistory={setSentHistory}
              templates={templates}
              mediaList={mediaList}
              notify={notify}
            />
          )}

          {tab === 'opencalls' && (
            <OpenCallsView onWin={addWin} setOpenCallsList={setOpenCallsList} mediaList={mediaList} documents={documents} setDocuments={setDocuments}
              openCallsList={openCallsList}
              notify={notify}
            />
          )}

          {tab === 'cloud' && (
            <CloudView notify={notify} onBackupJson={exportBackup} onBackedUp={() => { setLastBackup(toIso(new Date())); addWin(); }} lastBackup={lastBackup} lastJson={lastJson} backup={backup} />
          )}

          {tab === 'settings' && <ProfileSettingsView notify={notify} />}
        </main>
      </div>

      <button className="tl-thpill" onClick={() => setSheet('thalie')}><Sparkles className="w-4 h-4" />Thalie</button>
      <nav className="tl-dock" aria-label="Navigation mobile">
        <button className={tab === 'dashboard' ? 'on' : ''} onClick={() => go('dashboard')}><Home className="w-5 h-5" />Aujourd’hui</button>
        <button className={tab === 'studio' ? 'on' : ''} onClick={() => go('studio')}><ImageIcon className="w-5 h-5" />Atelier</button>
        <button className="plus" onClick={() => setSheet('deposit')} aria-label="Déposer dans l’atelier"><Plus className="w-6 h-6" /></button>
        <button className={tab === 'agenda' ? 'on' : ''} onClick={() => go('agenda')}><CalendarDays className="w-5 h-5" />Agenda{lateAgenda && <i className="dot" />}</button>
        <button className={['templates', 'contacts', 'opencalls', 'cloud', 'settings'].includes(tab) ? 'on' : ''} onClick={() => setSheet('more')}><LayoutGrid className="w-5 h-5" />Plus{backup.due && <i className="dot" />}</button>
      </nav>

      <DepositSheet open={sheet === 'deposit'} onClose={() => setSheet(null)} onAdd={handleQuickAddMedia} notify={notify} />
      <NotifPanel open={sheet === 'notif'} onClose={() => setSheet(null)} data={notifs} go={go} mobile={mobile} />
      <ThalieSheet open={sheet === 'thalie'} onClose={() => setSheet(null)} onPick={askThalie} />
      <MoreSheet open={sheet === 'more'} onClose={() => setSheet(null)} go={go} backup={backup} />
      </div>
    </div>
    </UiContext.Provider>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error(error, info);
  }
  downloadData() {
    const out = { exportedAt: new Date().toISOString() };
    BACKUP_KEYS.forEach(k => {
      try {
        const raw = localStorage.getItem('thalie.' + k);
        if (raw !== null) out[k] = JSON.parse(raw);
      } catch (e) { /* clé illisible : ignorée */ }
    });
    const url = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = `thalie-secours-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  render() {
    if (!this.state.error) return this.props.children;
    const box = { maxWidth: 520, margin: '12vh auto', padding: 24, background: '#fff', border: '1px solid #EFECE6', borderRadius: 24, color: '#2C2927', fontFamily: 'system-ui, sans-serif', lineHeight: 1.5 };
    const btn = { padding: '10px 16px', borderRadius: 16, border: 'none', background: '#2C2927', color: '#fff', fontWeight: 700, cursor: 'pointer', marginRight: 8, marginTop: 8 };
    return (
      <div style={box} role="alert">
        <h1 style={{ fontSize: 20, margin: '0 0 8px' }}>Oups, quelque chose s’est mal passé</h1>
        <p style={{ margin: '0 0 8px' }}>Tes données sont toujours dans ce navigateur. Recharge la page ; si le problème revient, télécharge d’abord tes données par sécurité.</p>
        <button style={btn} onClick={() => window.location.reload()}>Recharger la page</button>
        <button style={{ ...btn, background: '#92400E' }} onClick={() => this.downloadData()}>Télécharger mes données (.json)</button>
        <p style={{ fontSize: 12, color: '#78716C', marginTop: 16 }}>Détail technique à transmettre si besoin : {String((this.state.error && this.state.error.message) || this.state.error)}</p>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
